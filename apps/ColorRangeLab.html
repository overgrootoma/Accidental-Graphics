<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Color Range · Accidental Graphics</title>
  <meta name="description" content="Extract, paint, and layer color bands from multiple images.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/data.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@100..900,0..100&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/face cursor.png">
  <script defer src="../scripts/navConfig.js"></script>
  <script defer src="../scripts/navMenu.js"></script>
  <script src="../scripts/dataLayer.js"></script>
  <script defer src="../scripts/settingsToggle.js" data-panel="#controls"></script>
  <script src="../scripts/savedSettings.js"></script>
  <script defer src="../scripts/sampleMedia.js"></script>
  <style>
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .layer-card {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .layer-card.is-active {
      border-color: var(--blue-accent);
      box-shadow: 0 10px 28px rgba(41, 151, 255, 0.25);
    }

    .layer-card.is-collapsed .layer-controls,
    .layer-card.is-collapsed .focus-row {
      display: none;
    }

    .layer-card__row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }

    .layer-title {
      flex: 1;
      font-weight: 700;
      cursor: pointer;
    }

    .layer-card__actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      width: 100%;
    }

    .layer-card__actions button {
      width: 100%;
    }

    .layer-controls {
      display: grid;
      gap: 12px;
    }

    .focus-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
      flex-wrap: wrap;
    }

    .focus-row > * {
      min-width: 0;
    }

    .focus-row label {
      flex: 1 1 200px;
      margin: 0;
    }

    .focus-row input[type="color"] {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      padding: 0;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .focus-row button {
      flex: 1 1 140px;
      min-width: 140px;
      height: 44px;
    }

    .stacked {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stacked em {
      font-style: normal;
      opacity: 0.7;
      margin-left: 6px;
      letter-spacing: 0.04em;
    }

    button.is-active {
      box-shadow: 0 0 0 3px rgba(41, 151, 255, 0.25);
    }

    select {
      border-radius: 12px;
      padding: 10px;
    }

    /* Pick hint: a small chip, so the picture is never dimmed while sampling. */
    .stage-overlay {
      position: absolute;
      top: 10px;
      left: 50%;
      max-width: calc(100% - 20px);
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: #000;
      color: #fff;
      letter-spacing: 0.08em;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, -6px);
      transition: opacity var(--ag-dur-2, 0.2s) var(--ag-ease-out, ease), transform var(--ag-dur-2, 0.2s) var(--ag-ease-out, ease);
      pointer-events: none;
      text-transform: uppercase;
      font-size: 0.7rem;
      z-index: 6;
    }

    .stage-overlay.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #canvas { touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
    #canvas.is-picking { cursor: crosshair; }

    /* Colour probe: ring on the sampled pixel, loupe + readout beside it (DOM only, never exported). */
    .probe-ring, .probe-loupe { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; opacity: 0; will-change: transform; }
    .probe-ring { width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 1px solid #fff; mix-blend-mode: difference; }
    .probe-ring::before, .probe-ring::after { content: ""; position: absolute; background: #fff; }
    .probe-ring::before { left: 50%; top: -7px; bottom: -7px; width: 1px; }
    .probe-ring::after { top: 50%; left: -7px; right: -7px; height: 1px; }
    .probe-loupe { width: 130px; background: #000; border: 1px solid rgba(255, 255, 255, 0.7); font: 0.62rem/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; color: #fff; font-variant-numeric: tabular-nums; }
    .probe-loupe.is-on, .probe-ring.is-on { opacity: 1; }
    .probe-loupe canvas { display: block; width: 128px; height: 128px; image-rendering: pixelated; }
    .probe-loupe__cell { position: absolute; left: 50%; top: 64px; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 1px solid #fff; mix-blend-mode: difference; }
    .probe-loupe__data { display: grid; padding: 4px 6px; border-top: 1px solid rgba(255, 255, 255, 0.4); }
    .probe-loupe__swatch { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border: 1px solid #fff; vertical-align: -1px; }

    @media (max-width: 768px), (pointer: coarse) { body.panel-ui-page #controls select { font-size: 16px; } }

    /* Desktop: end the stage at the footer line. */
    @media (min-width: 901px) { body.panel-ui-page:not(.ag-sheet) .canvas-stage { align-self: flex-start; height: calc(100dvh - 72px - 34px); flex: 1 1 0; } }
    /* Margin around the picture for the lab data (css/data.css), which sits outside the canvas. */
    body.panel-ui-page .canvas-stage { box-sizing: border-box; padding: var(--ag-hud-band, 22px) var(--ag-hud-side, 16px); }
    /* Bottom-sheet layout: the stage is exactly the area above the sheet, the page never scrolls. */
    body.ag-sheet.panel-ui-page { height: 100dvh; overflow: hidden; --ag-nav-h: 72px; }
    @media (max-width: 480px) { body.ag-sheet.panel-ui-page { --ag-nav-h: 60px; } }
    body.ag-sheet.panel-ui-page #main {
      height: calc(100dvh - var(--ag-nav-h) - var(--ag-sheet-h, 0px));
      min-height: 0; padding: 0; overflow: hidden; border-top: 0;
      flex: none; /* ends at the sheet instead of growing to the body height */
    }
    body.ag-sheet.panel-ui-page .canvas-stage { flex: 1 1 auto; min-height: 0; padding: var(--ag-hud-band, 18px) var(--ag-hud-side, 0px); }
    body.ag-sheet .app-year { display: none; }

    .muted {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.9rem;
      margin: 0;
    }

    .export-panel .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .sample-buttons {
      width: 100%;
    }

    .sample-buttons > * {
      flex: 1 1 0;
    }

    .sample-buttons .file-button {
      width: 100%;
      justify-content: center;
      border-radius: 12px;
    }

    @media (max-width: 560px) {
      .focus-row {
        flex-direction: column;
        align-items: stretch;
      }

      .focus-row button {
        width: 100%;
        min-width: 0;
      }
    }

  </style>
</head>
<body class="app-page panel-ui-page">
  <div id="main">
    <div id="controls">
      <div class="panel-ui-header">
        <div>
          <p class="motion-eyebrow">Color Range</p>
          <h1>Settings</h1>
        </div>
        <div class="button-row sample-buttons">
          <label class="file-button file-button--full">
            Import Image
            <input id="imageInput" type="file" accept="image/*" multiple>
          </label>
          <button id="sampleChooserBtn" type="button" class="file-button file-button--full">Choose sample images</button>
        </div>
        <button id="pickColorBtn" type="button">Pick a color from the canvas</button>
      </div>

      <details class="motion-group">
        <summary>Layers</summary>
        <div class="motion-group-body">
        <div class="layer-list" id="layerList">
          <p class="muted">Drop in a still or load a sample to start painting.</p>
        </div>
        </div>
      </details>

      <details class="motion-group">
        <summary>Export</summary>
        <div class="motion-group-body export-panel">
        <div class="button-row">
          <button id="exportBtn" type="button">Export canvas</button>
          <button id="clearBtn" type="button">Reset</button>
        </div>
        <p class="muted" style="margin-top: 10px;">Visible layers are flattened with their blend modes and opacity.</p>
        </div>
      </details>
    </div>

    <div class="canvas-stage">
      <canvas id="canvas" aria-label="Color Range canvas"></canvas>
      <div class="stage-overlay" id="pickHint">Click to pick a colour</div>
      <div class="probe-ring" id="probeRing"></div>
      <div class="probe-loupe" id="probeLoupe" aria-hidden="true">
        <canvas id="probeCanvas" width="54" height="54"></canvas>
        <span class="probe-loupe__cell"></span>
        <div class="probe-loupe__data">
          <span><i class="probe-loupe__swatch" id="probeSwatch"></i><span id="probeRgb"></span></span>
          <span id="probeHex"></span>
          <span id="probeHsl"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="sample-modal" id="sampleModal" aria-hidden="true">
    <div class="sample-dialog" role="dialog" aria-modal="true" aria-labelledby="sampleModalTitle">
      <div class="sample-dialog__head">
        <h2 id="sampleModalTitle" style="margin:0;">Choose sample images</h2>
        <button type="button" id="closeSampleModalBtn">Close</button>
      </div>
      <div class="sample-grid" id="sampleGrid"></div>
      <div class="sample-dialog__actions">
        <button type="button" id="cancelSampleBtn">Cancel</button>
        <button type="button" id="confirmSampleBtn">Add selected</button>
      </div>
    </div>
  </div>
  <div class="app-year">2026 Accidental Graphics</div>

  <script>
    (() => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const fileInput = document.getElementById('imageInput');
      const sampleChooserBtn = document.getElementById('sampleChooserBtn');
      const sampleModal = document.getElementById('sampleModal');
      const sampleGrid = document.getElementById('sampleGrid');
      const confirmSampleBtn = document.getElementById('confirmSampleBtn');
      const cancelSampleBtn = document.getElementById('cancelSampleBtn');
      const closeSampleModalBtn = document.getElementById('closeSampleModalBtn');
      const exportBtn = document.getElementById('exportBtn');
      const clearBtn = document.getElementById('clearBtn');
      const pickColorBtn = document.getElementById('pickColorBtn');
      const layerList = document.getElementById('layerList');
      const pickHint = document.getElementById('pickHint');
      const stage = canvas.parentElement;
      const probeRing = document.getElementById('probeRing');
      const probeLoupe = document.getElementById('probeLoupe');
      const probeCtx = document.getElementById('probeCanvas').getContext('2d');
      const probeSwatch = document.getElementById('probeSwatch');
      const probeText = {
        rgb: document.getElementById('probeRgb'),
        hex: document.getElementById('probeHex'),
        hsl: document.getElementById('probeHsl'),
      };
      probeCtx.imageSmoothingEnabled = false;
      const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
      const hud = AGData.hud(canvas, { canvas, code: 'CRL', fps: false, slots: { specimen: 'tr' } });

      let sampleData = [
        { src: '../images/sampleimages/sample01.jpg', label: 'Sample 01' },
        { src: '../images/sampleimages/sample02.jpg', label: 'Sample 02' },
        { src: '../images/sampleimages/sample03.jpg', label: 'Sample 03' },
        { src: '../images/sampleimages/sample04.jpg', label: 'Sample 04' },
        { src: '../images/sampleimages/sample05.jpg', label: 'Sample 05' },
        { src: '../images/sampleimages/sample06.jpg', label: 'Sample 06' },
        { src: '../images/sampleimages/sample07.jpg', label: 'Sample 07' }
      ];
      const mediaSamples = window.SampleMedia?.getList?.('images') || [];
      if (mediaSamples.length) {
        sampleData = mediaSamples.map((sample, i) => ({
          src: sample.src,
          label: sample.label || `Sample ${i + 1}`,
        }));
      }
      const blendModes = ['normal', 'multiply', 'overlay', 'screen', 'lighten', 'darken', 'difference'];

      const layers = [];
      let activeLayerId = null;
      let baseAspect = 1.45;
      // Settings a new layer starts with: the last ones you used, remembered between visits.
      const layerDefaults = {
        color: '#ff9c4c',
        tolerance: 56,
        brushSize: 8,
        opacity: 0.88,
        blendMode: 'normal',
        invert: false,
      };
      let pickMode = false;
      let viewWidth = 920;
      let viewHeight = 580;
      const selectedSamples = new Set();
      let sampleModalReturnFocus = null;

      function testImageLoad(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          if (/^https?:\/\//i.test(src)) {
            img.crossOrigin = 'anonymous';
          }
          img.onload = () => resolve(src);
          img.onerror = () => reject(new Error('Image load failed'));
          img.src = src;
        });
      }

      async function fetchImageObjectURL(src) {
        const response = await fetch(src);
        if (!response.ok) throw new Error('Failed to fetch sample image.');
        const blob = await response.blob();
        return URL.createObjectURL(blob);
      }

      function randomId() {
        return 'layer-' + Math.random().toString(16).slice(2);
      }

      function hexToRgb(hex) {
        const clean = hex.replace('#', '');
        const expanded = clean.length === 3
          ? clean.split('').map((c) => c + c).join('')
          : clean.padEnd(6, '0');
        const int = parseInt(expanded, 16);
        return {
          r: (int >> 16) & 255,
          g: (int >> 8) & 255,
          b: int & 255,
        };
      }

      function rgbToHex(r, g, b) {
        return (
          '#' +
          [r, g, b]
            .map((v) => Math.max(0, Math.min(255, v)))
            .map((v) => v.toString(16).padStart(2, '0'))
            .join('')
        );
      }

      function hueOf(r, g, b, max, min) {
        const d = max - min;
        if (!d) return 0;
        let h;
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        return h < 0 ? h + 360 : h;
      }

      function rgbToHsv(r, g, b) {
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        return [hueOf(r, g, b, max, min), max ? ((max - min) / max) * 100 : 0, (max / 255) * 100];
      }

      function rgbToHsl(r, g, b) {
        const max = Math.max(r, g, b) / 255;
        const min = Math.min(r, g, b) / 255;
        const l = (max + min) / 2;
        const d = max - min;
        const [h] = rgbToHsv(r, g, b);
        return [h, d ? (d / (1 - Math.abs(2 * l - 1))) * 100 : 0, l * 100];
      }

      // The layer's image drawn at the current view size: pixels for matching, probing and the loupe.
      function getSource(layer) {
        const w = viewWidth;
        const h = viewHeight;
        const cached = layer.src;
        if (cached && cached.w === w && cached.h === h) return cached;
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const cx = c.getContext('2d', { willReadFrequently: true });
        const fit = fitImage(layer.image, w, h);
        cx.drawImage(layer.image, fit.x, fit.y, fit.w, fit.h);
        layer.src = { w, h, canvas: c, data: cx.getImageData(0, 0, w, h).data };
        return layer.src;
      }

      function getAspect() {
        if (layers.length && layers[0].image?.naturalWidth && layers[0].image?.naturalHeight) {
          return layers[0].image.naturalWidth / layers[0].image.naturalHeight;
        }
        return baseAspect;
      }

      function fitImage(image, w, h) {
        const aspect = image.naturalWidth && image.naturalHeight
          ? image.naturalWidth / image.naturalHeight
          : 1;
        const stageAspect = w / h;
        let drawW, drawH;
        if (aspect > stageAspect) {
          drawW = w;
          drawH = w / aspect;
        } else {
          drawH = h;
          drawW = h * aspect;
        }
        return {
          x: (w - drawW) / 2,
          y: (h - drawH) / 2,
          w: drawW,
          h: drawH,
        };
      }

      function resizeCanvas() {
        const aspect = getAspect();
        // The stage's padding is the margin for the lab data around the canvas.
        const pad = getComputedStyle(stage);
        const maxWidth = Math.max(1, stage.clientWidth - parseFloat(pad.paddingLeft) - parseFloat(pad.paddingRight));
        const maxHeight = Math.max(1, stage.clientHeight - parseFloat(pad.paddingTop) - parseFloat(pad.paddingBottom));
        let width = maxWidth;
        let height = width / aspect;
        if (height > maxHeight) {
          height = maxHeight;
          width = height * aspect;
        }
        viewWidth = Math.max(1, Math.round(width));
        viewHeight = Math.max(1, Math.round(height));
        canvas.width = Math.max(1, Math.round(viewWidth * dpr));
        canvas.height = Math.max(1, Math.round(viewHeight * dpr));
        canvas.style.width = viewWidth + 'px';
        canvas.style.height = viewHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        markAllDirty();
        hud.refresh();
        draw();
      }

      function markAllDirty() {
        layers.forEach((layer) => {
          layer.dirty = true;
        });
      }

      function syncActiveHighlight() {
        const cards = layerList?.querySelectorAll('.layer-card') || [];
        cards.forEach((card) => {
          const cardId = card.getAttribute('data-layer-id');
          const isMatch = cardId === activeLayerId;
          card.classList.toggle('is-active', isMatch);
        });
      }

      function setActiveLayer(id, options = {}) {
        const { silent = false } = options;
        activeLayerId = id;
        if (silent) {
          syncActiveHighlight();
        } else {
          renderLayerList();
        }
      }

      function createLayerFromSource(src, label, revokeUrl = false) {
        const img = new Image();
        if (/^https?:\/\//i.test(src)) {
          img.crossOrigin = 'anonymous';
        }
        img.onload = () => {
          if (!layers.length && img.naturalWidth && img.naturalHeight) {
            baseAspect = img.naturalWidth / img.naturalHeight;
            resizeCanvas();
          }
          const layer = {
            id: randomId(),
            name: label || `Layer ${layers.length + 1}`,
            image: img,
            ...layerDefaults,
            visible: true,
            buffer: null,
            dirty: true,
            collapsed: false,
          };
          layers.push(layer);
          setActiveLayer(layer.id);
          hud.newSpecimen();
          render();
          if (revokeUrl) {
            URL.revokeObjectURL(src);
          }
        };
        img.onerror = () => {
          alert('Could not load that image.');
          if (revokeUrl) {
            URL.revokeObjectURL(src);
          }
        };
        img.src = src;
      }

      function rebuildLayerBuffer(layer) {
        if (!layer?.image) return;
        const t0 = performance.now();
        const { w, h, data, canvas: srcCanvas } = getSource(layer);
        if (!layer.mask || layer.mask.width !== w || layer.mask.height !== h) {
          layer.mask = new ImageData(w, h);
          layer.work = document.createElement('canvas');
          layer.work.width = w;
          layer.work.height = h;
          layer.workCtx = layer.work.getContext('2d');
          layer.blur = null;
        }
        const out = layer.mask.data;
        out.fill(0);
        const target = hexToRgb(layer.color);
        const tolerance = layer.tolerance;
        const tol2 = tolerance * tolerance;
        const feather = Math.max(0, layer.brushSize || 0);
        const featherSpan = Math.max(1, feather * 2);
        const outer2 = (tolerance + featherSpan) * (tolerance + featherSpan);
        const invert = Boolean(layer.invert);
        const [targetH] = rgbToHsv(target.r, target.g, target.b);

        // Range statistics over the pixels inside the tolerance sphere (what the HUD reports).
        let inRange = 0;
        let total = 0;
        let hMin = 0, hMax = 0, sMin = 100, sMax = 0, vMin = 100, vMax = 0;
        let hasContent = false;
        for (let i = 0; i < data.length; i += 4) {
          const a = data[i + 3];
          if (a === 0) continue;
          total++;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const dr = r - target.r;
          const dg = g - target.g;
          const db = b - target.b;
          const d2 = dr * dr + dg * dg + db * db;
          let cover = 0;
          if (d2 <= tol2) {
            cover = 1;
            inRange++;
            const max = r > g ? (r > b ? r : b) : (g > b ? g : b);
            const min = r < g ? (r < b ? r : b) : (g < b ? g : b);
            const sat = max ? ((max - min) / max) * 100 : 0;
            const val = (max / 255) * 100;
            if (sat < sMin) sMin = sat;
            if (sat > sMax) sMax = sat;
            if (val < vMin) vMin = val;
            if (val > vMax) vMax = val;
            if (max !== min && sat > 4) {
              let dh = hueOf(r, g, b, max, min) - targetH;
              if (dh > 180) dh -= 360; else if (dh < -180) dh += 360;
              if (dh < hMin) hMin = dh;
              if (dh > hMax) hMax = dh;
            }
          } else if (feather > 0 && d2 <= outer2) {
            cover = Math.max(0, 1 - (Math.sqrt(d2) - tolerance) / featherSpan);
          }
          if (invert) cover = 1 - cover;
          const alpha = Math.round(cover * a);
          if (alpha > 0) {
            out[i] = r;
            out[i + 1] = g;
            out[i + 2] = b;
            out[i + 3] = alpha;
            hasContent = true;
          }
        }
        layer.stats = {
          pct: total ? (inRange / total) * 100 : 0,
          hMin, hMax,
          sMin: inRange ? sMin : 0, sMax,
          vMin: inRange ? vMin : 0, vMax,
        };

        if (!hasContent) {
          // Nothing matches: show the plain image so the layer never goes blank.
          layer.buffer = srcCanvas;
        } else {
          layer.workCtx.putImageData(layer.mask, 0, 0);
          if (feather > 1) {
            if (!layer.blur) {
              layer.blur = document.createElement('canvas');
              layer.blur.width = w;
              layer.blur.height = h;
            }
            const blurCtx = layer.blur.getContext('2d');
            blurCtx.clearRect(0, 0, w, h);
            blurCtx.filter = `blur(${Math.round(feather * 0.6)}px)`;
            blurCtx.drawImage(layer.work, 0, 0);
            blurCtx.filter = 'none';
            layer.buffer = layer.blur;
          } else {
            layer.buffer = layer.work;
          }
        }
        layer.ms = performance.now() - t0;
        layer.dirty = false;
      }

      // Redraws are coalesced to one per frame (sliders fire input faster than that).
      let drawQueued = false;
      function render() {
        if (drawQueued) return;
        drawQueued = true;
        requestAnimationFrame(() => {
          drawQueued = false;
          draw();
        });
      }

      function draw() {
        const displayW = viewWidth;
        const displayH = viewHeight;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        layers.forEach((layer) => {
          if (!layer.visible) return;
          if (layer.dirty || !layer.buffer) {
            rebuildLayerBuffer(layer);
          }
          if (!layer.buffer) return;
          ctx.save();
          ctx.globalAlpha = layer.opacity;
          ctx.globalCompositeOperation = layer.blendMode;
          ctx.drawImage(layer.buffer, 0, 0, displayW, displayH);
          ctx.restore();
        });

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        updateHud();
      }

      function signed(value) {
        return (value < 0 ? '-' : '+') + AGData.fmt(Math.abs(value), 0, 3);
      }

      function updateHud() {
        const active = layers.find((l) => l.id === activeLayerId);
        hud.set('Layers', layers.length ? AGData.fmt(layers.length, 0, 2) : null, 'n', 'tl');
        if (!active) {
          ['Source', 'Focus', 'Tol', 'Match', 'Sat', 'Val', 'Hue', 'Render'].forEach((k) => hud.set(k, null));
          return;
        }
        const t = hexToRgb(active.color);
        const [h, sat, val] = rgbToHsv(t.r, t.g, t.b);
        hud.set('Source', `${active.image.naturalWidth} × ${active.image.naturalHeight}`, 'px', 'tl');
        hud.set('Focus', `H${AGData.fmt(h, 0, 3)} S${AGData.fmt(sat, 0, 3)} V${AGData.fmt(val, 0, 3)}`, 'hsv', 'tl');
        hud.set('Tol', `±${AGData.fmt(active.tolerance, 0, 3)}`, 'rgb dist', 'tl');
        const st = active.stats;
        if (st) {
          hud.set('Match', AGData.fmt(st.pct, 1, 5), '% px', 'br');
          hud.set('Hue', `${signed(st.hMin)}…${signed(st.hMax)}`, '°', 'br');
          hud.set('Sat', `${AGData.fmt(st.sMin, 0, 3)}–${AGData.fmt(st.sMax, 0, 3)}`, '%', 'br');
          hud.set('Val', `${AGData.fmt(st.vMin, 0, 3)}–${AGData.fmt(st.vMax, 0, 3)}`, '%', 'br');
          hud.set('Render', AGData.fmt(active.ms || 0, 1, 4), 'ms', 'br');
        }
      }

      function updatePickMode(on) {
        pickMode = on;
        pickColorBtn?.classList.toggle('is-active', pickMode);
        pickColorBtn?.setAttribute('aria-pressed', String(pickMode));
        pickHint?.classList.toggle('is-visible', pickMode);
        if (pickMode && pickHint) pickHint.textContent = coarsePointer ? 'Touch and drag, release to pick' : 'Click to pick a colour';
        canvas.classList.toggle('is-picking', pickMode);
        if (!pickMode) hideProbe();
      }

      // ---------- Colour probe (pointer events: mouse hover/click, touch press-drag-release) ----------
      let probing = false;
      let probeShown = false;

      function hideProbe() {
        probing = false;
        probeShown = false;
        probeRing.classList.remove('is-on');
        probeLoupe.classList.remove('is-on');
      }

      function setText(node, text) {
        if (node.textContent !== text) node.textContent = text;
      }

      // Returns the sampled colour under the pointer (or null outside the image) and moves the probe there.
      function probeAt(evt, show) {
        const active = layers.find((l) => l.id === activeLayerId);
        if (!active?.image) return null;
        const rect = canvas.getBoundingClientRect();
        const vx = (evt.clientX - rect.left) * (viewWidth / rect.width);
        const vy = (evt.clientY - rect.top) * (viewHeight / rect.height);
        const sx = Math.floor(vx);
        const sy = Math.floor(vy);
        if (sx < 0 || sy < 0 || sx >= viewWidth || sy >= viewHeight) {
          if (show) hideProbe();
          return null;
        }
        const src = getSource(active);
        const i = (sy * src.w + sx) * 4;
        if (src.data[i + 3] === 0) {
          if (show) hideProbe();
          return null;
        }
        const color = { r: src.data[i], g: src.data[i + 1], b: src.data[i + 2] };
        if (!show) return color;

        const hex = rgbToHex(color.r, color.g, color.b);
        const hsl = rgbToHsl(color.r, color.g, color.b);
        probeSwatch.style.background = hex;
        setText(probeText.rgb, `RGB ${AGData.fmt(color.r, 0, 3)} ${AGData.fmt(color.g, 0, 3)} ${AGData.fmt(color.b, 0, 3)}`);
        setText(probeText.hex, hex.toUpperCase());
        setText(probeText.hsl, `HSL ${AGData.fmt(hsl[0], 0, 3)}° ${AGData.fmt(hsl[1], 0, 3)} ${AGData.fmt(hsl[2], 0, 3)}`);
        probeCtx.clearRect(0, 0, 54, 54);
        probeCtx.drawImage(src.canvas, sx - 4, sy - 4, 9, 9, 0, 0, 54, 54);

        // Position inside the stage; a finger hides what is under it, so the loupe sits above the touch point.
        const stageRect = stage.getBoundingClientRect();
        const px = evt.clientX - stageRect.left;
        const py = evt.clientY - stageRect.top;
        const loupeW = 132;
        const loupeH = 196;
        const touch = evt.pointerType !== 'mouse';
        let lx = touch ? px - loupeW / 2 : px + 24;
        let ly = touch ? py - loupeH - 36 : py + 24;
        if (!touch && lx + loupeW > stageRect.width) lx = px - 24 - loupeW;
        if (!touch && ly + loupeH > stageRect.height) ly = py - 24 - loupeH;
        if (touch && ly < 4) ly = py + 36;
        lx = Math.max(4, Math.min(stageRect.width - loupeW - 4, lx));
        ly = Math.max(4, Math.min(stageRect.height - loupeH - 4, ly));
        probeRing.style.transform = `translate3d(${px}px, ${py}px, 0)`;
        probeLoupe.style.transform = `translate3d(${lx}px, ${ly}px, 0)`;
        if (!probeShown) {
          probeShown = true;
          probeRing.classList.add('is-on');
          probeLoupe.classList.add('is-on');
        }
        return color;
      }

      function commitPick(color) {
        const active = layers.find((l) => l.id === activeLayerId);
        if (!active || !color) return;
        active.color = rgbToHex(color.r, color.g, color.b);
        active.dirty = true;
        updatePickMode(false);
        renderLayerList();
        render();
      }

      canvas.addEventListener('pointerdown', (evt) => {
        if (!pickMode || (evt.pointerType === 'mouse' && evt.button !== 0)) return;
        evt.preventDefault();
        probing = true;
        try { canvas.setPointerCapture(evt.pointerId); } catch (err) { /* synthetic pointer */ }
        probeAt(evt, true);
      });
      canvas.addEventListener('pointermove', (evt) => {
        if (!pickMode) return;
        if (probing || evt.pointerType === 'mouse') probeAt(evt, true);
      });
      canvas.addEventListener('pointerup', (evt) => {
        if (!pickMode || !probing) return;
        const color = probeAt(evt, false);
        hideProbe();
        // Releasing outside the image cancels, so a touch can be aborted by dragging away.
        if (color) commitPick(color);
      });
      canvas.addEventListener('pointercancel', hideProbe);
      canvas.addEventListener('pointerleave', (evt) => {
        if (evt.pointerType === 'mouse' && !probing) hideProbe();
      });

      function renderLayerList() {
        layerList.innerHTML = '';
        if (!layers.length) {
          const empty = document.createElement('p');
          empty.className = 'muted';
          empty.textContent = 'Drop in a still or load a sample to start painting.';
          layerList.appendChild(empty);
          return;
        }

        layers.forEach((layer) => {
          const card = document.createElement('div');
          const isActive = layer.id === activeLayerId;
          card.className = `layer-card ${isActive ? 'is-active' : ''} ${layer.collapsed ? 'is-collapsed' : ''}`;
          card.dataset.layerId = layer.id;

          const row = document.createElement('div');
          row.className = 'layer-card__row';

          const visibilityBtn = document.createElement('button');
          visibilityBtn.type = 'button';
          visibilityBtn.textContent = layer.visible ? 'Visible' : 'Hidden';
          visibilityBtn.setAttribute('aria-pressed', String(layer.visible));
          visibilityBtn.addEventListener('click', () => {
            layer.visible = !layer.visible;
            renderLayerList();
            render();
          });

          const title = document.createElement('div');
          title.className = 'layer-title';
          title.textContent = layer.name;
          title.title = 'Click to set active';
          title.addEventListener('click', () => setActiveLayer(layer.id));

          row.appendChild(visibilityBtn);
          row.appendChild(title);
          card.appendChild(row);

          const actions = document.createElement('div');
          actions.className = 'layer-card__actions';

          const renameBtn = document.createElement('button');
          renameBtn.type = 'button';
          renameBtn.textContent = 'Rename';
          renameBtn.addEventListener('click', () => {
            const nextName = prompt('Rename layer', layer.name);
            if (nextName && nextName.trim()) {
              layer.name = nextName.trim();
              renderLayerList();
            }
          });

          const collapseBtn = document.createElement('button');
          collapseBtn.type = 'button';
          collapseBtn.textContent = layer.collapsed ? 'Expand' : 'Collapse';
          collapseBtn.setAttribute('aria-expanded', String(!layer.collapsed));
          collapseBtn.addEventListener('click', () => {
            layer.collapsed = !layer.collapsed;
            renderLayerList();
          });

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.textContent = 'Remove';
          removeBtn.addEventListener('click', () => {
            const idx = layers.findIndex((l) => l.id === layer.id);
            if (idx === -1) return;
            layers.splice(idx, 1);
            const fallback = layers[idx] || layers[idx - 1];
            setActiveLayer(fallback ? fallback.id : null);
            render();
          });

          actions.appendChild(renameBtn);
          actions.appendChild(collapseBtn);
          actions.appendChild(removeBtn);
          card.appendChild(actions);

          const focusRow = document.createElement('div');
          focusRow.className = 'focus-row';
          const colorLabel = document.createElement('label');
          colorLabel.className = 'stacked';
          const colorSpan = document.createElement('span');
          colorSpan.textContent = 'Color focus';
          const colorInput = document.createElement('input');
          colorInput.type = 'color';
          colorInput.value = layer.color;
          const handleColor = (value) => {
            if (!value) return;
            layer.color = value;
            layer.dirty = true;
            render();
          };
          colorInput.addEventListener('input', (e) => handleColor(e.target.value));
          colorInput.addEventListener('change', (e) => handleColor(e.target.value));
          colorInput.addEventListener('focus', () => setActiveLayer(layer.id, { silent: true }));
          colorLabel.appendChild(colorSpan);
          colorLabel.appendChild(colorInput);
          focusRow.appendChild(colorLabel);

          const pickBtn = document.createElement('button');
          pickBtn.type = 'button';
          pickBtn.textContent = 'Pick focus';
          pickBtn.addEventListener('click', () => {
            layer.collapsed = false;
            setActiveLayer(layer.id);
            renderLayerList();
            updatePickMode(true);
          });
          focusRow.appendChild(pickBtn);
          card.appendChild(focusRow);

          const controlsWrap = document.createElement('div');
          controlsWrap.className = 'layer-controls';


          const tolLabel = document.createElement('label');
          tolLabel.className = 'stacked';
          const tolText = document.createElement('span');
          const tolValue = document.createElement('em');
          tolValue.textContent = layer.tolerance;
          tolText.textContent = 'Sensitivity ';
          tolText.appendChild(tolValue);
          const tolRange = document.createElement('input');
          tolRange.type = 'range';
          tolRange.min = 8;
          tolRange.max = 160;
          tolRange.value = layer.tolerance;
          tolRange.className = 'slider';
          tolRange.addEventListener('input', (e) => {
            layer.tolerance = parseInt(e.target.value, 10) || layer.tolerance;
            tolValue.textContent = layer.tolerance;
            AGData.tick(tolValue);
            layer.dirty = true;
            render();
          });
          tolRange.addEventListener('change', () => setActiveLayer(layer.id));
          tolLabel.appendChild(tolText);
          tolLabel.appendChild(tolRange);
          controlsWrap.appendChild(tolLabel);

          const brushLabel = document.createElement('label');
          brushLabel.className = 'stacked';
          const brushText = document.createElement('span');
          const brushValue = document.createElement('em');
          brushValue.textContent = `${layer.brushSize}px`;
          brushText.textContent = 'Feather ';
          brushText.appendChild(brushValue);
          const brushRange = document.createElement('input');
          brushRange.type = 'range';
          brushRange.min = 0;
          brushRange.max = 24;
          brushRange.step = 1;
          brushRange.value = layer.brushSize;
          brushRange.className = 'slider';
          brushRange.addEventListener('input', (e) => {
            const next = parseInt(e.target.value, 10);
            layer.brushSize = Number.isFinite(next) ? next : layer.brushSize;
            brushValue.textContent = `${layer.brushSize}px`;
            AGData.tick(brushValue);
            layer.dirty = true;
            render();
          });
          brushRange.addEventListener('change', () => setActiveLayer(layer.id));
          brushLabel.appendChild(brushText);
          brushLabel.appendChild(brushRange);
          controlsWrap.appendChild(brushLabel);

          const opacityLabel = document.createElement('label');
          opacityLabel.className = 'stacked';
          const opacityText = document.createElement('span');
          const opacityValue = document.createElement('em');
          opacityValue.textContent = `${Math.round(layer.opacity * 100)}%`;
          opacityText.textContent = 'Opacity ';
          opacityText.appendChild(opacityValue);
          const opacityRange = document.createElement('input');
          opacityRange.type = 'range';
          opacityRange.min = 0.1;
          opacityRange.max = 1;
          opacityRange.step = 0.05;
          opacityRange.value = layer.opacity;
          opacityRange.className = 'slider';
          opacityRange.addEventListener('input', (e) => {
            layer.opacity = parseFloat(e.target.value) || layer.opacity;
            opacityValue.textContent = `${Math.round(layer.opacity * 100)}%`;
            AGData.tick(opacityValue);
            render();
          });
          opacityRange.addEventListener('change', () => setActiveLayer(layer.id));
          opacityLabel.appendChild(opacityText);
          opacityLabel.appendChild(opacityRange);
          controlsWrap.appendChild(opacityLabel);

          const blendLabel = document.createElement('label');
          blendLabel.className = 'stacked';
          const blendText = document.createElement('span');
          blendText.textContent = 'Blend mode';
          const blendSelect = document.createElement('select');
          blendModes.forEach((mode) => {
            const opt = document.createElement('option');
            opt.value = mode;
            opt.textContent = mode;
            if (mode === layer.blendMode) opt.selected = true;
            blendSelect.appendChild(opt);
          });
          blendSelect.addEventListener('change', (e) => {
            layer.blendMode = e.target.value;
            render();
            setActiveLayer(layer.id);
          });
          blendLabel.appendChild(blendText);
          blendLabel.appendChild(blendSelect);
          controlsWrap.appendChild(blendLabel);

          const invertBtn = document.createElement('button');
          invertBtn.type = 'button';
          const syncInvert = () => {
            invertBtn.textContent = `Invert match: ${layer.invert ? 'On' : 'Off'}`;
            invertBtn.setAttribute('aria-pressed', String(Boolean(layer.invert)));
          };
          syncInvert();
          invertBtn.addEventListener('click', () => {
            layer.invert = !layer.invert;
            layer.dirty = true;
            syncInvert();
            setActiveLayer(layer.id, { silent: true });
            render();
          });
          controlsWrap.appendChild(invertBtn);

          card.appendChild(controlsWrap);

          layerList.appendChild(card);
        });
      }

      function buildSampleGrid() {
        if (!sampleGrid || sampleGrid.childElementCount) return;
        if (!sampleData.length) {
          const empty = document.createElement('p');
          empty.className = 'muted';
          empty.textContent = 'No sample images available.';
          sampleGrid.appendChild(empty);
          return;
        }
        sampleData.forEach((item, index) => {
          const tile = document.createElement('button');
          tile.type = 'button';
          tile.className = 'sample-tile';
          tile.setAttribute('aria-pressed', 'false');
          tile.dataset.src = item.src;
          tile.dataset.label = item.label || `Sample ${index + 1}`;
          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.label || `Sample ${index + 1}`;
          const label = document.createElement('div');
          label.className = 'sample-tile__label';
          label.textContent = item.label || `Sample ${index + 1}`;
          tile.appendChild(img);
          tile.appendChild(label);
          tile.addEventListener('click', () => {
            const key = tile.dataset.src;
            if (selectedSamples.has(key)) {
              selectedSamples.delete(key);
              tile.classList.remove('is-selected');
              tile.setAttribute('aria-pressed', 'false');
            } else {
              selectedSamples.add(key);
              tile.classList.add('is-selected');
              tile.setAttribute('aria-pressed', 'true');
            }
          });
          sampleGrid.appendChild(tile);
        });
      }

      function openSampleModal() {
        if (!sampleData.length) {
          alert('No sample images available.');
          return;
        }
        selectedSamples.clear();
        sampleModalReturnFocus = document.activeElement;
        sampleGrid?.querySelectorAll('.sample-tile').forEach((tile) => {
          tile.classList.remove('is-selected');
          tile.setAttribute('aria-pressed', 'false');
        });
        buildSampleGrid();
        sampleModal?.classList.add('is-open');
        sampleModal?.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');
        requestAnimationFrame(() => sampleGrid?.querySelector('button')?.focus());
      }

      function closeSampleModal() {
        sampleModal?.classList.remove('is-open');
        sampleModal?.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
        sampleModalReturnFocus?.focus?.();
        sampleModalReturnFocus = null;
      }

      fileInput?.addEventListener('change', (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        files.forEach((file) => {
          const url = URL.createObjectURL(file);
          const name = file.name.replace(/\.[^/.]+$/, '');
          createLayerFromSource(url, name, true);
        });
        fileInput.value = '';
      });

      sampleChooserBtn?.addEventListener('click', openSampleModal);

      confirmSampleBtn?.addEventListener('click', async () => {
        const picks = selectedSamples.size
          ? Array.from(selectedSamples)
          : [sampleData[0]?.src].filter(Boolean);
        if (!picks.length) return;
        for (let i = 0; i < picks.length; i++) {
          const src = picks[i];
          const match = sampleData.find((s) => s.src === src);
          const label = match?.label || `Sample ${i + 1}`;
          try {
            let resolvedSrc = src;
            let revoke = false;
            try {
              await testImageLoad(src);
            } catch {
              resolvedSrc = await fetchImageObjectURL(src);
              revoke = true;
            }
            createLayerFromSource(resolvedSrc, label, revoke);
          } catch (err) {
            console.error(err);
            alert('Could not load one of the samples.');
          }
        }
        closeSampleModal();
      });

      cancelSampleBtn?.addEventListener('click', closeSampleModal);
      closeSampleModalBtn?.addEventListener('click', closeSampleModal);
      sampleModal?.addEventListener('click', (e) => {
        if (e.target === sampleModal) {
          closeSampleModal();
        }
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sampleModal?.classList.contains('is-open')) {
          closeSampleModal();
        }
      });

      exportBtn?.addEventListener('click', () => {
        if (!layers.length) {
          alert('Add at least one layer before exporting.');
          return;
        }
        draw();
        // The probe and HUD are DOM overlays, so the PNG holds the artwork only.
        canvas.toBlob(async (blob) => {
          if (!blob) return;
          const file = new File([blob], 'color-range-lab.png', { type: 'image/png' });
          if (coarsePointer && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: 'Color Range' });
              return;
            } catch (err) {
              if (err && err.name === 'AbortError') return;
            }
          }
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'color-range-lab.png';
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        }, 'image/png');
      });

      clearBtn?.addEventListener('click', () => {
        layers.splice(0, layers.length);
        baseAspect = 1.45;
        updatePickMode(false);
        setActiveLayer(null);
        hud.newSpecimen();
        resizeCanvas();
      });

      pickColorBtn?.addEventListener('click', () => {
        if (!layers.length) return;
        updatePickMode(!pickMode);
      });

      // The sheet animates the stage height: resize the canvas once it settles, not on every frame.
      let resizeTimer = 0;
      const scheduleResize = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resizeCanvas, 90);
      };
      window.addEventListener('resize', scheduleResize);
      if (window.ResizeObserver) new ResizeObserver(scheduleResize).observe(stage);
      requestAnimationFrame(resizeCanvas);

      // Remember the layer settings between visits (scripts/savedSettings.js). Images are not stored,
      // so the settings of the layer you last worked on become the start for the next image you load.
      AGSettings.persist('colorrangelab', {
        get: () => {
          const active = layers.find((l) => l.id === activeLayerId);
          if (active) {
            Object.keys(layerDefaults).forEach((key) => {
              layerDefaults[key] = active[key];
            });
          }
          return layerDefaults;
        },
        set: (saved) => {
          if (/^#[0-9a-f]{6}$/i.test(saved.color)) layerDefaults.color = saved.color;
          if (Number.isFinite(saved.tolerance)) layerDefaults.tolerance = Math.min(160, Math.max(8, saved.tolerance));
          if (Number.isFinite(saved.brushSize)) layerDefaults.brushSize = Math.min(24, Math.max(0, saved.brushSize));
          if (Number.isFinite(saved.opacity)) layerDefaults.opacity = Math.min(1, Math.max(0.1, saved.opacity));
          if (blendModes.includes(saved.blendMode)) layerDefaults.blendMode = saved.blendMode;
          if (typeof saved.invert === 'boolean') layerDefaults.invert = saved.invert;
        },
      });
    })();
  </script>
</body>
</html>
