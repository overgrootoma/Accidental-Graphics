<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swing · Accidental Graphics</title>
  <meta name="description" content="Paint with a responsive pendulum brush and export the canvas.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/data.css">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/face cursor.png">
  <script defer src="../scripts/navConfig.js"></script>
  <script defer src="../scripts/navMenu.js"></script>
  <script src="../scripts/dataLayer.js"></script>
  <script defer src="../scripts/settingsToggle.js" data-panel="#ui"></script>
  <script src="../scripts/savedSettings.js"></script>
  <style>
    #c {
      --swing-bg: #111111;
      background-color: var(--swing-bg);
      display: block;
      position: fixed;
      /* Inset below the nav, above the footer and from the sides: the lab data (css/data.css) sits in
         that margin, outside the painting. The sheet covers the bottom on mobile. */
      top: calc(var(--swing-top, 72px) + var(--ag-hud-band, 22px));
      left: var(--ag-hud-side, 16px);
      width: calc(100% - 2 * var(--ag-hud-side, 16px));
      height: calc(100dvh - var(--swing-top, 72px) - var(--swing-foot, 34px) - 2 * var(--ag-hud-band, 22px));
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body.ag-sheet #c {
      height: calc(100dvh - var(--swing-top, 72px) - var(--ag-hud-band, 18px));
    }
    html, body.app-page {
      overscroll-behavior: none;
    }
    /* Lab data around the canvas: on the black page, not on the painting. */
    .ag-hud {
      color: #fff;
    }
    #c.bg-off {
      background-color: #1a1a1a;
      background-image:
        linear-gradient(45deg, #262626 25%, transparent 25%, transparent 75%, #262626 75%),
        linear-gradient(45deg, #262626 25%, transparent 25%, transparent 75%, #262626 75%);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .bg-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-top: 8px;
    }
    .bg-row button {
      flex: 1;
    }
    #ui .bg-row button {
      margin: 0;
    }
    .bg-row .color-input {
      flex: 0 0 64px;
      height: auto;
      min-height: 38px;
    }
    #ui {
      position: fixed;
      top: 96px;
      left: 20px;
      width: min(320px, calc(100% - 40px));
      background: rgba(0, 0, 0, 0.8);
      padding: 16px;
      border-radius: 14px;
      font-family: var(--font-ui);
      color: white;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      z-index: 200;
      box-sizing: border-box;
      /* Ends above the bottom-left overlay text. */
      max-height: calc(100dvh - 190px);
      overflow-y: auto;
      color: #fff;
    }
    #ui * {
      color: inherit;
    }
    #ui h1 {
      font-family: var(--font-ui), system-ui;
      font-weight: 900;
      font-variation-settings: "ROND" 70;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }
    #ui button {
      margin: 6px 4px 0 0;
    }
    .toggle-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .toggle-row button {
      flex: 1;
    }
    .toggle-btn.active {
      background: #fff;
      color: #111;
    }
    #ui a,
    #ui a:visited,
    #ui a:active {
      color: #fff;
      text-decoration: none;
    }
    .control-label {
      display: block;
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 500;
    }
    #ui select {
      width: 100%;
      margin-top: 6px;
    }
    .color-input {
      flex: 1;
      width: 100%;
      padding: 0;
      border: none;
      height: 38px;
      background: transparent;
    }
    .color-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }
    .color-row .color-block {
      flex: 1;
    }
    .color-row label {
      display: block;
      margin-bottom: 4px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0;
    }
    .slider-row label {
      font-weight: 500;
      min-width: 60px;
    }
    .slider-row input[type="range"] {
      flex: 1 1 auto;
    }
    .value-label {
      min-width: 50px;
      text-align: right;
    }
    /* Fixed 28px box scaled with transform, so big brushes never push the panel layout around. */
    .size-preview {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ff2d55;
      border: 1px solid rgba(255,255,255,0.6);
      box-sizing: border-box;
      transform: scale(var(--preview-scale, .43));
      transition: transform var(--ag-dur-2, 220ms) var(--ag-ease-spring, ease-out), background-color var(--ag-dur-2, 220ms);
    }
    @media (prefers-reduced-motion: reduce) {
      .size-preview { transition: none; }
    }
    .shape-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .action-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .shape-btn {
      flex: 0 0 auto;
      min-width: 40px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .shape-btn.active {
      background: #fff;
      color: #111;
    }
    @media (max-width: 480px) {
      #c {
        --swing-top: 60px;
      }
    }
    /* Bottom sheet (scripts/settingsToggle.js): roomy tap targets, 16px inputs, no iOS zoom. */
    body.ag-sheet #ui select,
    body.ag-sheet #ui input[type="number"] {
      font-size: 16px;
    }
    body.ag-sheet #ui button,
    body.ag-sheet .shape-btn {
      min-height: 44px;
    }
    body.ag-sheet .shape-btn {
      min-width: 44px;
    }
    body.ag-sheet .color-input {
      min-height: 44px;
    }
    body.ag-sheet #ui input[type="range"] {
      min-height: 32px;
    }
  </style>
</head>

<body class="app-page">
<canvas id="c"></canvas>
<div id="ui">
  <h1>Swing</h1>
  <p class="app-description">Pendulum-inspired brush physics that swing around your cursor for fast gestural paintings.</p>

  <div class="color-row">
    <div class="color-block">
      <label for="color" class="control-label">Ball</label>
      <input type="color" id="color" value="#ff2d55" class="color-input">
    </div>
    <div class="color-block">
      <label for="ropeColor" class="control-label">Rope</label>
      <input type="color" id="ropeColor" value="#ffffff" class="color-input">
    </div>
    <div class="color-block">
      <label for="strokeColor" class="control-label">Outline</label>
      <input type="color" id="strokeColor" value="#ffffff" class="color-input">
    </div>
  </div>
  <div class="slider-row">
    <label for="size">Size</label>
    <input type="range" id="size" min="2" max="300" value="12" class="slider">
    <span class="value-label" id="sizeLabel">12 px</span>
    <span class="size-preview" id="sizePreview" aria-hidden="true"></span>
  </div>
  <div class="slider-row">
    <label for="strokeWidth">Outline</label>
    <input type="range" id="strokeWidth" min="0" max="40" value="0" class="slider">
    <span class="value-label" id="strokeWidthLabel">0 px</span>
  </div>
  <label for="segments">Segments: <span id="segmentsLabel">1</span></label>
  <input type="range" id="segments" min="1" max="6" value="1" class="slider">
  <label for="length">Length: <span id="lengthLabel">200 px</span></label>
  <input type="range" id="length" min="40" max="800" value="200" class="slider">
  <label for="gravity">Gravity: <span id="gravityLabel">1.0 ×</span></label>
  <input type="range" id="gravity" min="0" max="3" step="0.1" value="1" class="slider">
  <label for="friction">Friction: <span id="frictionLabel">2.0 %</span></label>
  <input type="range" id="friction" min="0" max="10" step="0.5" value="2" class="slider">
  <label for="ropeWidth">Rope width: <span id="ropeWidthLabel">2 px</span></label>
  <input type="range" id="ropeWidth" min="1" max="20" value="2" class="slider">
  <div class="toggle-row">
    <button id="stretchBtn" class="toggle-btn" type="button">Stretch: Off</button>
  </div>
  <div class="bg-row">
    <button id="bgBtn" class="toggle-btn active" type="button">Background: On</button>
    <input type="color" id="bgColor" value="#111111" class="color-input" aria-label="Background color">
  </div>
  <div class="toggle-row">
    <button id="ballBtn" class="toggle-btn active" type="button">Ball: On</button>
    <button id="ropeBtn" class="toggle-btn active" type="button">Rope: On</button>
  </div>
  <label class="control-label">Ball Shape</label>
  <div class="shape-buttons">
    <button type="button" class="shape-btn active" data-shape="circle" title="Circle">●</button>
    <button type="button" class="shape-btn" data-shape="square" title="Square">■</button>
    <button type="button" class="shape-btn" data-shape="diamond" title="Diamond">◆</button>
    <button type="button" class="shape-btn" data-shape="triangle" title="Triangle">▲</button>
    <button type="button" class="shape-btn" data-shape="star" title="Star">★</button>
  </div>
  <input type="file" id="importShapeInput" accept="image/*" hidden>
  <div class="action-row">
    <button type="button" class="shape-btn" id="importShapeBtn" data-shape="image" data-import="true" title="Import image">IMG</button>
  </div>
  <div class="action-row">
    <button id="resetBtn" type="button">Reset (R)</button>
    <button id="exportBtn" type="button">Export (E)</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

// The canvas box is sized by CSS (below the nav, above the footer; full height behind the mobile sheet).
// Resizing a canvas clears it, so the painting is copied across and kept (top-left anchored).
function fitInsets(){
  const root = document.documentElement;
  const nav = document.querySelector('.site-nav');
  const foot = document.querySelector('.app-year');
  if (nav) root.style.setProperty('--swing-top', `${nav.offsetHeight}px`);
  if (foot) root.style.setProperty('--swing-foot', `${foot.offsetHeight}px`);
}
function resize(){
  const nextW = canvas.clientWidth, nextH = canvas.clientHeight;
  if (!nextW || !nextH || (nextW === W && nextH === H)) return;
  let keep = null;
  if (W && H) {
    keep = document.createElement('canvas');
    keep.width = W;
    keep.height = H;
    keep.getContext('2d').drawImage(canvas, 0, 0);
  }
  W = nextW; H = nextH;
  canvas.width = W; canvas.height = H;
  if (keep) ctx.drawImage(keep, 0, 0);
}
fitInsets();
resize();
window.addEventListener('load', () => { fitInsets(); resize(); });
window.addEventListener('resize', () => { fitInsets(); resize(); });
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);

function clearCanvas(){
  ctx.clearRect(0,0,W,H);
  stamps = 0;
}
function resetPainting(){
  clearCanvas();
  hud.newSpecimen();
}
// Keyboard shortcuts
window.addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement || e.target instanceof HTMLTextAreaElement) return;
  if (e.key.toLowerCase() === 'r') resetPainting();
  if (e.key.toLowerCase() === 'e') exportPainting();
});

// Background: only shown through CSS, so on/off and colour can always change.
// On export it is put behind the painting; off = transparent PNG.
const bgBtn = document.getElementById('bgBtn');
const bgColorInput = document.getElementById('bgColor');
let showBackground = true;
let backgroundColor = bgColorInput.value;
function applyBackground(){
  canvas.style.setProperty('--swing-bg', backgroundColor);
  canvas.classList.toggle('bg-off', !showBackground);
  bgBtn.textContent = `Background: ${showBackground ? 'On' : 'Off'}`;
  bgBtn.classList.toggle('active', showBackground);
  bgBtn.setAttribute('aria-pressed', String(showBackground));
}
bgBtn.addEventListener('click', ()=>{
  showBackground = !showBackground;
  applyBackground();
});
bgColorInput.addEventListener('input', e=>{
  backgroundColor = e.target.value;
  showBackground = true;
  applyBackground();
});
applyBackground();

// PNG export (the data overlay is DOM only, so it is never in the file). On phones the share sheet is
// used when it can take files (iOS ignores the download attribute on blobs in some versions).
function exportPainting(){
  let source = canvas;
  if (showBackground) {
    source = document.createElement('canvas');
    source.width = canvas.width;
    source.height = canvas.height;
    const exportCtx = source.getContext('2d');
    exportCtx.fillStyle = backgroundColor;
    exportCtx.fillRect(0, 0, source.width, source.height);
    exportCtx.drawImage(canvas, 0, 0);
  }
  source.toBlob(blob=>{
    if (!blob) return;
    const file = new File([blob], 'schilderij.png', { type: 'image/png' });
    if (window.matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(()=>{});
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = 'schilderij.png';
    link.href = url;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}

// settings
const colorInput = document.getElementById('color');
const sizeInput = document.getElementById('size');
const sizeLabel = document.getElementById('sizeLabel');
const sizePreview = document.getElementById('sizePreview');
let paintColor = colorInput.value;
let paintSize = Number(sizeInput.value);
const segmentInput = document.getElementById('segments');
const segmentLabel = document.getElementById('segmentsLabel');
let segmentCount = Number(segmentInput.value);
segmentLabel.textContent = segmentCount;
const lengthInput = document.getElementById('length');
const lengthLabel = document.getElementById('lengthLabel');
let ropeLength = Number(lengthInput.value);
lengthLabel.textContent = `${ropeLength} px`;
const gravityInput = document.getElementById('gravity');
const gravityLabel = document.getElementById('gravityLabel');
const frictionInput = document.getElementById('friction');
const frictionLabel = document.getElementById('frictionLabel');
const ropeWidthInput = document.getElementById('ropeWidth');
const ropeWidthLabel = document.getElementById('ropeWidthLabel');
// Physics runs in fixed steps of 1/60 s: gravity is px per step squared at gravity 1.0x, friction the share
// of velocity lost per step.
const GRAVITY_UNIT = 0.5;
let gravity = GRAVITY_UNIT * Number(gravityInput.value);
let damping = 1 - Number(frictionInput.value) / 100;
let ropeWidth = Number(ropeWidthInput.value);
const stretchBtn = document.getElementById('stretchBtn');
const ballBtn = document.getElementById('ballBtn');
const ropeColorInput = document.getElementById('ropeColor');
const ropeBtn = document.getElementById('ropeBtn');
const shapeButtons = Array.from(document.querySelectorAll('.shape-btn'));
const importShapeInput = document.getElementById('importShapeInput');
const strokeColorInput = document.getElementById('strokeColor');
const strokeWidthInput = document.getElementById('strokeWidth');
const strokeWidthLabel = document.getElementById('strokeWidthLabel');
let stretchMode = false;
let showBall = true;
let ballShape = 'circle';
let ropeColor = ropeColorInput.value;
let showRope = true;
let importedImage = null;
let strokeColor = strokeColorInput.value;
// Ball outline: a width of 0 means no outline.
let strokeWidth = Number(strokeWidthInput.value);
strokeWidthLabel.textContent = `${strokeWidth} px`;

colorInput.addEventListener('input', e=>{
  paintColor = e.target.value;
  updateSizePreview(paintSize);
});
sizeInput.addEventListener('input', e=>{
  updateSizePreview(Number(e.target.value));
});
segmentInput.addEventListener('input', e=>{
  segmentCount = Number(e.target.value);
  segmentLabel.textContent = segmentCount;
  initSegments();
});
lengthInput.addEventListener('input', e=>{
  ropeLength = Number(e.target.value);
  lengthLabel.textContent = `${ropeLength} px`;
  initSegments();
});
gravityInput.addEventListener('input', e=>{
  gravity = GRAVITY_UNIT * Number(e.target.value);
  gravityLabel.textContent = `${Number(e.target.value).toFixed(1)} ×`;
});
frictionInput.addEventListener('input', e=>{
  damping = 1 - Number(e.target.value) / 100;
  frictionLabel.textContent = `${Number(e.target.value).toFixed(1)} %`;
});
ropeWidthInput.addEventListener('input', e=>{
  ropeWidth = Number(e.target.value);
  ropeWidthLabel.textContent = `${ropeWidth} px`;
});

function syncToggle(btn, state, label){
  btn.textContent = `${label}: ${state ? 'On' : 'Off'}`;
  btn.classList.toggle('active', state);
  btn.setAttribute('aria-pressed', String(state));
}
syncToggle(stretchBtn, stretchMode, 'Stretch');
syncToggle(ballBtn, showBall, 'Ball');
syncToggle(ropeBtn, showRope, 'Rope');

stretchBtn.addEventListener('click', ()=>{
  stretchMode = !stretchMode;
  syncToggle(stretchBtn, stretchMode, 'Stretch');
});
ballBtn.addEventListener('click', ()=>{
  showBall = !showBall;
  syncToggle(ballBtn, showBall, 'Ball');
});
ropeBtn.addEventListener('click', ()=>{
  showRope = !showRope;
  syncToggle(ropeBtn, showRope, 'Rope');
});
ropeColorInput.addEventListener('input', e=>{
  ropeColor = e.target.value;
});
strokeColorInput.addEventListener('input', e=>{
  strokeColor = e.target.value;
});
strokeWidthInput.addEventListener('input', e=>{
  strokeWidth = Number(e.target.value);
  strokeWidthLabel.textContent = `${strokeWidth} px`;
});

function updateSizePreview(size){
  paintSize = size;
  sizeLabel.textContent = `${size} px`;
  // The dot shows the brush up to 28 px; bigger brushes just fill it.
  sizePreview.style.setProperty('--preview-scale', (Math.min(size, 28) / 28).toFixed(3));
  sizePreview.style.backgroundColor = paintColor;
}
updateSizePreview(paintSize);

function setBallShape(shape){
  ballShape = shape;
  shapeButtons.forEach(btn=>{
    const active = btn.dataset.shape === shape;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
  });
}

shapeButtons.forEach(btn=>{
  const shape = btn.dataset.shape;
  if (btn.dataset.import === 'true') {
    btn.addEventListener('click', ()=>{
      importShapeInput.click();
    });
  } else {
    btn.addEventListener('click', ()=>{
      setBallShape(shape);
    });
  }
});

importShapeInput.addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    importedImage = img;
    setBallShape('image');
    URL.revokeObjectURL(url);
  };
  img.onerror = ()=>URL.revokeObjectURL(url);
  img.src = url;
  importShapeInput.value = '';
});

setBallShape(ballShape);

document.getElementById('resetBtn').addEventListener('click', resetPainting);
document.getElementById('exportBtn').addEventListener('click', exportPainting);

// Pointer position (mouse, pen and touch). The brush only paints once the pointer has been used, so
// nothing is drawn at the canvas centre before the first move or touch.
const mouse = {x: 0, y: 0};
let armed = false;
const coarsePointer = window.matchMedia('(pointer: coarse)');
function updateMousePosition(e){
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
}
window.addEventListener('pointermove', e=>{
  updateMousePosition(e);
  // On touch screens only a real touch starts the brush (stray mouse events at 0,0 are ignored); a mouse
  // or pen arms it on its first move, ignoring the synthetic move some browsers fire at 0,0.
  if (!armed && !coarsePointer.matches && !(e.clientX === 0 && e.clientY === 0)) {
    armed = true;
    hangFromPointer();
  }
});
// A touch can land anywhere: the rope starts hanging from the new spot instead of swinging in from the old one.
canvas.addEventListener('pointerdown', e=>{
  updateMousePosition(e);
  if (e.pointerType !== 'mouse' || !armed) {
    armed = true;
    hangFromPointer();
  }
});

// pendulum masses
let segments = [];

function initSegments(){
  const segmentLength = ropeLength / segmentCount;
  segments = Array.from({length: segmentCount}, (_, i) => ({
    x: mouse.x,
    y: mouse.y + (i + 1) * segmentLength,
    px: mouse.x,
    py: mouse.y + (i + 1) * segmentLength
  }));
}
function hangFromPointer(){
  prevAnchorX = mouse.x;
  prevAnchorY = mouse.y;
  initSegments();
}
mouse.x = canvas.clientWidth / 2;
mouse.y = canvas.clientHeight / 2;
let prevAnchorX = mouse.x, prevAnchorY = mouse.y;
initSegments();

// Data overlay (scripts/dataLayer.js): DOM only, so it never ends up in the exported PNG.
const hud = AGData.hud(canvas, { canvas, code: 'SWG', slots: { specimen: 'tr' } });
AGData.readouts(document.getElementById('ui'));
let stamps = 0;
let hudAt = 0;
let lastTipX = 0, lastTipY = 0, lastTipAt = 0;

const STEP = 1 / 60;       // seconds per physics step (and per painted stamp)
const MAX_FRAME = 0.1;     // a background tab or hitch never fast-forwards the pendulum
let acc = 0;
let lastNow = 0;

// One verlet step with the anchor at (ax, ay).
function stepPhysics(ax, ay){
  const segmentLength = ropeLength / segmentCount;
  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    const vx = (seg.x - seg.px) * damping;
    const vy = (seg.y - seg.py) * damping + gravity;
    seg.px = seg.x;
    seg.py = seg.y;
    seg.x += vx;
    seg.y += vy;
  }
  // fixed length for every segment, from the anchor down the chain
  let anchorX = ax;
  let anchorY = ay;
  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    const dx = seg.x - anchorX;
    const dy = seg.y - anchorY;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if (dist === 0) dist = 0.0001;
    const nx = dx / dist;
    const ny = dy / dist;
    if (stretchMode) {
      const diff = segmentLength - dist;
      const softness = 0.2;
      seg.x += nx * diff * softness;
      seg.y += ny * diff * softness;
    } else {
      seg.x = anchorX + nx * segmentLength;
      seg.y = anchorY + ny * segmentLength;
    }
    anchorX = seg.x;
    anchorY = seg.y;
  }
}

function paintStamp(ax, ay){
  const tip = segments[segments.length - 1];
  if (showBall || strokeWidth > 0) {
    drawBallTip(tip.x, tip.y, showBall);
  }
  if (showRope) {
    ctx.beginPath();
    ctx.strokeStyle = ropeColor;
    ctx.lineWidth = ropeWidth;
    ctx.moveTo(ax, ay);
    for (let i = 0; i < segments.length; i++) {
      ctx.lineTo(segments[i].x, segments[i].y);
    }
    ctx.stroke();
  }
  stamps++;
}

function updateHud(now){
  const tip = segments[segments.length - 1];
  const dt = (now - lastTipAt) / 1000;
  if (dt > 0) {
    hud.set('Tip', AGData.fmt(Math.hypot(tip.x - lastTipX, tip.y - lastTipY) / dt, 0, 4), 'px/s', 'br');
  }
  lastTipX = tip.x; lastTipY = tip.y; lastTipAt = now;
  // Angle of the first segment from straight down.
  const first = segments[0];
  const theta = Math.atan2(first.x - mouse.x, first.y - mouse.y) * 180 / Math.PI;
  hud.set('Theta', (theta < 0 ? '-' : '+') + AGData.fmt(Math.abs(theta), 1, 3), '°', 'br');
  // Small-angle period of a simple pendulum of the whole rope length: T = 2π √(L / g).
  const g = gravity * 3600;
  hud.set('T0', g > 0 ? AGData.fmt(2 * Math.PI * Math.sqrt(ropeLength / g), 2) : '∞', 's', 'tr');
  hud.set('Rope', `${segmentCount} × ${AGData.fmt(ropeLength / segmentCount, 0, 3)}`, 'px', 'tr');
  hud.set('Stamps', AGData.fmt(stamps, 0, 6), '', 'tr');
}

function loop(now){
  requestAnimationFrame(loop);
  hud.frame(now);
  if (!segments.length) initSegments();

  const dt = Math.min(MAX_FRAME, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  acc += dt;
  const steps = Math.floor(acc / STEP);
  acc -= steps * STEP;

  // Steps run at a fixed rate whatever the display refresh (30, 60 or 120 Hz), so the swing and the
  // density of the strokes stay the same. The anchor glides across the steps of a slow frame.
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const ax = prevAnchorX + (mouse.x - prevAnchorX) * t;
    const ay = prevAnchorY + (mouse.y - prevAnchorY) * t;
    stepPhysics(ax, ay);
    if (armed) paintStamp(ax, ay);
  }
  if (steps) {
    prevAnchorX = mouse.x;
    prevAnchorY = mouse.y;
  }

  if (now - hudAt > 100) {
    hudAt = now;
    updateHud(now);
  }
}

function drawBallTip(x, y, fillBall = true){
  const r = paintSize / 2;
  ctx.beginPath();
  switch(ballShape){
    case 'square':
      ctx.rect(x - r, y - r, paintSize, paintSize);
      break;
    case 'diamond':
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r, y);
      ctx.lineTo(x, y + r);
      ctx.lineTo(x - r, y);
      ctx.closePath();
      break;
    case 'triangle':
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r, y + r);
      ctx.lineTo(x - r, y + r);
      ctx.closePath();
      break;
    case 'star':
      drawStar(ctx, x, y, r);
      break;
    default:
      ctx.arc(x, y, r, 0, Math.PI*2);
      break;
  }

  if(fillBall){
    if(ballShape === 'image' && importedImage){
      ctx.drawImage(importedImage, x - paintSize / 2, y - paintSize / 2, paintSize, paintSize);
    } else {
      ctx.fillStyle = paintColor;
      ctx.fill();
    }
  }

  if(strokeWidth > 0){
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeWidth;
    ctx.stroke();
  }
}
function drawStar(ctx, x, y, outerRadius){
  const spikes = 5;
  const innerRadius = outerRadius * 0.5;
  let rot = Math.PI / 2 * 3;
  ctx.moveTo(x, y - outerRadius);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(x + Math.cos(rot) * outerRadius, y + Math.sin(rot) * outerRadius);
    rot += Math.PI / spikes;
    ctx.lineTo(x + Math.cos(rot) * innerRadius, y + Math.sin(rot) * innerRadius);
    rot += Math.PI / spikes;
  }
  ctx.closePath();
}
// Remember the settings between visits (scripts/savedSettings.js).
AGSettings.persist('swing', {
  controls: ['color', 'size', 'segments', 'length', 'gravity', 'friction', 'ropeWidth', 'ropeColor', 'strokeColor', 'strokeWidth', 'bgColor'],
  get: () => ({ stretchMode, showBall, showRope, showBackground, ballShape }),
  set: (saved) => {
    if (typeof saved.stretchMode === 'boolean') stretchMode = saved.stretchMode;
    if (typeof saved.showBall === 'boolean') showBall = saved.showBall;
    if (typeof saved.showRope === 'boolean') showRope = saved.showRope;
    if (typeof saved.showBackground === 'boolean') showBackground = saved.showBackground;
    // Older versions had a separate outline toggle: "off" now means a width of 0.
    if (saved.showStroke === false && strokeWidth !== 0) {
      strokeWidthInput.value = '0';
      strokeWidthInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
    syncToggle(stretchBtn, stretchMode, 'Stretch');
    syncToggle(ballBtn, showBall, 'Ball');
    syncToggle(ropeBtn, showRope, 'Rope');
    applyBackground();
    // An imported shape image is not stored, so fall back to the circle.
    if (saved.ballShape !== 'image' && shapeButtons.some(btn => btn.dataset.shape === saved.ballShape)) {
      setBallShape(saved.ballShape);
    }
  },
});

requestAnimationFrame(loop);
</script>
<div class="app-year">2026 Accidental Graphics</div>
