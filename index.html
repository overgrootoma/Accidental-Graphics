<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accidental Graphics</title>
  <meta name="description" content="Experimental browser tools for making graphics by accident. By Jorne Scholiers.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/data.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@100..900,0..100&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="images/face cursor.png">
  <script defer src="scripts/navConfig.js"></script>
  <script defer src="scripts/navMenu.js"></script>
  <script src="scripts/dataLayer.js"></script>
</head>

<body class="home-page">
  <main class="app-grid-wrapper">
    <div class="app-grid" id="appGrid" role="list" aria-label="Available experiments"></div>
  </main>
  <div class="app-year" data-live>2026 Accidental Graphics</div>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
    const appGrid = document.getElementById('appGrid');
    if (!appGrid || !window.AGContent) return;

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    // Pauses covers that are off screen and tilts the cover / follows the pointer with the label.
    const visibility = 'IntersectionObserver' in window
      ? new IntersectionObserver(entries => entries.forEach(entry => {
          const video = entry.target;
          if (entry.isIntersecting) video.play().catch(() => {});
          else video.pause();
        }), { rootMargin: '120px' })
      : null;

    const addTilt = card => {
      if (!finePointer || reduced) return;
      card.addEventListener('pointermove', event => {
        const box = card.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width - 0.5;
        const y = (event.clientY - box.top) / box.height - 0.5;
        card.style.setProperty('--tx', x.toFixed(3));
        card.style.setProperty('--ty', y.toFixed(3));
      });
      card.addEventListener('pointerleave', () => {
        card.style.setProperty('--tx', 0);
        card.style.setProperty('--ty', 0);
      });
    };

    const makeCard = ({ href, label, meta, cover, isVideo, extraClass, index }) => {
      const card = document.createElement('a');
      card.href = href;
      card.className = `app-card${extraClass ? ` ${extraClass}` : ''}`;
      card.setAttribute('role', 'listitem');
      card.setAttribute('aria-label', label);
      card.style.setProperty('--i', index);

      if (cover && isVideo) {
        const video = document.createElement('video');
        video.className = 'app-card__media';
        ['muted', 'loop', 'autoplay', 'playsinline'].forEach(attr => video.setAttribute(attr, ''));
        video.muted = true;
        video.preload = 'auto';
        video.setAttribute('aria-hidden', 'true');
        video.src = `${cover}#t=0.001`;
        card.appendChild(video);
        video.addEventListener('canplay', () => video.play().catch(() => {}), { once: true });
        if (visibility) visibility.observe(video);
      } else if (cover) {
        card.style.backgroundImage = `url("${cover}")`;
      }

      const labelEl = document.createElement('span');
      labelEl.className = 'app-card__label';
      labelEl.textContent = label;
      card.appendChild(labelEl);

      const metaEl = document.createElement('span');
      metaEl.className = 'app-card__meta';
      metaEl.textContent = meta;
      card.appendChild(metaEl);
      addTilt(card);
      return card;
    };

    // The archive card fills the rest of the last row, whatever the number of tools.
    const fitArchiveCard = () => {
      const archiveCard = appGrid.querySelector('.app-card--archive');
      if (!archiveCard) return;
      const columns = getComputedStyle(appGrid).gridTemplateColumns.split(' ').filter(Boolean).length || 1;
      const tools = appGrid.querySelectorAll('.app-card:not(.app-card--archive)').length;
      const left = columns - (tools % columns);
      archiveCard.style.gridColumn = `span ${left}`;
    };

    AGContent.tools().then(tools => {
      const activeTools = tools.filter(tool => !tool.archived);
      appGrid.innerHTML = '';

      activeTools.forEach((tool, index) => {
        appGrid.appendChild(makeCard({
          href: tool.url,
          label: tool.name,
          index,
          meta: tool.year ? `Since ${tool.year}` : '',
          cover: tool.cover || AGContent.resolve('images/icon_Blue.png'),
          isVideo: tool.isVideo,
        }));
      });

      appGrid.appendChild(makeCard({
        href: AGContent.resolve('archive.html'),
        label: 'Archive',
        index: activeTools.length,
        meta: 'Older tools',
        extraClass: 'app-card--archive',
      }));

      fitArchiveCard();
      window.addEventListener('resize', fitArchiveCard);
    }).catch(() => {
      appGrid.innerHTML = '<p class="home-empty">The tools could not be loaded. Try again in a moment.</p>';
    });
  });
  </script>
</body>
</html>
