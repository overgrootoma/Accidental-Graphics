<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PhotoGrid · Accidental Graphics</title>
  <meta name="description" content="Warp a photo into animated grids and export the result.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/data.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@100..900,0..100&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/face cursor.png">
  <script defer src="../scripts/navConfig.js"></script>
  <script defer src="../scripts/navMenu.js"></script>
  <script src="../scripts/dataLayer.js"></script>
  <script defer src="../scripts/settingsToggle.js" data-panel="#controls"></script>
  <script src="../scripts/savedSettings.js"></script>
  <style>
    /* The canvas bitmap always matches its CSS box (see resizeCanvas), so pointer maths and exports agree. */
    #main > canvas {
      display: block;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    @media (min-width: 901px) {
      body.app-page #main > canvas {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        width: auto;
        height: auto;
        max-width: none;
        max-height: none;
        align-self: flex-start;
        /* Stops above the fixed footer so the overlay text at the bottom is not cut off. */
        height: calc(100dvh - var(--fg-top, 72px) - 1px - var(--fg-foot, 34px));
      }
    }
    /* Stacked layout without the sheet (tablet widths with a mouse). */
    @media (max-width: 900px) {
      body:not(.ag-sheet).app-page #main > canvas {
        width: 100%;
        height: min(70dvh, 640px);
        max-width: none;
        max-height: none;
      }
    }
    /* Overlay text sits on photos: white with a soft dark halo instead of the difference blend. */
    .ag-hud {
      text-shadow: 0 0 2px rgba(0, 0, 0, .95), 0 0 6px rgba(0, 0, 0, .7);
    }
    #gridColor {
      height: 40px;
      padding: 0;
      cursor: pointer;
    }
    /* Mobile bottom sheet (scripts/settingsToggle.js): canvas fills the area above the sheet. */
    body.ag-sheet.app-page {
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }
    /* Not positioned: the sheet inside has to stack above the footer bar. */
    body.ag-sheet.app-page #main {
      height: calc(100dvh - var(--fg-top, 72px) - var(--ag-sheet-h, 0px));
      min-height: 0;
      padding: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.28);
      overflow: hidden;
    }
    body.ag-sheet.app-page #main > canvas {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      max-width: none;
      max-height: none;
    }
    body.ag-sheet #controls button,
    body.ag-sheet #controls .file-button,
    body.ag-sheet #controls .mode-btn {
      min-height: 44px;
    }
    body.ag-sheet #controls .motion-group > summary {
      min-height: 48px;
    }
    body.ag-sheet #controls input[type="range"] {
      min-height: 36px;
    }
    body.ag-sheet #controls input[type="color"] {
      min-height: 44px;
    }
  </style>
</head>

<body class="app-page panel-ui-page">

  <!-- Main layout: sidebar links + canvas rechts -->
<div id="main">
  <!-- Controls / sidebar -->
  <div id="controls">
    <div class="panel-ui-header">
      <div>
        <p class="motion-eyebrow">PhotoGrid</p>
        <h1>Settings</h1>
      </div>
      <label class="file-button file-button--full">
        Upload Image
        <input type="file" id="imageInput" accept="image/*">
      </label>
      <div class="motion-primary-actions" aria-label="Main actions">
        <button type="button" id="pauseBtn">Pause Animation</button>
        <button type="button" id="exportBtn">Export PNG</button>
      </div>
    </div>

    <details class="motion-group">
      <summary>Samples</summary>
      <div class="motion-group-body">
        <div class="sample-loader sample-loader--carousel">
          <label>Use a sample image</label>
          <div class="sample-carousel-controls">
            <button type="button" id="photoGridSamplePrev" aria-label="Previous sample">&#8592;</button>
            <span class="sample-carousel-name" id="photoGridSampleName">Sample 01</span>
            <button type="button" id="photoGridSampleNext" aria-label="Next sample">&#8594;</button>
          </div>
          <div class="sample-preview" id="photoGridSamplePreview"></div>
          <div class="sample-loader__actions">
            <button type="button" id="photoGridSampleBtn">Load sample</button>
          </div>
        </div>
      </div>
    </details>

    <details class="motion-group">
      <summary>Grid</summary>
      <div class="motion-group-body">
        <label for="gridRes">Grid Resolution</label>
        <input type="range" id="gridRes" min="4" max="40" value="15" class="slider" data-unit="cols">
        <label for="lineThickness">Grid Line Thickness</label>
        <input type="range" id="lineThickness" min="0" max="5" step="0.1" value="1" class="slider" data-unit="px">
        <label for="gridColor">Grid Line Colour</label>
        <input type="color" id="gridColor" value="#ffffff">
        <button type="button" id="toggleGridBtn">Hide Grid</button>
      </div>
    </details>

    <details class="motion-group">
      <summary>Animation</summary>
      <div class="motion-group-body">
        <label for="distortion">Distortion</label>
        <input type="range" id="distortion" min="0" max="1" step="0.01" value="0.3" class="slider">
        <label for="speed">Animation Speed</label>
        <input type="range" id="speed" min="0" max="5" step="0.1" value="1" class="slider" data-unit="×">
        <label for="timeScrub">Animation Phase</label>
        <input type="range" id="timeScrub" min="0" max="1" step="0.001" value="0" class="slider">
        <label for="pointerPush">Pointer Push</label>
        <input type="range" id="pointerPush" min="0" max="1" step="0.05" value="0.3" class="slider">
      </div>
    </details>

    <details class="motion-group">
      <summary>Modes</summary>
      <div class="motion-group-body">
        <label id="animationModeLabel">Animation Mode</label>
        <div class="mode-buttons" role="group" aria-labelledby="animationModeLabel">
          <button type="button" data-mode="wave" class="mode-btn is-active" aria-pressed="true">Wave</button>
          <button type="button" data-mode="chaotic" class="mode-btn">Chaos</button>
          <button type="button" data-mode="tide" class="mode-btn">Tide</button>
          <button type="button" data-mode="spiral" class="mode-btn">Spiral</button>
          <button type="button" data-mode="vortex" class="mode-btn">Vortex</button>
          <button type="button" data-mode="ripple-shift" class="mode-btn">Ripple</button>
          <button type="button" data-mode="pulse" class="mode-btn">Pulse</button>
          <button type="button" data-mode="shear" class="mode-btn">Shear</button>
          <button type="button" data-mode="orbit" class="mode-btn">Orbit</button>
          <button type="button" data-mode="fold" class="mode-btn">Fold</button>
          <button type="button" data-mode="glitch" class="mode-btn">Glitch</button>
          <button type="button" data-mode="drift" class="mode-btn">Drift</button>
        </div>
      </div>
    </details>
  </div>

  <!-- Canvas rechts -->
  <canvas id="canvas"></canvas>
</div>


<div class="app-year">2026 Accidental Graphics</div>

<script src="../scripts/sampleMedia.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const imgInput = document.getElementById('imageInput');
const sampleBtn = document.getElementById('photoGridSampleBtn');
const samplePreview = document.getElementById('photoGridSamplePreview');
const sampleName = document.getElementById('photoGridSampleName');
const samplePrevBtn = document.getElementById('photoGridSamplePrev');
const sampleNextBtn = document.getElementById('photoGridSampleNext');
const gridResSlider = document.getElementById('gridRes');
const distortionSlider = document.getElementById('distortion');
const speedSlider = document.getElementById('speed');
const pauseBtn = document.getElementById('pauseBtn');
const timeScrub = document.getElementById('timeScrub');
const modeButtons = Array.from(document.querySelectorAll('.mode-btn'));
const lineThicknessSlider = document.getElementById('lineThickness');
const gridColorInput = document.getElementById('gridColor');
const pointerPushSlider = document.getElementById('pointerPush');
const exportBtn = document.getElementById('exportBtn');
const toggleGridBtn = document.getElementById('toggleGridBtn');

let img = new Image();
let gridRes = +gridResSlider.value;
let distortion = +distortionSlider.value;
let speed = +speedSlider.value;
let mode = 'wave';
let lineThickness = +lineThicknessSlider.value;
let gridColor = gridColorInput.value;
let pointerPush = +pointerPushSlider.value;
let time = 0;
let showGrid = true;
let isPaused = false;
let isScrubbing = false;
let dirty = true; // a still frame is only redrawn when something changed
toggleGridBtn.textContent = showGrid ? 'Hide Grid' : 'Show Grid';
toggleGridBtn.setAttribute('aria-pressed', String(!showGrid));
pauseBtn.setAttribute('aria-pressed', 'false');

// Grid points in flat arrays (index = row * (cols + 1) + col): rest position o*, animated position p*.
let cols = 0, rows = 0;
let oxs = new Float32Array(0), oys = new Float32Array(0), pxs = new Float32Array(0), pys = new Float32Array(0);
// The photo is stretched to the canvas once; every triangle then samples this texture, not the full-size photo.
const tex = document.createElement('canvas');
let hasImage = false;

// Pointer: eased position and strength, so the grid gives way and settles back instead of snapping.
const pointer = { x: 0, y: 0, tx: 0, ty: 0, strength: 0, target: 0 };
const POINTER_RADIUS = 0.22; // of the shorter canvas side

// ---- layout -------------------------------------------------------------------------------------------
function fitInsets(){
  const nav = document.querySelector('.site-nav');
  if (nav) document.documentElement.style.setProperty('--fg-top', `${nav.offsetHeight}px`);
  const foot = document.querySelector('.app-year');
  if (foot) document.documentElement.style.setProperty('--fg-foot', `${foot.offsetHeight}px`);
}

function resizeCanvas(){
  fitInsets();
  const width = canvas.clientWidth, height = canvas.clientHeight;
  if (!width || !height || (canvas.width === width && canvas.height === height)) return;
  canvas.width = width;
  canvas.height = height;
  buildGrid();
  buildTexture();
}
window.addEventListener('resize', resizeCanvas);
if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener('load', resizeCanvas);

// ---- image --------------------------------------------------------------------------------------------
function buildTexture(){
  hasImage = img.complete && img.naturalWidth > 0 && canvas.width > 0;
  if (hasImage) {
    tex.width = canvas.width;
    tex.height = canvas.height;
    tex.getContext('2d').drawImage(img, 0, 0, tex.width, tex.height);
  }
  dirty = true;
}

function setImageSource(src, { revokeUrl = false } = {}){
  img.onload = () => {
    if(revokeUrl) URL.revokeObjectURL(src);
    buildTexture();
  };
  img.onerror = () => {
    alert('Could not load that image.');
    if(revokeUrl) URL.revokeObjectURL(src);
  };
  img.src = src;
}

imgInput.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file){
    const url = URL.createObjectURL(file);
    setImageSource(url, { revokeUrl: true });
  }
  imgInput.value = '';
});

const sampleCarousel = window.SampleMedia?.createCarousel({
  type: 'images',
  previewEl: samplePreview,
  nameEl: sampleName,
  prevBtn: samplePrevBtn,
  nextBtn: sampleNextBtn,
  emptyMessage: 'Add sample stills in sampleMedia.js'
});

if(sampleCarousel?.hasSamples){
  sampleBtn?.addEventListener('click', ()=>{
    const sample = sampleCarousel.getCurrentSample?.();
    if(!sample?.src) return;
    setImageSource(`${sample.src}?c=${Date.now()}`);
  });
} else {
  sampleBtn?.setAttribute('disabled','true');
}

// ---- pointer (mouse hover, pen, or a finger dragging on the canvas) --------------------------------
function setPointer(e){
  const rect = canvas.getBoundingClientRect();
  pointer.tx = e.clientX - rect.left;
  pointer.ty = e.clientY - rect.top;
  if (pointer.target === 0) {
    pointer.x = pointer.tx;
    pointer.y = pointer.ty;
  }
}
canvas.addEventListener('pointerdown', e=>{
  setPointer(e);
  pointer.target = 1;
  if (e.pointerType !== 'mouse') canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  setPointer(e);
  if (e.pointerType === 'mouse') pointer.target = 1;
});
const releasePointer = ()=>{ pointer.target = 0; };
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('pointerleave', e=>{ if (e.pointerType === 'mouse') releasePointer(); });

// ---- grid ---------------------------------------------------------------------------------------------
function buildGrid(){
  cols = gridRes;
  rows = Math.max(1, Math.floor(gridRes * canvas.height / canvas.width));
  const count = (cols + 1) * (rows + 1);
  oxs = new Float32Array(count); oys = new Float32Array(count);
  pxs = new Float32Array(count); pys = new Float32Array(count);
  for(let y=0; y<=rows; y++){
    for(let x=0; x<=cols; x++){
      const i = y * (cols + 1) + x;
      oxs[i] = pxs[i] = x*canvas.width/cols;
      oys[i] = pys[i] = y*canvas.height/rows;
    }
  }
  dirty = true;
}

// Scratch for the cell being drawn (no allocations per frame).
const dX = new Float64Array(4), dY = new Float64Array(4);

// Draws the texture triangle s0 s1 s2 (texture space = rest positions) onto d0 d1 d2.
function drawTexturedTriangle(s0x, s0y, s1x, s1y, s2x, s2y, d0x, d0y, d1x, d1y, d2x, d2y){
  const denom = s0x * (s1y - s2y) + s1x * (s2y - s0y) + s2x * (s0y - s1y);
  if (denom === 0) return;
  const m11 = (d0x * (s1y - s2y) + d1x * (s2y - s0y) + d2x * (s0y - s1y)) / denom;
  const m12 = (d0x * (s2x - s1x) + d1x * (s0x - s2x) + d2x * (s1x - s0x)) / denom;
  const m21 = (d0y * (s1y - s2y) + d1y * (s2y - s0y) + d2y * (s0y - s1y)) / denom;
  const m22 = (d0y * (s2x - s1x) + d1y * (s0x - s2x) + d2y * (s1x - s0x)) / denom;
  const dx = (d0x * (s1x * s2y - s2x * s1y) + d1x * (s2x * s0y - s0x * s2y) + d2x * (s0x * s1y - s1x * s0y)) / denom;
  const dy = (d0y * (s1x * s2y - s2x * s1y) + d1y * (s2x * s0y - s0x * s2y) + d2y * (s0x * s1y - s1x * s0y)) / denom;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(d0x, d0y);
  ctx.lineTo(d1x, d1y);
  ctx.lineTo(d2x, d2y);
  ctx.closePath();
  ctx.clip();
  ctx.transform(m11, m21, m12, m22, dx, dy);
  ctx.drawImage(tex, 0, 0);
  ctx.restore();
}

// A cell is two triangles. Corners are pushed 1 px outward and the diagonal 1 px either way, so the
// anti-aliased seams between triangles do not show.
function drawCell(i1, i2, i3, i4){
  const cx = (pxs[i1] + pxs[i2] + pxs[i3] + pxs[i4]) / 4;
  const cy = (pys[i1] + pys[i2] + pys[i3] + pys[i4]) / 4;
  for (let k = 0; k < 4; k++) {
    const i = k === 0 ? i1 : k === 1 ? i2 : k === 2 ? i3 : i4;
    const dx = pxs[i] - cx;
    const dy = pys[i] - cy;
    const len = Math.hypot(dx, dy);
    const scale = len === 0 ? 1 : (len + 1) / len;
    dX[k] = cx + dx * scale;
    dY[k] = cy + dy * scale;
  }
  const ddx = dX[2] - dX[0];
  const ddy = dY[2] - dY[0];
  const dl = Math.hypot(ddx, ddy) || 1;
  const nx = -ddy / dl;
  const ny = ddx / dl;
  drawTexturedTriangle(oxs[i1], oys[i1], oxs[i2], oys[i2], oxs[i3], oys[i3],
    dX[0] + nx, dY[0] + ny, dX[1], dY[1], dX[2] + nx, dY[2] + ny);
  drawTexturedTriangle(oxs[i1], oys[i1], oxs[i3], oys[i3], oxs[i4], oys[i4],
    dX[0] - nx, dY[0] - ny, dX[2] - nx, dY[2] - ny, dX[3], dY[3]);
}

// ---- data overlay (scripts/dataLayer.js): DOM only, never part of the exported PNG ---------------------
const hud = AGData.hud(canvas, { canvas, code: 'PGR', blend: false });
AGData.readouts(document.getElementById('controls'));
const PHASE_RANGE = Math.PI * 4;
let hudAt = 0;
let renderMs = 0;

function updateHud(normalizedPhase){
  const cells = cols * rows;
  const nat = hasImage ? `${img.naturalWidth} × ${img.naturalHeight}` : '— × —';
  hud.set('Grid', `${AGData.fmt(cols, 0, 2)} × ${AGData.fmt(rows, 0, 2)}`, '', 'tr');
  hud.set('Cells', AGData.fmt(cells, 0, 4), '', 'tr');
  hud.set('Cell', `${AGData.fmt(canvas.width / cols, 0, 3)} × ${AGData.fmt(canvas.height / rows, 0, 3)}`, 'px', 'tr');
  hud.set('Source', nat, 'px', 'bl');
  hud.set('Texel/cell', hasImage ? `${AGData.fmt(img.naturalWidth / cols, 0, 3)} × ${AGData.fmt(img.naturalHeight / rows, 0, 3)}` : '— × —', '', 'bl');
  const active = modeButtons.find(btn => btn.dataset.mode === mode);
  hud.set('Mode', (active ? active.textContent : mode).toUpperCase(), '', 'br');
  hud.set('Phase', AGData.fmt(normalizedPhase, 3), 'φ', 'br');
  hud.set('Render', AGData.fmt(renderMs, 1, 2), 'ms', 'br');
}

// ---- loop ---------------------------------------------------------------------------------------------
let lastNow = 0;
function animate(now){
  requestAnimationFrame(animate);
  hud.frame(now);
  // dt in 60 Hz frames, so speed is the same on 60 and 120 Hz screens.
  const frames = Math.min(5, Math.max(0, (now - lastNow) / (1000 / 60)));
  lastNow = now;
  if (!cols) return;

  // pointer easing
  const k = 1 - Math.exp(-frames * 0.25);
  pointer.strength += (pointer.target - pointer.strength) * k * 0.6;
  pointer.x += (pointer.tx - pointer.x) * Math.min(1, k * 1.6);
  pointer.y += (pointer.ty - pointer.y) * Math.min(1, k * 1.6);
  if (Math.abs(pointer.target - pointer.strength) < 0.002) pointer.strength = pointer.target;
  const pushing = pointerPush > 0 && (pointer.strength > 0 || pointer.target > 0);

  const running = !isPaused && (speed > 0 || mode === 'glitch');
  const normalizedPhase = ((time % PHASE_RANGE) + PHASE_RANGE) % PHASE_RANGE / PHASE_RANGE;
  if (!(running || dirty || pushing || mode === 'glitch')) {
    if (now - hudAt > 100) { hudAt = now; updateHud(normalizedPhase); }
    return;
  }
  dirty = false;
  const t0 = performance.now();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // update points
  const w = canvas.width, h = canvas.height;
  const radius = POINTER_RADIUS * Math.min(w, h);
  const push = pointerPush * pointer.strength * radius * 0.6;
  for(let y=0; y<=rows; y++){
    for(let x=0; x<=cols; x++){
      const i = y * (cols + 1) + x;
      const f = getWarp(x/cols, y/rows, time, x, y);
      let px = oxs[i] + f.x*distortion*w*0.1;
      let py = oys[i] + f.y*distortion*h*0.1;
      if (push > 0.01) {
        const ddx = px - pointer.x;
        const ddy = py - pointer.y;
        const d = Math.hypot(ddx, ddy);
        if (d < radius && d > 0.0001) {
          const fall = 1 - d / radius;
          const amount = fall * fall * push;
          px += ddx / d * amount;
          py += ddy / d * amount;
        }
      }
      pxs[i] = px;
      pys[i] = py;
    }
  }

  // draw cells
  if (hasImage) {
    for(let y=0; y<rows; y++){
      for(let x=0; x<cols; x++){
        const i1 = y * (cols + 1) + x;
        drawCell(i1, i1 + 1, i1 + cols + 2, i1 + cols + 1);
      }
    }
  }

  // draw grid lines: one path for the whole grid
  if(showGrid && lineThickness>0){
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = lineThickness;
    ctx.beginPath();
    for(let y=0; y<=rows; y++){
      for(let x=0; x<cols; x++){
        const i = y * (cols + 1) + x;
        ctx.moveTo(pxs[i], pys[i]);
        ctx.lineTo(pxs[i + 1], pys[i + 1]);
      }
    }
    for(let x=0; x<=cols; x++){
      for(let y=0; y<rows; y++){
        const i = y * (cols + 1) + x;
        ctx.moveTo(pxs[i], pys[i]);
        ctx.lineTo(pxs[i + cols + 1], pys[i + cols + 1]);
      }
    }
    ctx.stroke();
  }

  if(!isPaused){
    time += 0.02*speed*frames;
  }
  if(!isScrubbing){
    const next = normalizedPhase.toFixed(3);
    if (timeScrub.value !== next) timeScrub.value = next;
  }
  renderMs += (performance.now() - t0 - renderMs) * 0.2;
  if (now - hudAt > 100) { hudAt = now; updateHud(normalizedPhase); }
}

function getWarp(nx, ny, t, ix, iy){
  switch(mode){
    case 'wave':
      return {x: Math.sin(t + nx*6)*1, y: Math.cos(t + ny*6)*1};
    case 'chaotic':
      return {x: Math.sin(nx*10+t)*1, y: Math.cos(ny*10+t)*1};
    case 'tide':
      return {x: Math.sin(nx*8 + t)*1, y: Math.sin(ny*8 - t)*1};
    case 'spiral':
      return {
        x: Math.cos(t + nx * 12) * (0.5 + ny),
        y: Math.sin(t + ny * 12) * (0.5 + nx)
      };
    case 'vortex':
      const angle = Math.atan2(ny - 0.5, nx - 0.5);
      const radius = Math.hypot(nx - 0.5, ny - 0.5);
      return {
        x: Math.sin(angle * 6 + t) * radius * 2,
        y: Math.cos(angle * 6 - t) * radius * 2
      };
    case 'ripple-shift':
      return {
        x: Math.sin((nx + ny) * 10 + t) * (1 - ny),
        y: Math.cos((nx - ny) * 10 - t) * (1 - nx)
      };
    case 'pulse':
      return {
        x: Math.sin(t * 2 + nx * 20) * 0.8,
        y: Math.sin(t * 2 + ny * 20) * 0.8
      };
    case 'shear':
      return {
        x: ny * Math.sin(t + nx * 8),
        y: nx * Math.cos(t - ny * 8)
      };
    case 'orbit':
      return {
        x: Math.cos(t + nx * 15) * (ny - 0.5),
        y: Math.sin(t + ny * 15) * (nx - 0.5)
      };
    case 'fold':
      return {
        x: Math.abs(Math.sin(nx * 12 + t)) * (ny - 0.5) * 2,
        y: Math.abs(Math.cos(ny * 12 - t)) * (nx - 0.5) * 2
      };
    case 'glitch':
      return {
        x: (Math.random() - 0.5) * 0.5 + Math.sin(t + nx * 25) * 0.4,
        y: (Math.random() - 0.5) * 0.5 + Math.cos(t + ny * 25) * 0.4
      };
    case 'drift':
      return {
        x: Math.sin(t * 0.5 + nx * 6 + ny * 6) * (0.2 + ny),
        y: Math.cos(t * 0.5 + nx * 6 - ny * 6) * (0.2 + nx)
      };
    default:
      return {x:0,y:0};
  }
}

const markDirty = ()=>{ dirty = true; };
gridResSlider.addEventListener('input', ()=>{ gridRes = +gridResSlider.value; buildGrid(); });
distortionSlider.addEventListener('input', ()=>{ distortion = +distortionSlider.value; markDirty(); });
speedSlider.addEventListener('input', ()=>{ speed = +speedSlider.value; markDirty(); });
pointerPushSlider.addEventListener('input', ()=>{ pointerPush = +pointerPushSlider.value; markDirty(); });
lineThicknessSlider.addEventListener('input', ()=>{ lineThickness = +lineThicknessSlider.value; markDirty(); });
gridColorInput.addEventListener('input', ()=>{ gridColor = gridColorInput.value; markDirty(); });
modeButtons.forEach((btn)=>{
  if(!btn.hasAttribute('aria-pressed')) btn.setAttribute('aria-pressed', 'false');
  btn.addEventListener('click', ()=>{
    mode = btn.dataset.mode;
    modeButtons.forEach((b)=>{
      const active = b === btn;
      b.classList.toggle('is-active', active);
      b.setAttribute('aria-pressed', String(active));
    });
    markDirty();
  });
});

pauseBtn.addEventListener('click', ()=>{
  isPaused = !isPaused;
  pauseBtn.textContent = isPaused ? 'Resume Animation' : 'Pause Animation';
  pauseBtn.setAttribute('aria-pressed', String(isPaused));
});

timeScrub.addEventListener('pointerdown', ()=>{ isScrubbing = true; });
window.addEventListener('pointerup', ()=>{ isScrubbing = false; });
window.addEventListener('pointercancel', ()=>{ isScrubbing = false; });
timeScrub.addEventListener('input', ()=>{
  time = (parseFloat(timeScrub.value) || 0) * PHASE_RANGE;
  markDirty();
});

// PNG export (grid lines included, overlay never). Phones use the share sheet when it accepts files.
exportBtn.addEventListener('click', ()=>{
  canvas.toBlob(blob=>{
    if (!blob) return;
    const name = `photogrid-${Date.now()}.png`;
    const file = new File([blob], name, { type: 'image/png' });
    if (window.matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(()=>{});
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
});

toggleGridBtn.addEventListener('click', ()=>{
  showGrid = !showGrid;
  toggleGridBtn.textContent = showGrid ? 'Hide Grid' : 'Show Grid';
  toggleGridBtn.setAttribute('aria-pressed', String(!showGrid));
  markDirty();
});

// Remember the settings between visits (scripts/savedSettings.js).
AGSettings.persist('photogrid', {
  controls: ['gridRes', 'lineThickness', 'gridColor', 'distortion', 'speed', 'pointerPush'],
  get: () => ({ mode, showGrid }),
  set: (saved) => {
    modeButtons.find((btn) => btn.dataset.mode === saved.mode)?.click();
    if (typeof saved.showGrid === 'boolean' && saved.showGrid !== showGrid) toggleGridBtn.click();
  },
});

resizeCanvas();
requestAnimationFrame(animate);
</script>
</body>
</html>
