<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gallery · Accidental Graphics</title>
  <meta name="description" content="Work made with the Accidental Graphics tools.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/data.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@100..900,0..100&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="images/face cursor.png">
  <script defer src="scripts/navConfig.js"></script>
  <script defer src="scripts/navMenu.js"></script>
  <script src="scripts/dataLayer.js"></script>
</head>
<body>
  <main class="gallery-wrapper">
    <section class="gallery-hero">
      <p class="page-tag"><span>CAT. 02 — GALLERY</span><span id="galleryCount">--- SPECIMENS</span></p>
      <h1>Gallery</h1>
      <p class="gallery-lede" id="galleryIntro"></p>
      <div class="gallery-actions">
        <a class="gallery-action" href="https://www.instagram.com/byjorne/" target="_blank" rel="noopener noreferrer">
          DM&nbsp;@byjorne
        </a>
        <a class="gallery-action" href="https://www.instagram.com/explore/tags/accidentalgraphics/" target="_blank" rel="noopener noreferrer">
          Use&nbsp;#AccidentalGraphics
        </a>
      </div>
    </section>

    <section aria-label="Work made with the tools">
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>
  </main>
  <div class="app-year" data-live>2026 Accidental Graphics</div>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('galleryGrid');
    const intro = document.getElementById('galleryIntro');
    if (!grid || !window.AGContent) return;

    const link = (href, text) => {
      const a = document.createElement('a');
      a.href = href;
      a.textContent = text;
      if (/^https?:/i.test(href) && !href.startsWith(location.origin)) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
      return a;
    };

    Promise.all([AGContent.load('gallery'), AGContent.tools().catch(() => [])]).then(([data, tools]) => {
      intro.textContent = data.intro || '';
      intro.hidden = !data.intro;
      grid.innerHTML = '';
      const count = Array.isArray(data.items) ? data.items.filter(item => item && item.image).length : 0;
      document.getElementById('galleryCount').textContent = `${String(count).padStart(3, '0')} SPECIMENS`;

      let n = 0;
      (Array.isArray(data.items) ? data.items : []).filter(item => item && item.image).forEach(item => {
        const card = document.createElement('article');
        card.className = 'gallery-card';
        card.style.setProperty('--i', n);
        const index = ++n;

        const img = document.createElement('img');
        img.src = AGContent.resolve(item.image);
        img.alt = item.alt || (item.tool ? `Made with ${item.tool}` : 'Made with Accidental Graphics');
        img.loading = 'lazy';
        card.appendChild(img);

        // Specimen number top left, real pixel size bottom right (filled in when the image has loaded).
        const specimen = document.createElement('span');
        specimen.className = 'gallery-card__tag gallery-card__tag--tl';
        specimen.setAttribute('aria-hidden', 'true');
        specimen.textContent = `SPEC. G-${String(index).padStart(3, '0')}`;
        const dims = document.createElement('span');
        dims.className = 'gallery-card__tag gallery-card__tag--tr';
        dims.setAttribute('aria-hidden', 'true');
        const showSize = () => { dims.textContent = `${img.naturalWidth} × ${img.naturalHeight} PX`; };
        if (img.complete && img.naturalWidth) showSize(); else img.addEventListener('load', showSize, { once: true });
        card.append(specimen, dims);

        const meta = document.createElement('div');
        meta.className = 'gallery-card__meta';

        if (item.maker) {
          const credit = document.createElement('p');
          credit.className = 'gallery-card__credit';
          credit.append('by ', item.maker_link ? link(item.maker_link, item.maker) : item.maker);
          meta.appendChild(credit);
        }

        const fig = document.createElement('p');
        fig.className = 'gallery-card__fig';
        fig.textContent = `FIG. ${String(index).padStart(2, '0')} \u2014 ${(item.alt || '').replace(/^Made with .*/, '')}`.replace(/ \u2014 $/, '');
        meta.insertBefore(fig, meta.firstChild);

        if (item.tool) {
          const toolLine = document.createElement('p');
          toolLine.className = 'gallery-card__tool';
          const tool = tools.find(t => t.name.toLowerCase() === String(item.tool).toLowerCase());
          toolLine.append('Tool: ', tool ? link(tool.url, tool.name) : item.tool);
          meta.appendChild(toolLine);
        }

        if (meta.childElementCount) card.appendChild(meta);
        grid.appendChild(card);
      });
    }).catch(() => {
      grid.innerHTML = '<p>The gallery could not be loaded. Try again in a moment.</p>';
    });
  });
  </script>
</body>
</html>
