// simple matching for velocities between frames (blobs array of {x,y} in normalized proc coords)
function assignBlobId(blob){
  if(blob.id == null){
    blob.id = blobIdSeed++;
  }
  return blob.id;
}

function matchBlobs(prevPoints, currPoints){
  const res = [];
  const used = new Array(currPoints.length).fill(false);
  for(const p of prevPoints){
    let bestIndex = -1, bestD = 1e9;
    for(let i=0;i<currPoints.length;i++){
      if(used[i]) continue;
      const c = currPoints[i];
      const dx = c.x - p.x, dy = c.y - p.y;
      const d = Math.hypot(dx,dy);
      if(d < bestD){ bestD = d; bestIndex = i; }
    }
    if(bestIndex >= 0 && bestD < getBlobMatchDistance(p, currPoints[bestIndex])){
      used[bestIndex] = true;
      const curr = currPoints[bestIndex];
      curr.id = curr.id ?? p.id ?? assignBlobId(curr);
      res.push({prev: p, curr, matched:true, trackId: curr.id});
    } else {
      res.push({prev: p, curr: null, matched:false, trackId: p.id});
    }
  }
  // add unmatched currPoints as new
  for(let i=0;i<currPoints.length;i++){
    if(!used[i]){
      const curr = currPoints[i];
      curr.id = curr.id ?? assignBlobId(curr);
      res.push({prev: null, curr, matched:false, trackId: curr.id});
    }
  }
  return res;
}

// painting parameters
let lastFrameTime = performance.now();

function renderCompositeFrame(){
  if(!canvasW || !canvasH) return;
  dispCtx.clearRect(0,0,canvasW,canvasH);
  if(showVideoBackgroundEl?.checked && hasVideoSource() && video.readyState >= 2){
    try{
      drawCurrentVideoFrame(dispCtx, canvasW, canvasH);
    } catch(err){
      // The frame may be temporarily unavailable during seek/load.
    }
  }
  motionLayers.forEach(layer => {
    if(layer.visible) dispCtx.drawImage(layer.canvas, 0, 0);
  });
}

function drawCenteredDiamond(ctx, x, y, halfW, halfH = halfW){
  ctx.beginPath();
  ctx.moveTo(x, y - halfH);
  ctx.lineTo(x + halfW, y);
  ctx.lineTo(x, y + halfH);
  ctx.lineTo(x - halfW, y);
  ctx.closePath();
}

function drawCrossShape(ctx, x, y, halfW, halfH = halfW){
  ctx.beginPath();
  ctx.moveTo(x - halfW, y);
  ctx.lineTo(x + halfW, y);
  ctx.moveTo(x, y - halfH);
  ctx.lineTo(x, y + halfH);
}

function drawStarShape(ctx, x, y, halfW, halfH){
  ctx.beginPath();
  for(let i = 0; i < 10; i++){
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    const scale = i % 2 === 0 ? 1 : 0.42;
    const px = x + Math.cos(angle) * halfW * scale;
    const py = y + Math.sin(angle) * halfH * scale;
    if(i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawCustomShape(ctx, x, y, halfW, halfH){
  if(customShapePoints.length < 2){
    drawStarShape(ctx, x, y, halfW, halfH);
    return;
  }
  ctx.beginPath();
  customShapePoints.forEach((point, index) => {
    const px = x - halfW + point.x * halfW * 2;
    const py = y - halfH + point.y * halfH * 2;
    if(index === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });
  if(customShapePoints.length > 2) ctx.closePath();
}

function makeTrackedShapePath(ctx, x, y, halfW, halfH, shape, {filledCross = false} = {}){
  if(shape === 'circle'){
    ctx.beginPath();
    ctx.ellipse(x, y, halfW, halfH, 0, 0, Math.PI * 2);
  } else if(shape === 'diamond'){
    drawCenteredDiamond(ctx, x, y, halfW, halfH);
  } else if(shape === 'star'){
    drawStarShape(ctx, x, y, halfW, halfH);
  } else if(shape === 'custom'){
    drawCustomShape(ctx, x, y, halfW, halfH);
  } else if(shape === 'cross'){
    if(filledCross){
      const bar = Math.max(2, Math.min(halfW, halfH) * 0.35);
      ctx.beginPath();
      ctx.rect(x - halfW, y - bar * 0.5, halfW * 2, bar);
      ctx.rect(x - bar * 0.5, y - halfH, bar, halfH * 2);
    } else {
      drawCrossShape(ctx, x, y, halfW, halfH);
    }
  } else {
    ctx.beginPath();
    ctx.rect(x - halfW, y - halfH, halfW * 2, halfH * 2);
  }
}

function drawBlobStroke(x, y, point, brushPx){
  if(!strokeEnabledEl?.checked) return;
  const {halfW, halfH} = getBlobBox(point, brushPx);
  const width = Math.max(2, halfW * 2);
  const height = Math.max(2, halfH * 2);
  const lineWidth = Math.max(0.5, parseFloat(strokeWidthEl.value) || 1);
  const shape = trackedShapeEl?.value || 'square';
  paintCtx.save();
  paintCtx.globalCompositeOperation = 'source-over';
  paintCtx.globalAlpha = 1;
  paintCtx.strokeStyle = strokeColorEl.value || '#ffffff';
  paintCtx.lineWidth = lineWidth;
  paintCtx.lineJoin = 'miter';
  if(shape === 'cross'){
    paintCtx.lineCap = 'square';
    makeTrackedShapePath(paintCtx, x, y, halfW, halfH, shape);
    paintCtx.stroke();
  } else if(shape === 'square'){
    paintCtx.strokeRect(x - halfW, y - halfH, width, height);
  } else {
    makeTrackedShapePath(paintCtx, x, y, halfW, halfH, shape);
    paintCtx.stroke();
  }
  paintCtx.restore();
}

function drawTrackedShapeCopy(sx, sy, point, brushPx, alpha){
  const shape = trackedShapeEl?.value || 'square';
  const {halfW, halfH} = getBlobBox(point, brushPx);
  const srcX = Math.max(0, Math.floor(sx - halfW));
  const srcY = Math.max(0, Math.floor(sy - halfH));
  const srcW = Math.min(canvasW - srcX, Math.ceil(halfW * 2));
  const srcH = Math.min(canvasH - srcY, Math.ceil(halfH * 2));
  if(srcW <= 0 || srcH <= 0) return;

  paintCtx.save();
  paintCtx.globalAlpha = alpha;
  makeTrackedShapePath(paintCtx, sx, sy, halfW, halfH, shape, {filledCross: true});
  paintCtx.clip();
  paintCtx.drawImage(sourceCanvas, srcX, srcY, srcW, srcH, srcX, srcY, srcW, srcH);
  paintCtx.restore();
}

function drawTrackedCenterDot(x, y, brushPx){
  if(!trackDotEnabledEl?.checked) return;
  const shape = trackDotShapeEl?.value || 'circle';
  const size = Math.max(1, parseFloat(trackDotSizeEl?.value) || Math.min(10, brushPx * 0.18));
  const radius = size * 0.5;
  const opacity = Math.max(0.1, Math.min(1, parseFloat(trackDotOpacityEl?.value) || 1));
  paintCtx.save();
  paintCtx.globalCompositeOperation = 'source-over';
  paintCtx.globalAlpha = opacity;
  paintCtx.fillStyle = trackDotColorEl?.value || strokeColorEl.value || '#ffffff';
  paintCtx.strokeStyle = trackDotColorEl?.value || strokeColorEl.value || '#ffffff';
  paintCtx.lineWidth = Math.max(1, radius * 0.35);
  paintCtx.lineCap = 'square';
  paintCtx.lineJoin = 'miter';
  if(shape === 'square'){
    paintCtx.fillRect(x - radius, y - radius, size, size);
  } else if(shape === 'ring'){
    paintCtx.beginPath();
    paintCtx.arc(x, y, radius, 0, Math.PI * 2);
    paintCtx.stroke();
  } else if(shape === 'cross'){
    drawCrossShape(paintCtx, x, y, radius, radius);
    paintCtx.stroke();
  } else {
    paintCtx.beginPath();
    paintCtx.arc(x, y, radius, 0, Math.PI * 2);
    paintCtx.fill();
  }
  paintCtx.restore();
}

function processLoop(){
  if(video.paused || video.ended){ rafId = requestAnimationFrame(processLoop); return; }
  const activeLayer = getActiveLayer();
  if(!activeLayer){
    ensureActiveLayer('Base Video');
  }

  // draw current video frame into proc canvas
  drawCurrentVideoFrame(procCtx, procW, procH);
  const currImage = procCtx.getImageData(0,0,procW,procH);

  // compute difference with prev
  if(prevFrame === null){
    prevFrame = new Uint8ClampedArray(currImage.data);
    prevCtx.putImageData(currImage, 0, 0);
    rafId = requestAnimationFrame(processLoop); 
    return;
  }

  // build binary motion map (RGBA)
  const motion = new Uint8ClampedArray(procW * procH * 4);
  const thresh = getMotionThreshold();
  for(let i=0;i<currImage.data.length;i+=4){
    const dr = Math.abs(currImage.data[i] - prevFrame[i]);
    const dg = Math.abs(currImage.data[i+1] - prevFrame[i+1]);
    const db = Math.abs(currImage.data[i+2] - prevFrame[i+2]);
    const d = (dr + dg + db) / 3;
    const flag = d > thresh ? 255 : 0;
    motion[i] = motion[i+1] = motion[i+2] = flag;
    motion[i+3] = 255;
  }
  // detect connected motion regions from the motion map
  const maxBlobs = parseInt(maxBlobsEl.value, 10);
  const blobs = findBlobsFromBinary(motion, procW, procH, maxBlobs);
  const currPoints = limitMotionBlobs(blobs, maxBlobs);

  // match prev->curr to estimate velocities
  const matches = matchBlobs(prevBlobs, currPoints);
  applyAllTrackSmoothing(matches);

  const now = performance.now();

  // fade paint canvas (persistence)
  const fade = parseFloat(fadeEl.value);
  paintCtx.globalCompositeOperation = 'source-over';
  paintCtx.fillStyle = `rgba(0,0,0,${1 - fade})`;
  paintCtx.fillRect(0,0,paintCanvas.width, paintCanvas.height);

  // draw per-blob paint stroke using current video frame as source
  // We'll sample region from the full-size video frame. Map blob normalized coords to canvas pixel coords.
  // Draw shaped copies sampled from the current video frame, displaced along velocity.
  const smearPx = parseFloat(smearEl.value);
  const brushPx = parseFloat(brushEl.value);
  const alpha = 1;
  const stampLimit = parseInt(stampLimitEl.value, 10) || 30;
  const noiseAmount = Math.max(0, parseFloat(motionNoiseEl.value) || 0);

  // draw current video frame to the reusable source canvas at display resolution
  if(sourceCanvas.width !== canvasW || sourceCanvas.height !== canvasH){
    sourceCanvas.width = canvasW;
    sourceCanvas.height = canvasH;
  }
  drawCurrentVideoFrame(sourceCtx, canvasW, canvasH);

  // for each matched pair compute velocity and stamp multiple samples
  for(const m of matches){
    if(!m.curr) continue;
    const cxNorm = m.curr.x, cyNorm = m.curr.y;
    const cx = Math.floor(cxNorm * canvasW);
    const cy = Math.floor(cyNorm * canvasH);

    // velocity in normalized coords
    let vx = 0, vy = 0;
    if(m.prev && m.prev.x != null){
      vx = m.curr.x - m.prev.x;
      vy = m.curr.y - m.prev.y;
    } else {
      // no prev match: we can approximate using frame diff strength direction by sampling neighborhood gradient
      // but to keep CPU simple, treat as small motion or skip directional smear
      vx = 0; vy = 0;
    }
    const vmag = Math.hypot(vx, vy);

    // determine direction (if almost zero, use tiny random jitter to still paint)
    let ndx = 0, ndy = 0;
    if(vmag > 0.0001){
      ndx = vx / vmag; ndy = vy / vmag;
    } else {
      // low motion, use small random direction to create texture
      const a = (Math.random() - 0.5) * 2 * Math.PI;
      ndx = Math.cos(a) * noiseAmount; ndy = Math.sin(a) * noiseAmount;
    }

    // number of stamps depends on smear length
    const stamps = Math.max(1, Math.round(Math.min(stampLimit, smearPx / Math.max(4, brushPx/2))));
    for(let s=0; s<stamps; s++){
      const t = (s + 1) / (stamps + 1); // 0..1 along smear
      // displacement amount scales with t and with vmag and smearPx
      const disp = (vmag * smearPx * 1.5) * t + smearPx * (t * 0.25);
      const sx = Math.floor(cx - ndx * disp);
      const sy = Math.floor(cy - ndy * disp);

      drawTrackedShapeCopy(sx, sy, m.curr, brushPx, alpha);
    }
    drawBlobStroke(cx, cy, m.curr, brushPx);
    drawTrackedCenterDot(cx, cy, brushPx);
  }

  // composite: draw the static background (the current video frame) but keep non-moving areas static:
  // We'll draw the original video frame as background, then overlay paint layer.
  // The idea in your request was to keep non-moving parts unaffected by paint; so we draw the video as base (unchanged)
  // and the paint (accumulation) on top — the paint only comes from moving parts by construction.
  renderCompositeFrame();

  // prepare for next frame
  prevFrame = new Uint8ClampedArray(currImage.data);
  prevCtx.putImageData(currImage, 0, 0);
  prevBlobs = currPoints.map(keepTrackPoint);

  rafId = requestAnimationFrame(processLoop);
}

function waitForVideoStart(){
  if(video.currentTime <= 0.01){
    return new Promise(resolve => requestAnimationFrame(resolve));
  }
  return new Promise((resolve, reject) => {
    const onSeeked = () => {
      cleanup();
      resolve();
    };
    const onError = () => {
      cleanup();
      reject(new Error('Could not rewind the video.'));
    };
    const cleanup = () => {
      video.removeEventListener('seeked', onSeeked);
      video.removeEventListener('error', onError);
    };
    video.addEventListener('seeked', onSeeked, {once: true});
    video.addEventListener('error', onError, {once: true});
    video.currentTime = 0;
  });
}

function getMp4RecordingType(){
  if(typeof MediaRecorder === 'undefined') return '';
  const types = [
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4;codecs=avc1.4D401E',
    'video/mp4;codecs=avc1',
    'video/mp4'
  ];
  return types.find(type => MediaRecorder.isTypeSupported(type)) || '';
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.click();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function getProjectSlug(){
  return safeFileName(projectNameInput?.value || 'MotionStills') || 'MotionStills';
}

function canvasToPngBlob(canvasEl){
  return new Promise((resolve, reject) => {
    if(!canvasEl?.width || !canvasEl?.height){
      reject(new Error('Nothing to export yet.'));
      return;
    }
    canvasEl.toBlob(blob => {
      if(blob) resolve(blob);
      else reject(new Error('Unable to export PNG.'));
    }, 'image/png');
  });
}

function makeExportCanvas({transparent = false, activeOnly = false} = {}){
  const out = document.createElement('canvas');
  out.width = canvasW;
  out.height = canvasH;
  const outCtx = out.getContext('2d');
  if(!transparent){
    outCtx.fillStyle = '#000000';
    outCtx.fillRect(0, 0, out.width, out.height);
    if(showVideoBackgroundEl?.checked && hasVideoSource() && video.readyState >= 2){
      drawCurrentVideoFrame(outCtx, out.width, out.height);
    }
  }
  if(activeOnly){
    const layer = getActiveLayer();
    if(layer) outCtx.drawImage(layer.canvas, 0, 0);
  } else {
    motionLayers.forEach(layer => {
      if(layer.visible) outCtx.drawImage(layer.canvas, 0, 0);
    });
  }
  return out;
}

async function exportCanvasAsPng(canvasEl, filename){
  try{
    const blob = await canvasToPngBlob(canvasEl);
    downloadBlob(blob, filename);
  } catch(error){
    alert(error.message || 'Unable to export PNG.');
  }
}

function safeFileName(name){
  return String(name || 'layer').trim().replace(/[^a-z0-9._-]+/gi, '-').replace(/^-+|-+$/g, '') || 'layer';
}

const crcTable = (() => {
  const table = new Uint32Array(256);
  for(let i = 0; i < 256; i++){
    let c = i;
    for(let k = 0; k < 8; k++){
      c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    }
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(bytes){
  let crc = 0xffffffff;
  for(let i = 0; i < bytes.length; i++){
    crc = crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
  }
  return (crc ^ 0xffffffff) >>> 0;
}

function dosDateTime(date = new Date()){
  const year = Math.max(1980, date.getFullYear());
  const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
  const day = (year - 1980) << 9 | ((date.getMonth() + 1) << 5) | date.getDate();
  return {time, day};
}

async function createZipBlob(files, rootName){
  const encoder = new TextEncoder();
  const now = dosDateTime();
  const entries = [];
  let offset = 0;

  for(const file of files){
    const path = `${rootName}/${file.filename}`.replace(/\\/g, '/');
    const nameBytes = encoder.encode(path);
    const data = new Uint8Array(await file.blob.arrayBuffer());
    const checksum = crc32(data);
    entries.push({nameBytes, data, checksum, offset});
    offset += 30 + nameBytes.length + data.length;
  }

  const centralStart = offset;
  const centralSize = entries.reduce((sum, entry) => sum + 46 + entry.nameBytes.length, 0);
  const totalSize = centralStart + centralSize + 22;
  const zip = new Uint8Array(totalSize);
  const view = new DataView(zip.buffer);
  let cursor = 0;

  for(const entry of entries){
    view.setUint32(cursor, 0x04034b50, true); cursor += 4;
    view.setUint16(cursor, 20, true); cursor += 2;
    view.setUint16(cursor, 0, true); cursor += 2;
    view.setUint16(cursor, 0, true); cursor += 2;
    view.setUint16(cursor, now.time, true); cursor += 2;
    view.setUint16(cursor, now.day, true); cursor += 2;
    view.setUint32(cursor, entry.checksum, true); cursor += 4;
    view.setUint32(cursor, entry.data.length, true); cursor += 4;
    view.setUint32(cursor, entry.data.length, true); cursor += 4;
    view.setUint16(cursor, entry.nameBytes.length, true); cursor += 2;
    view.setUint16(cursor, 0, true); cursor += 2;
    zip.set(entry.nameBytes, cursor); cursor += entry.nameBytes.length;
    zip.set(entry.data, cursor); cursor += entry.data.length;
  }

  for(const entry of entries){
    view.setUint32(cursor, 0x02014b50, true); cursor += 4;
    view.setUint16(cursor, 20, true); cursor += 2;
    view.setUint16(cursor, 20, true); cursor += 2;
    view.setUint16(cursor, 0, true); cursor += 2;
    view.setUint16(cursor, 0, true); cursor += 2;
    view.setUint16(cursor, now.time, true); cursor += 2;
    view.setUint16(cursor, now.day, true); cursor += 2;
    view.setUint32(cursor, entry.checksum, true); cursor += 4;
    view.setUint32(cursor, entry.data.length, true); cursor += 4;
    view.setUint32(cursor, entry.data.length, true); cursor += 4;
    view.setUint16(cursor, entry.nameBytes.length, true); cursor += 2;
    view.setUint16(cursor, 0, true); cursor += 2;
    view.setUint16(cursor, 0, true); cursor += 2;
    view.setUint16(cursor, 0, true); cursor += 2;
    view.setUint16(cursor, 0, true); cursor += 2;
    view.setUint32(cursor, 0, true); cursor += 4;
    view.setUint32(cursor, entry.offset, true); cursor += 4;
    zip.set(entry.nameBytes, cursor); cursor += entry.nameBytes.length;
  }

  view.setUint32(cursor, 0x06054b50, true); cursor += 4;
  view.setUint16(cursor, 0, true); cursor += 2;
  view.setUint16(cursor, 0, true); cursor += 2;
  view.setUint16(cursor, entries.length, true); cursor += 2;
  view.setUint16(cursor, entries.length, true); cursor += 2;
  view.setUint32(cursor, centralSize, true); cursor += 4;
  view.setUint32(cursor, centralStart, true); cursor += 4;
  view.setUint16(cursor, 0, true);

  return new Blob([zip], {type: 'application/zip'});
}

function getExportSelections(){
  return {
    background: !!exportPngBackgroundEl?.checked,
    transparent: !!exportPngTransparentEl?.checked,
    activeLayer: !!exportActiveLayerEl?.checked,
    separateLayers: !!exportSeparateLayersEl?.checked,
    processVideo: !!exportProcessVideoOptionEl?.checked,
    layerVideos: !!exportLayerVideosOptionEl?.checked
  };
}

function waitForVideoMetadata(){
  if(video.readyState >= 1 && video.videoWidth && video.videoHeight){
    return Promise.resolve();
  }
  return new Promise((resolve, reject) => {
    const cleanup = () => {
      video.removeEventListener('loadedmetadata', onLoaded);
      video.removeEventListener('error', onError);
    };
    const onLoaded = () => {
      cleanup();
      resolve();
    };
    const onError = () => {
      cleanup();
      reject(new Error('Could not load the layer video source.'));
    };
    video.addEventListener('loadedmetadata', onLoaded, {once: true});
    video.addEventListener('error', onError, {once: true});
  });
}

async function useLayerVideoSource(layer){
  if(!layer?.source?.url){
    throw new Error(`${layer?.name || 'This layer'} cannot be replayed. Use imported video layers, not webcam layers.`);
  }
  video.pause();
  video.srcObject = null;
  video.src = layer.source.url;
  await waitForVideoMetadata();
  currentVideoSource = cloneVideoSource(layer.source);
  video.currentTime = 0;
  await waitForRenderableVideoFrame();
}

async function restoreVideoSourceForExport(source, time = 0){
  if(!source) return;
  video.pause();
  if(source.stream){
    video.removeAttribute('src');
    video.srcObject = source.stream;
    currentVideoSource = cloneVideoSource(source);
    await waitForVideoMetadata();
    return;
  }
  if(source.url){
    video.srcObject = null;
    video.src = source.url;
    currentVideoSource = cloneVideoSource(source);
    await waitForVideoMetadata();
    if(Number.isFinite(time) && video.duration && time < video.duration){
      video.currentTime = Math.max(0, time);
      await waitForRenderableVideoFrame();
    }
  }
}

async function buildLayerProcessVideoFiles(){
  if(!motionLayers.length) throw new Error('No layers to export.');
  const originalSource = cloneVideoSource(currentVideoSource);
  const originalTime = video.currentTime;
  const originalLayerId = activeLayerId;
  const originalSettings = readMotionSettings();
  const files = [];

  try{
    for(const [index, layer] of motionLayers.entries()){
      setActiveLayer(layer.id);
      await useLayerVideoSource(layer);
      files.push(...await exportLayerPngSequence(layer, {
        layerIndex: index,
        layerCount: motionLayers.length
      }));
    }
  } finally {
    await restoreVideoSourceForExport(originalSource, originalTime);
    setActiveLayer(originalLayerId);
    writeMotionSettings(originalSettings);
    rememberActiveLayerSettings();
    renderCompositeFrame();
  }

  return files;
}

async function exportLayerPngSequence(layer, {layerIndex = 0, layerCount = 1, fps = 30} = {}){
  if(!layer?.source?.url) throw new Error(`${layer?.name || 'This layer'} cannot be exported as a sequence. Use imported video layers.`);
  const previousShowVideoBackground = !!showVideoBackgroundEl?.checked;
  const frameFiles = [];
  const framePromises = [];
  const layerFolder = `${String(layerIndex + 1).padStart(2, '0')}-${safeFileName(layer.name)}`;
  let progressFrame = 0;

  try{
    if(showVideoBackgroundEl) showVideoBackgroundEl.checked = false;
    video.pause();
    await waitForVideoStart();
    resetProcessingState({clearPaint: true});
    clearAllLayers();
    dispCtx.clearRect(0, 0, canvasW, canvasH);

    let nextCaptureTime = 0;
    let frameNumber = 0;
    let captureError = null;
    const captureFrame = () => {
      if(captureError) return;
      const filename = `layer-sequences/${layerFolder}/frame-${String(frameNumber++).padStart(5, '0')}.png`;
      const promise = canvasToPngBlob(canvas)
        .then(blob => {
          frameFiles.push({filename, blob});
        })
        .catch(error => {
          captureError = error;
        });
      framePromises.push(promise);
    };

    const captureComplete = new Promise((resolve, reject) => {
      const tick = () => {
        if(captureError){
          reject(captureError);
          return;
        }
        while(video.currentTime + 0.0001 >= nextCaptureTime && nextCaptureTime <= video.duration){
          captureFrame();
          nextCaptureTime += 1 / fps;
        }
        const progress = video.duration ? Math.min(100, Math.round((video.currentTime / video.duration) * 100)) : 0;
        if(progress !== progressFrame){
          progressFrame = progress;
          exportBtn.textContent = `Layer ${layerIndex + 1} ${progress}%`;
          if(exportStatus) exportStatus.textContent = `Exporting PNG sequence ${layerIndex + 1} of ${layerCount} ${progress}%...`;
        }
        if(video.ended){
          captureFrame();
          resolve();
          return;
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });

    exportBtn.textContent = `Layer ${layerIndex + 1} 0%`;
    if(exportStatus) exportStatus.textContent = `Exporting PNG sequence ${layerIndex + 1} of ${layerCount} 0%...`;
    await video.play();
    playBtn.setAttribute('aria-pressed', 'true');
    if(!rafId) processLoop();
    await captureComplete;
    await Promise.all(framePromises);
    if(!frameFiles.length) throw new Error(`No frames were exported for ${layer.name}.`);
  } finally {
    video.pause();
    playBtn.setAttribute('aria-pressed', 'false');
    if(showVideoBackgroundEl) showVideoBackgroundEl.checked = previousShowVideoBackground;
  }

  return frameFiles.sort((a, b) => a.filename.localeCompare(b.filename));
}

async function buildSelectedExportFiles(){
  rememberActiveLayerSettings();
  const selected = getExportSelections();
  const files = [];
  if(selected.background){
    files.push({
      filename: 'background.png',
      blob: await canvasToPngBlob(makeExportCanvas({transparent: false}))
    });
  }
  if(selected.transparent){
    files.push({
      filename: 'transparent.png',
      blob: await canvasToPngBlob(makeExportCanvas({transparent: true}))
    });
  }
  if(selected.activeLayer){
    files.push({
      filename: 'active-layer.png',
      blob: await canvasToPngBlob(makeExportCanvas({transparent: true, activeOnly: true}))
    });
  }
  if(selected.separateLayers){
    if(!motionLayers.length) throw new Error('No layers to export.');
    for(const [index, layer] of motionLayers.entries()){
      files.push({
        filename: `layers/${String(index + 1).padStart(2, '0')}-${safeFileName(layer.name)}.png`,
        blob: await canvasToPngBlob(layer.canvas)
      });
    }
  }
  if(selected.processVideo){
    const blob = await exportProcessVideo({returnBlob: true});
    if(blob){
      files.push({
        filename: 'process.mp4',
        blob
      });
    }
  }
  if(selected.layerVideos){
    files.push(...await buildLayerProcessVideoFiles());
  }
  if(!files.length){
    throw new Error('Choose at least one export option.');
  }
  return files;
}

async function saveExportFiles(files){
  const project = getProjectSlug();
  const zip = await createZipBlob(files, project);
  downloadBlob(zip, `${project}.zip`);
  return 'zip';
}

async function exportSelectedOutputs(){
  if(isVideoExporting) return;
  try{
    exportBtn.disabled = true;
    exportBtn.textContent = 'Exporting';
    if(exportStatus) exportStatus.textContent = 'Preparing exports...';
    const files = await buildSelectedExportFiles();
    await saveExportFiles(files);
    if(exportStatus){
      exportStatus.textContent = `Downloaded ${getProjectSlug()}.zip with ${files.length} file${files.length === 1 ? '' : 's'}.`;
    }
  } catch(error){
    if(error?.name !== 'AbortError'){
      console.error(error);
      alert(error.message || 'Unable to export selected files.');
      if(exportStatus) exportStatus.textContent = 'Export failed.';
    }
  } finally {
    exportBtn.disabled = false;
    exportBtn.textContent = 'Export';
  }
}

async function exportProcessVideo({returnBlob = false, statusLabel = 'process video'} = {}){
  if(isVideoExporting) return;
  if(!baseVideoLoaded || !hasVideoSource()){
    if(returnBlob) throw new Error('Load a video first.');
    alert('Load a video first.');
    return;
  }
  if(!Number.isFinite(video.duration) || video.duration <= 0){
    if(returnBlob) throw new Error('The loaded video does not have a valid duration.');
    alert('The loaded video does not have a valid duration.');
    return;
  }
  if(typeof canvas.captureStream !== 'function' || typeof MediaRecorder === 'undefined'){
    if(returnBlob) throw new Error('Video export is not supported by this browser.');
    alert('Video export is not supported by this browser. Try a current version of Chrome, Edge, Firefox, or Safari.');
    return;
  }

  const mimeType = getMp4RecordingType();
  if(!mimeType){
    const message = 'This browser cannot record MP4 video.';
    if(returnBlob) throw new Error(message);
    alert(`${message} Use a current version of Chrome, Edge, or Safari.`);
    return;
  }

  const controls = Array.from(controlsPanel.querySelectorAll('button, input, select'));
  const previousDisabled = controls.map(control => control.disabled);
  let recorder = null;
  let progressHandler = null;
  const layerSnapshots = motionLayers.map(layer => ({
    layer,
    imageData: layer.ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height)
  }));
  isVideoExporting = true;
  controls.forEach(control => { control.disabled = true; });
  exportBtn.textContent = 'Preparing Video';
  if(exportStatus) exportStatus.textContent = `Preparing ${statusLabel}...`;

  try{
    video.pause();
    await waitForVideoStart();
    resetProcessingState({clearPaint: true});
    clearAllLayers();
    dispCtx.clearRect(0, 0, canvasW, canvasH);
    drawCurrentVideoFrame(dispCtx, canvasW, canvasH);

    const stream = canvas.captureStream(30);
    const chunks = [];
    let recorderError = null;
    recorder = new MediaRecorder(stream, {
      mimeType,
      videoBitsPerSecond: 8_000_000
    });
    const recordingComplete = new Promise(resolve => {
      recorder.addEventListener('dataavailable', event => {
        if(event.data?.size) chunks.push(event.data);
      });
      recorder.addEventListener('stop', resolve, {once: true});
      recorder.addEventListener('error', event => {
        recorderError = event.error || new Error('Video recording failed.');
      }, {once: true});
    });
    const playbackComplete = new Promise((resolve, reject) => {
      const onEnded = () => {
        cleanup();
        resolve();
      };
      const onError = () => {
        cleanup();
        reject(new Error('Video playback failed during export.'));
      };
      const cleanup = () => {
        video.removeEventListener('ended', onEnded);
        video.removeEventListener('error', onError);
      };
      video.addEventListener('ended', onEnded, {once: true});
      video.addEventListener('error', onError, {once: true});
    });

    progressHandler = () => {
      const progress = Math.min(100, Math.round((video.currentTime / video.duration) * 100));
      exportBtn.textContent = `Video ${progress}%`;
      if(exportStatus) exportStatus.textContent = `Exporting ${statusLabel} ${progress}%...`;
    };
    video.addEventListener('timeupdate', progressHandler);
    exportBtn.textContent = 'Video 0%';
    if(exportStatus) exportStatus.textContent = `Exporting ${statusLabel} 0%...`;
    recorder.start(1000);
    await video.play();
    playBtn.setAttribute('aria-pressed', 'true');
    if(!rafId) processLoop();
    await playbackComplete;
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    recorder.stop();
    await recordingComplete;
    if(recorderError) throw recorderError;

    const blob = new Blob(chunks, {type: mimeType});
    if(!blob.size) throw new Error('The exported video was empty.');
    if(returnBlob) return blob;
    downloadBlob(blob, `${getProjectSlug()}-process.mp4`);
  } catch(error){
    console.error(error);
    if(recorder?.state === 'recording') recorder.stop();
    if(returnBlob) throw error;
    alert(error.message || 'Unable to export the process video.');
  } finally {
    video.pause();
    playBtn.setAttribute('aria-pressed', 'false');
    if(progressHandler) video.removeEventListener('timeupdate', progressHandler);
    layerSnapshots.forEach(({layer, imageData}) => {
      layer.ctx.putImageData(imageData, 0, 0);
    });
    renderCompositeFrame();
    controls.forEach((control, index) => { control.disabled = previousDisabled[index]; });
    exportBtn.textContent = 'Export';
    isVideoExporting = false;
  }
}

// controls
playBtn.addEventListener('click', ()=>{
  if(!hasVideoSource()) return alert('Load a video or start the webcam first');
  video.play();
  playBtn.setAttribute('aria-pressed', 'true');
  if(!rafId) processLoop();
});
pauseBtn.addEventListener('click', ()=>{
  video.pause();
  playBtn.setAttribute('aria-pressed', 'false');
});
clearBtn.addEventListener('click', clearAllLayers);
exportBtn.addEventListener('click', exportSelectedOutputs);

// keep canvas sized nicely on window resize
window.addEventListener('resize', ()=> {
  updatePaintSize();
});

// initial state: no video loaded
console.log('MotionStills (CPU) ready. Load a video to begin.');
