<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive · Accidental Graphics</title>
  <meta name="description" content="Older Accidental Graphics tools. They still work.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@100..900,0..100&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="images/face cursor.png">
  <script defer src="scripts/navConfig.js"></script>
  <script defer src="scripts/navMenu.js"></script>
</head>
<body>
  <main class="archive-wrapper">
    <header class="archive-hero">
      <h1>The Archive</h1>
      <p class="lede" id="archiveIntro"></p>
    </header>

    <ul class="archive-list" id="archiveList"></ul>
  </main>
  <div class="app-year">2026 Accidental Graphics</div>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
    const list = document.getElementById('archiveList');
    const intro = document.getElementById('archiveIntro');
    if (!list || !window.AGContent) return;

    AGContent.load('tools').then(data => {
      intro.textContent = data.archive_intro || '';
      intro.hidden = !data.archive_intro;
      return AGContent.tools();
    }).then(tools => {
      list.innerHTML = '';
      tools.filter(tool => tool.archived).forEach(tool => {
        const item = document.createElement('li');
        const article = document.createElement('article');
        article.className = 'archive-details';

        if (tool.cover && tool.isVideo) {
          const video = document.createElement('video');
          video.className = 'archive-preview';
          ['muted', 'loop', 'autoplay', 'playsinline'].forEach(attr => video.setAttribute(attr, ''));
          video.muted = true;
          video.preload = 'metadata';
          video.setAttribute('aria-hidden', 'true');
          video.src = `${tool.cover}#t=0.001`;
          article.appendChild(video);
        } else if (tool.cover) {
          const img = document.createElement('img');
          img.className = 'archive-preview';
          img.src = tool.cover;
          img.alt = '';
          img.loading = 'lazy';
          article.appendChild(img);
        }

        const body = document.createElement('div');
        const heading = document.createElement('div');
        heading.className = 'archive-heading';
        const name = document.createElement('strong');
        name.textContent = tool.name;
        heading.appendChild(name);
        if (tool.year) {
          const year = document.createElement('span');
          year.className = 'archive-year';
          year.textContent = `Since ${tool.year}`;
          heading.appendChild(year);
        }
        body.appendChild(heading);

        if (tool.description) {
          const description = document.createElement('p');
          description.textContent = tool.description;
          body.appendChild(description);
        }

        const link = document.createElement('a');
        link.href = tool.url;
        link.textContent = `Open ${tool.name} →`;
        body.appendChild(link);

        article.appendChild(body);
        item.appendChild(article);
        list.appendChild(item);
      });
    }).catch(() => {
      list.innerHTML = '<li><p>The archive could not be loaded. Try again in a moment.</p></li>';
    });
  });
  </script>
</body>
</html>
