<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotionStills · Accidental Graphics</title>
  <meta name="description" content="Paint motion trails from video and export the combined artwork.">
  <link rel="stylesheet" href="../css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@100..900,0..100&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/face cursor.png">
  <link rel="stylesheet" href="../css/nav.css">
  <script defer src="../scripts/navConfig.js"></script>
  <script defer src="../scripts/navMenu.js"></script>
</head>

<body class="app-page motion-page">

  <div id="main">
    <!-- Left: Controls -->
    <div id="controls" class="motion-controls">
      <div class="motion-panel-header">
        <div>
          <p class="motion-eyebrow">MotionStills</p>
          <h1>Settings</h1>
        </div>
        <label class="motion-file-button motion-file-button--primary">
          <span>Import / Add Layer</span>
          <input id="file" type="file" accept="video/*" multiple>
        </label>
        <button id="webcamBtn" type="button" class="motion-file-button motion-file-button--webcam">Use Webcam</button>

        <div class="motion-primary-actions" aria-label="Main actions">
          <button id="play" type="button">Play</button>
          <button id="pause" type="button">Pause</button>
          <button id="clear" type="button">Clear Canvas</button>
          <button id="export" type="button">Export</button>
        </div>
      </div>

      <details class="motion-group">
        <summary>Project</summary>
        <div class="motion-group-body">
          <div class="motion-project-field">
            <label for="projectName">Project Name</label>
            <input id="projectName" type="text" value="MotionStills" autocomplete="off" spellcheck="false">
          </div>
          <div class="motion-canvas-size">
            <label for="canvasSizePreset">Canvas Size</label>
            <select id="canvasSizePreset">
              <option value="screen">Fit screen</option>
              <option value="source">Source video</option>
              <option value="1920x1080">1920 x 1080</option>
              <option value="1280x720">1280 x 720</option>
              <option value="1080x1080">1080 x 1080</option>
              <option value="1080x1920">1080 x 1920</option>
              <option value="custom">Custom</option>
            </select>
            <input id="canvasWidthInput" type="number" min="320" max="4096" step="1" value="1280" inputmode="numeric" aria-label="Canvas width">
            <input id="canvasHeightInput" type="number" min="240" max="4096" step="1" value="720" inputmode="numeric" aria-label="Canvas height">
          </div>
          <button id="resetProjectBtn" type="button">Reset / New Canvas</button>
        </div>
      </details>

      <details class="motion-group">
        <summary>Layers</summary>
        <div class="motion-group-body">
          <div class="motion-layer-list" id="layerList"></div>
          <p class="motion-meter" id="layerStatus">No video loaded</p>
        </div>
      </details>

      <details class="motion-group">
        <summary>Samples</summary>
        <div class="motion-group-body">
          <div class="button-row">
            <button type="button" id="motionSampleBaseBtn">Load Sample</button>
            <button type="button" id="motionSampleLayerBtn">Layer Sample</button>
          </div>
        </div>
      </details>

      <details class="motion-group">
        <summary>Settings</summary>
        <div class="motion-group-body">
          <div class="motion-control">
            <label for="threshold">Motion Intensity</label>
            <input id="threshold" type="range" min="1" max="100" value="50" class="slider">
            <input id="thVal" class="motion-value-input" type="number" min="1" max="100" step="1" value="50" aria-label="Motion intensity value">
          </div>
          <div class="motion-control">
            <label for="brush">Brush</label>
            <input id="brush" type="range" min="1" max="420" value="50" class="slider">
            <input id="brushVal" class="motion-value-input" type="number" min="1" max="420" step="1" value="50" aria-label="Brush value">
          </div>
          <div class="motion-control">
            <label for="smear">Smear</label>
            <input id="smear" type="range" min="0" max="900" value="60" class="slider">
            <input id="smearVal" class="motion-value-input" type="number" min="0" max="900" step="1" value="60" aria-label="Smear value">
          </div>
          <div class="motion-control">
            <label for="fade">Fade</label>
            <input id="fade" type="range" min="0.70" max="1" step="0.0005" value="1" class="slider">
            <input id="fadeVal" class="motion-value-input" type="number" min="0.70" max="1" step="0.0005" value="1" aria-label="Fade value">
          </div>
          <div class="motion-control">
            <label for="maxBlobs">Objects</label>
            <input id="maxBlobs" type="range" min="1" max="80" value="15" class="slider">
            <input id="countVal" class="motion-value-input" type="number" min="1" max="80" step="1" value="15" aria-label="Objects value">
          </div>
        </div>
      </details>

      <details class="motion-group">
        <summary>Advanced</summary>
        <div class="motion-group-body">
          <label class="motion-check">
            <input id="showVideoBackground" type="checkbox" checked>
            <span>Show video background</span>
          </label>
          <label class="motion-check">
            <input id="strokeEnabled" type="checkbox">
            <span>Stroke tracked objects</span>
          </label>
          <label class="motion-check">
            <input id="trackDotEnabled" type="checkbox">
            <span>Show tracked center dot</span>
          </label>
          <div class="motion-select-row">
            <label for="trackedShape">Tracked Shape</label>
            <select id="trackedShape">
              <option value="square">Square</option>
              <option value="circle">Circle</option>
              <option value="diamond">Diamond</option>
              <option value="cross">Cross</option>
              <option value="star">Star</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="motion-custom-shape">
            <div class="motion-custom-shape__top">
              <span>Draw Shape</span>
              <button id="clearCustomShape" type="button">Clear</button>
            </div>
            <canvas id="customShapeCanvas" width="120" height="120" aria-label="Draw custom tracked shape"></canvas>
          </div>
          <label class="motion-check">
            <input id="trackedSizeReactive" type="checkbox">
            <span>Size reacts to motion</span>
          </label>
          <div class="motion-color-row">
            <label for="strokeColor">Stroke Color</label>
            <input id="strokeColor" type="color" value="#ffffff">
          </div>
          <div class="motion-control">
            <label for="strokeWidth">Stroke</label>
            <input id="strokeWidth" type="range" min="0.5" max="80" step="0.5" value="6" class="slider">
            <input id="strokeWidthVal" class="motion-value-input" type="number" min="0.5" max="80" step="0.5" value="6" aria-label="Stroke value">
          </div>
          <div class="motion-select-row">
            <label for="trackDotShape">Dot Shape</label>
            <select id="trackDotShape">
              <option value="circle">Circle</option>
              <option value="square">Square</option>
              <option value="ring">Ring</option>
              <option value="cross">Cross</option>
            </select>
          </div>
          <div class="motion-color-row">
            <label for="trackDotColor">Dot Color</label>
            <input id="trackDotColor" type="color" value="#ffffff">
          </div>
          <div class="motion-control">
            <label for="trackDotSize">Dot Size</label>
            <input id="trackDotSize" type="range" min="1" max="80" step="1" value="10" class="slider">
            <input id="trackDotSizeVal" class="motion-value-input" type="number" min="1" max="80" step="1" value="10" aria-label="Dot size value">
          </div>
          <div class="motion-control">
            <label for="trackDotOpacity">Dot Opacity</label>
            <input id="trackDotOpacity" type="range" min="0.1" max="1" step="0.05" value="1" class="slider">
            <input id="trackDotOpacityVal" class="motion-value-input" type="number" min="0.1" max="1" step="0.05" value="1" aria-label="Dot opacity value">
          </div>
          <div class="motion-control">
            <label for="stampLimit">Stamps</label>
            <input id="stampLimit" type="range" min="1" max="90" value="30" class="slider">
            <input id="stampLimitVal" class="motion-value-input" type="number" min="1" max="90" step="1" value="30" aria-label="Stamps value">
          </div>
          <div class="motion-control">
            <label for="motionNoise">Texture</label>
            <input id="motionNoise" type="range" min="0" max="1" step="0.01" value="0.1" class="slider">
            <input id="motionNoiseVal" class="motion-value-input" type="number" min="0" max="1" step="0.01" value="0.1" aria-label="Texture value">
          </div>
        </div>
      </details>

      <details class="motion-group">
        <summary>Export</summary>
        <div class="motion-group-body">
          <label class="motion-check">
            <input id="exportPngBackground" type="checkbox" checked>
            <span>PNG with background</span>
          </label>
          <label class="motion-check">
            <input id="exportPngTransparent" type="checkbox">
            <span>PNG transparent</span>
          </label>
          <label class="motion-check">
            <input id="exportActiveLayer" type="checkbox">
            <span>Active layer PNG</span>
          </label>
          <label class="motion-check">
            <input id="exportSeparateLayers" type="checkbox">
            <span>All layers separate</span>
          </label>
          <label class="motion-check">
            <input id="exportProcessVideoOption" type="checkbox">
            <span>Process video MP4</span>
          </label>
          <label class="motion-check">
            <input id="exportLayerVideosOption" type="checkbox">
            <span>All layers PNG sequence</span>
          </label>
          <p class="motion-meter" id="exportStatus">Choose exports, then tap Export.</p>
        </div>
      </details>
    </div>

    <!-- Right: Canvas -->
    <div class="canvas-stage">
      <div class="canvas-prompt" id="playPrompt">Import file or use webcam</div>
      <canvas id="canvas"></canvas>
    </div>
</div>

<div class="sample-modal" id="videoSampleModal" aria-hidden="true">
  <div class="sample-dialog" role="dialog" aria-modal="true" aria-labelledby="videoSampleModalTitle">
    <div class="sample-dialog__head">
      <h2 id="videoSampleModalTitle" style="margin:0;">Choose a sample clip</h2>
      <button type="button" id="closeVideoSampleModalBtn">Close</button>
    </div>
    <div class="sample-grid" id="videoSampleGrid"></div>
    <div class="sample-dialog__actions">
      <button type="button" id="cancelVideoSampleBtn">Cancel</button>
      <button type="button" id="confirmVideoSampleBtn">Load selected</button>
    </div>
  </div>
</div>


<script src="../scripts/sampleMedia.js"></script>
<script>
/* MotionStills - CPU (2D canvas)
   - paints only where motion occurs
   - moving blobs produce brush strokes (smear/paste)
   - static background preserved
*/

// DOM
const fileInput = document.getElementById('file');
const webcamBtn = document.getElementById('webcamBtn');
const canvas = document.getElementById('canvas');
const playPrompt = document.getElementById('playPrompt');
const playBtn = document.getElementById('play');
const pauseBtn = document.getElementById('pause');
const clearBtn = document.getElementById('clear');
const exportBtn = document.getElementById('export');
const sampleBaseBtn = document.getElementById('motionSampleBaseBtn');
const sampleLayerBtn = document.getElementById('motionSampleLayerBtn');
const videoSampleModal = document.getElementById('videoSampleModal');
const videoSampleGrid = document.getElementById('videoSampleGrid');
const confirmVideoSampleBtn = document.getElementById('confirmVideoSampleBtn');
const cancelVideoSampleBtn = document.getElementById('cancelVideoSampleBtn');
const closeVideoSampleModalBtn = document.getElementById('closeVideoSampleModalBtn');
const projectNameInput = document.getElementById('projectName');
const canvasSizePresetEl = document.getElementById('canvasSizePreset');
const canvasWidthInput = document.getElementById('canvasWidthInput');
const canvasHeightInput = document.getElementById('canvasHeightInput');
const resetProjectBtn = document.getElementById('resetProjectBtn');
const exportPngBackgroundEl = document.getElementById('exportPngBackground');
const exportPngTransparentEl = document.getElementById('exportPngTransparent');
const exportActiveLayerEl = document.getElementById('exportActiveLayer');
const exportSeparateLayersEl = document.getElementById('exportSeparateLayers');
const exportProcessVideoOptionEl = document.getElementById('exportProcessVideoOption');
const exportLayerVideosOptionEl = document.getElementById('exportLayerVideosOption');
const exportStatus = document.getElementById('exportStatus');
const controlsPanel = document.getElementById('controls');
const layerList = document.getElementById('layerList');
const layerStatus = document.getElementById('layerStatus');
const showVideoBackgroundEl = document.getElementById('showVideoBackground');
const strokeEnabledEl = document.getElementById('strokeEnabled');
const trackDotEnabledEl = document.getElementById('trackDotEnabled');
const trackedShapeEl = document.getElementById('trackedShape');
const customShapeCanvas = document.getElementById('customShapeCanvas');
const clearCustomShapeBtn = document.getElementById('clearCustomShape');
const trackedSizeReactiveEl = document.getElementById('trackedSizeReactive');
const strokeColorEl = document.getElementById('strokeColor');
const strokeWidthEl = document.getElementById('strokeWidth');
const strokeWidthVal = document.getElementById('strokeWidthVal');
const trackDotShapeEl = document.getElementById('trackDotShape');
const trackDotColorEl = document.getElementById('trackDotColor');
const trackDotSizeEl = document.getElementById('trackDotSize');
const trackDotSizeVal = document.getElementById('trackDotSizeVal');
const trackDotOpacityEl = document.getElementById('trackDotOpacity');
const trackDotOpacityVal = document.getElementById('trackDotOpacityVal');
const stampLimitEl = document.getElementById('stampLimit');
const stampLimitVal = document.getElementById('stampLimitVal');
const motionNoiseEl = document.getElementById('motionNoise');
const motionNoiseVal = document.getElementById('motionNoiseVal');
const stackedQuery = window.matchMedia ? window.matchMedia('(max-width: 900px)') : {matches: false};

const thresholdEl = document.getElementById('threshold');
const thresholdVal = document.getElementById('thVal');
const brushEl = document.getElementById('brush');
const brushVal = document.getElementById('brushVal');
const smearEl = document.getElementById('smear');
const smearVal = document.getElementById('smearVal');
const fadeEl = document.getElementById('fade');
const fadeVal = document.getElementById('fadeVal');
const maxBlobsEl = document.getElementById('maxBlobs');
const countVal = document.getElementById('countVal');

// state
const video = document.createElement('video');
video.crossOrigin = 'anonymous';
video.muted = true;
video.playsInline = true;
video.addEventListener('play', hidePlayPrompt);

let procW = 640, procH = 360;
let canvasW = 1280, canvasH = 720;
let displayW = 0, displayH = 0;
let displayAspect = 16 / 9;
let prevFrame = null;
let rafId = null;
let prevBlobs = [];
let currentVideoSource = null;
let baseVideoLoaded = false;
let isVideoExporting = false;
let layerIdSeed = 0;
let activeLayerId = null;
let motionLayers = [];
let applyingLayerSettings = false;

// processing canvases (lower res for speed)
const procCanvas = document.createElement('canvas');
const procCtx = procCanvas.getContext('2d');

const prevCanvas = document.createElement('canvas');
const prevCtx = prevCanvas.getContext('2d');

// painting canvas (accumulates)
let paintCanvas = document.createElement('canvas');
let paintCtx = paintCanvas.getContext('2d');

// source buffer for sampling current frame at display resolution
const sourceCanvas = document.createElement('canvas');
const sourceCtx = sourceCanvas.getContext('2d');

// canvas canvas context
const dispCtx = canvas.getContext('2d');

let blobIdSeed = 0;

let sampleVideoData = window.SampleMedia?.getList?.('videos') || [];
if (!sampleVideoData.length) {
  sampleVideoData = [
    { src: "../images/samplevideo's/samplevideo1.mp4", label: 'Sample Video 01' },
    { src: "../images/samplevideo's/samplevideo2.mp4", label: 'Sample Video 02' },
    { src: "../images/samplevideo's/samplevideo3.mp4", label: 'Sample Video 03' }
  ];
}
let selectedVideoSrc = null;
let sampleAction = 'base';
let sampleModalReturnFocus = null;
let customShapePoints = [
  {x: 0.5, y: 0.08},
  {x: 0.72, y: 0.34},
  {x: 0.92, y: 0.5},
  {x: 0.68, y: 0.64},
  {x: 0.5, y: 0.92},
  {x: 0.32, y: 0.64},
  {x: 0.08, y: 0.5},
  {x: 0.28, y: 0.34}
];
let customShapeDrawing = false;
const customShapeCtx = customShapeCanvas?.getContext('2d');

function hasVideoSource(){
  return !!(video.src || video.srcObject);
}

function isWebcamSource(){
  return !!currentVideoSource?.stream;
}

function drawCurrentVideoFrame(ctx, width, height){
  if(isWebcamSource()){
    ctx.save();
    ctx.translate(width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, width, height);
    ctx.restore();
    return;
  }
  ctx.drawImage(video, 0, 0, width, height);
}

function getCustomShapePoint(event){
  const rect = customShapeCanvas.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
    y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
  };
}

function renderCustomShapeCanvas(){
  if(!customShapeCtx || !customShapeCanvas) return;
  const w = customShapeCanvas.width;
  const h = customShapeCanvas.height;
  customShapeCtx.clearRect(0, 0, w, h);
  customShapeCtx.fillStyle = '#000';
  customShapeCtx.fillRect(0, 0, w, h);
  customShapeCtx.strokeStyle = 'rgba(255,255,255,0.24)';
  customShapeCtx.lineWidth = 1;
  customShapeCtx.strokeRect(0.5, 0.5, w - 1, h - 1);
  if(customShapePoints.length < 2) return;
  customShapeCtx.strokeStyle = '#fff';
  customShapeCtx.lineWidth = 4;
  customShapeCtx.lineCap = 'round';
  customShapeCtx.lineJoin = 'round';
  customShapeCtx.beginPath();
  customShapeCtx.moveTo(customShapePoints[0].x * w, customShapePoints[0].y * h);
  customShapePoints.slice(1).forEach(point => {
    customShapeCtx.lineTo(point.x * w, point.y * h);
  });
  if(customShapePoints.length > 2) customShapeCtx.closePath();
  customShapeCtx.stroke();
}

function startCustomShape(event){
  if(!customShapeCanvas) return;
  customShapeDrawing = true;
  customShapeCanvas.setPointerCapture?.(event.pointerId);
  customShapePoints = [getCustomShapePoint(event)];
  renderCustomShapeCanvas();
}

function moveCustomShape(event){
  if(!customShapeDrawing || !customShapeCanvas) return;
  customShapePoints.push(getCustomShapePoint(event));
  renderCustomShapeCanvas();
}

function endCustomShape(event){
  customShapeDrawing = false;
  customShapeCanvas?.releasePointerCapture?.(event.pointerId);
}

function nextLayerName(){
  return motionLayers.length ? `Video Layer ${motionLayers.length + 1}` : 'Base Video';
}

function readMotionSettings(){
  return {
    threshold: thresholdEl.value,
    brush: brushEl.value,
    smear: smearEl.value,
    fade: fadeEl.value,
    maxBlobs: maxBlobsEl.value,
    showVideoBackground: !!showVideoBackgroundEl?.checked,
    strokeEnabled: !!strokeEnabledEl?.checked,
    trackDotEnabled: !!trackDotEnabledEl?.checked,
    trackedShape: trackedShapeEl?.value || 'square',
    customShapePoints: customShapePoints.map(point => ({x: point.x, y: point.y})),
    trackedSizeReactive: !!trackedSizeReactiveEl?.checked,
    strokeColor: strokeColorEl?.value || '#ffffff',
    strokeWidth: strokeWidthEl?.value || '6',
    trackDotShape: trackDotShapeEl?.value || 'circle',
    trackDotColor: trackDotColorEl?.value || '#ffffff',
    trackDotSize: trackDotSizeEl?.value || '10',
    trackDotOpacity: trackDotOpacityEl?.value || '1',
    stampLimit: stampLimitEl?.value || '30',
    motionNoise: motionNoiseEl?.value || '0.1'
  };
}

function syncMotionSettingLabels(){
  thresholdVal.value = thresholdEl.value;
  brushVal.value = brushEl.value;
  smearVal.value = smearEl.value;
  fadeVal.value = fadeEl.value;
  countVal.value = maxBlobsEl.value;
  strokeWidthVal.value = strokeWidthEl.value;
  trackDotSizeVal.value = trackDotSizeEl.value;
  trackDotOpacityVal.value = trackDotOpacityEl.value;
  stampLimitVal.value = stampLimitEl.value;
  motionNoiseVal.value = motionNoiseEl.value;
}

function writeMotionSettings(settings){
  if(!settings) return;
  applyingLayerSettings = true;
  thresholdEl.value = settings.threshold ?? thresholdEl.value;
  brushEl.value = settings.brush ?? brushEl.value;
  smearEl.value = settings.smear ?? smearEl.value;
  fadeEl.value = settings.fade ?? fadeEl.value;
  maxBlobsEl.value = settings.maxBlobs ?? maxBlobsEl.value;
  if(showVideoBackgroundEl) showVideoBackgroundEl.checked = settings.showVideoBackground ?? showVideoBackgroundEl.checked;
  if(strokeEnabledEl) strokeEnabledEl.checked = settings.strokeEnabled ?? strokeEnabledEl.checked;
  if(trackDotEnabledEl) trackDotEnabledEl.checked = settings.trackDotEnabled ?? trackDotEnabledEl.checked;
  if(trackedShapeEl) trackedShapeEl.value = settings.trackedShape || trackedShapeEl.value;
  if(Array.isArray(settings.customShapePoints)){
    customShapePoints = settings.customShapePoints.map(point => ({x: point.x, y: point.y}));
  }
  if(trackedSizeReactiveEl) trackedSizeReactiveEl.checked = settings.trackedSizeReactive ?? trackedSizeReactiveEl.checked;
  if(strokeColorEl) strokeColorEl.value = settings.strokeColor || strokeColorEl.value;
  if(strokeWidthEl) strokeWidthEl.value = settings.strokeWidth ?? strokeWidthEl.value;
  if(trackDotShapeEl) trackDotShapeEl.value = settings.trackDotShape || trackDotShapeEl.value;
  if(trackDotColorEl) trackDotColorEl.value = settings.trackDotColor || trackDotColorEl.value;
  if(trackDotSizeEl) trackDotSizeEl.value = settings.trackDotSize ?? trackDotSizeEl.value;
  if(trackDotOpacityEl) trackDotOpacityEl.value = settings.trackDotOpacity ?? trackDotOpacityEl.value;
  if(stampLimitEl) stampLimitEl.value = settings.stampLimit ?? stampLimitEl.value;
  if(motionNoiseEl) motionNoiseEl.value = settings.motionNoise ?? motionNoiseEl.value;
  syncMotionSettingLabels();
  renderCustomShapeCanvas();
  applyingLayerSettings = false;
}

function rememberActiveLayerSettings(){
  if(applyingLayerSettings) return;
  const layer = getActiveLayer();
  if(layer) layer.settings = readMotionSettings();
}

function cloneVideoSource(source){
  if(!source) return null;
  if(source.stream){
    return {
      stream: source.stream,
      mirrored: !!source.mirrored,
      cleanup: source.cleanup
    };
  }
  return {
    url: source.url,
    cleanup: source.cleanup
  };
}

function cleanupLayerSource(layer){
  if(layer?.source && typeof layer.source.cleanup === 'function'){
    layer.source.cleanup();
  }
}

function cleanupAllLayerSources(){
  motionLayers.forEach(cleanupLayerSource);
}

function assignLayerSource(layer, source){
  if(!layer || !source) return;
  layer.source = cloneVideoSource(source);
}

function createMotionLayer(name = nextLayerName()){
  const canvasEl = document.createElement('canvas');
  canvasEl.width = canvasW || 1280;
  canvasEl.height = canvasH || 720;
  return {
    id: `motion-layer-${++layerIdSeed}`,
    name,
    visible: true,
    settings: readMotionSettings(),
    source: null,
    canvas: canvasEl,
    ctx: canvasEl.getContext('2d')
  };
}

function getActiveLayer(){
  return motionLayers.find(layer => layer.id === activeLayerId) || motionLayers[0] || null;
}

function setActiveLayer(id, {render = true} = {}){
  rememberActiveLayerSettings();
  const layer = motionLayers.find(item => item.id === id) || motionLayers[0] || null;
  activeLayerId = layer?.id || null;
  paintCanvas = layer?.canvas || paintCanvas;
  paintCtx = layer?.ctx || paintCtx;
  if(layer?.settings) writeMotionSettings(layer.settings);
  if(render) renderLayers();
}

function ensureActiveLayer(name){
  let layer = getActiveLayer();
  if(!layer){
    layer = createMotionLayer(name);
    motionLayers.push(layer);
    activeLayerId = layer.id;
  }
  setActiveLayer(layer.id);
  return layer;
}

function addVideoLayer(name){
  const layer = createMotionLayer(name);
  motionLayers.push(layer);
  setActiveLayer(layer.id);
  return layer;
}

function clearAllLayers(){
  motionLayers.forEach(layer => layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height));
  renderCompositeFrame();
}

function resetProjectToNewCanvas(){
  video.pause();
  cleanupAllLayerSources();
  motionLayers = [];
  activeLayerId = null;
  baseVideoLoaded = false;
  currentVideoSource = null;
  prevFrame = null;
  prevBlobs = [];
  playBtn.setAttribute('aria-pressed', 'false');
  video.removeAttribute('src');
  video.srcObject = null;
  video.load();
  paintCanvas = document.createElement('canvas');
  paintCtx = paintCanvas.getContext('2d');
  resetProcessingState({clearPaint: true});
  updatePaintSize();
  dispCtx.clearRect(0, 0, canvasW, canvasH);
  renderLayers();
  syncCanvasSizeControls();
  resetPlayPrompt();
}

function waitForVideoEnded(){
  return new Promise((resolve, reject) => {
    const onEnded = () => {
      cleanup();
      resolve();
    };
    const onError = () => {
      cleanup();
      reject(new Error('Video playback failed while rerunning the layer.'));
    };
    const cleanup = () => {
      video.removeEventListener('ended', onEnded);
      video.removeEventListener('error', onError);
    };
    video.addEventListener('ended', onEnded, {once: true});
    video.addEventListener('error', onError, {once: true});
  });
}

async function rerunLayer(layer){
  if(isVideoExporting) return;
  if(!layer || !motionLayers.includes(layer)) throw new Error('Layer no longer exists.');
  if(!layer.source?.url) throw new Error('Only imported video layers can be rerun.');

  rememberActiveLayerSettings();
  const controls = Array.from(controlsPanel.querySelectorAll('button, input, select'));
  const previousDisabled = controls.map(control => control.disabled);
  const originalSource = cloneVideoSource(currentVideoSource);
  const originalTime = video.currentTime;
  const originalLayerId = activeLayerId;
  const originalSettings = readMotionSettings();
  let progressHandler = null;
  isVideoExporting = true;
  controls.forEach(control => { control.disabled = true; });

  try{
    setActiveLayer(layer.id);
    await useLayerVideoSource(layer);
    resetProcessingState({clearPaint: true});
    layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
    renderCompositeFrame();

    progressHandler = () => {
      const progress = video.duration ? Math.min(100, Math.round((video.currentTime / video.duration) * 100)) : 0;
      if(layerStatus) layerStatus.textContent = `Rerunning ${layer.name} ${progress}%...`;
    };
    video.addEventListener('timeupdate', progressHandler);
    if(layerStatus) layerStatus.textContent = `Rerunning ${layer.name} 0%...`;
    await video.play();
    playBtn.setAttribute('aria-pressed', 'true');
    if(!rafId) processLoop();
    await waitForVideoEnded();
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    if(layerStatus) layerStatus.textContent = `Reran ${layer.name}.`;
  } finally {
    video.pause();
    playBtn.setAttribute('aria-pressed', 'false');
    if(progressHandler) video.removeEventListener('timeupdate', progressHandler);
    try{
      await restoreVideoSourceForExport(originalSource, originalTime);
    } catch(error){
      console.warn('Could not restore previous video source after rerun.', error);
    }
    setActiveLayer(originalLayerId);
    writeMotionSettings(originalSettings);
    rememberActiveLayerSettings();
    renderCompositeFrame();
    controls.forEach((control, index) => { control.disabled = previousDisabled[index]; });
    isVideoExporting = false;
    renderLayers();
  }
}

function resizeLayerCanvases(){
  motionLayers.forEach(layer => {
    if(layer.canvas.width === canvasW && layer.canvas.height === canvasH) return;
    layer.canvas.width = canvasW;
    layer.canvas.height = canvasH;
    layer.ctx = layer.canvas.getContext('2d');
  });
  const active = getActiveLayer();
  if(active){
    paintCanvas = active.canvas;
    paintCtx = active.ctx;
  }
}

function renderLayers(){
  if(!layerList) return;
  layerList.innerHTML = '';
  if(!motionLayers.length){
    const empty = document.createElement('p');
    empty.className = 'motion-muted';
    empty.textContent = 'Import a video to create the first layer.';
    layerList.appendChild(empty);
    if(layerStatus) layerStatus.textContent = 'No video loaded';
    return;
  }
  motionLayers.forEach((layer, index) => {
    const item = document.createElement('div');
    item.className = `motion-layer ${layer.id === activeLayerId ? 'is-active' : ''}`;
    const title = document.createElement('input');
    title.type = 'text';
    title.className = 'motion-layer__title';
    title.value = layer.name;
    title.setAttribute('aria-label', `Layer name: ${layer.name}`);
    title.addEventListener('focus', () => {
      setActiveLayer(layer.id, {render: false});
      layerList.querySelectorAll('.motion-layer').forEach(row => row.classList.remove('is-active'));
      item.classList.add('is-active');
      if(layerStatus) layerStatus.textContent = `Active: ${layer.name}`;
    });
    title.addEventListener('input', () => {
      layer.name = title.value;
      title.setAttribute('aria-label', `Layer name: ${layer.name || 'Untitled layer'}`);
      if(layerStatus && layer.id === activeLayerId) layerStatus.textContent = `Active: ${layer.name || 'Untitled layer'}`;
    });
    title.addEventListener('change', () => {
      const cleanName = title.value.trim() || 'Untitled Layer';
      layer.name = cleanName;
      title.value = cleanName;
      title.setAttribute('aria-label', `Layer name: ${cleanName}`);
      if(layerStatus && layer.id === activeLayerId) layerStatus.textContent = `Active: ${cleanName}`;
    });

    const actions = document.createElement('div');
    actions.className = 'motion-layer__actions';
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.textContent = layer.visible ? 'Hide' : 'Show';
    toggle.setAttribute('aria-pressed', String(!layer.visible));
    toggle.addEventListener('click', () => {
      layer.visible = !layer.visible;
      renderLayers();
      renderCompositeFrame();
    });
    const rerun = document.createElement('button');
    rerun.type = 'button';
    rerun.textContent = 'Rerun';
    rerun.disabled = !layer.source?.url || isVideoExporting;
    rerun.title = layer.source?.url ? 'Replay this layer from the beginning' : 'Only imported video layers can be rerun';
    rerun.addEventListener('click', () => {
      rerunLayer(layer).catch(error => {
        console.error(error);
        alert(error.message || 'Unable to rerun this layer.');
      });
    });
    const up = document.createElement('button');
    up.type = 'button';
    up.textContent = 'Up';
    up.disabled = index === 0;
    up.addEventListener('click', () => {
      const [moved] = motionLayers.splice(index, 1);
      motionLayers.splice(index - 1, 0, moved);
      renderLayers();
      renderCompositeFrame();
    });
    const down = document.createElement('button');
    down.type = 'button';
    down.textContent = 'Down';
    down.disabled = index === motionLayers.length - 1;
    down.addEventListener('click', () => {
      const [moved] = motionLayers.splice(index, 1);
      motionLayers.splice(index + 1, 0, moved);
      renderLayers();
      renderCompositeFrame();
    });
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = 'Delete';
    remove.addEventListener('click', () => {
      cleanupLayerSource(layer);
      motionLayers = motionLayers.filter(item => item.id !== layer.id);
      if(activeLayerId === layer.id) activeLayerId = motionLayers[0]?.id || null;
      setActiveLayer(activeLayerId);
      renderCompositeFrame();
    });
    actions.append(toggle, rerun, up, down, remove);
    item.append(title, actions);
    layerList.appendChild(item);
  });
  if(layerStatus){
    const activeIndex = motionLayers.findIndex(layer => layer.id === activeLayerId);
    layerStatus.textContent = activeIndex >= 0 ? `Active: ${motionLayers[activeIndex].name}` : 'No active layer';
  }
}

let playPromptDismissed = false;

function waitForRenderableVideoFrame(){
  if(video.readyState >= 2){
    return new Promise(resolve => requestAnimationFrame(resolve));
  }
  return new Promise((resolve, reject) => {
    const cleanup = () => {
      video.removeEventListener('loadeddata', onReady);
      video.removeEventListener('canplay', onReady);
      video.removeEventListener('seeked', onReady);
      video.removeEventListener('error', onError);
    };
    const onReady = () => {
      cleanup();
      requestAnimationFrame(resolve);
    };
    const onError = () => {
      cleanup();
      reject(new Error('Could not render the selected video frame.'));
    };
    video.addEventListener('loadeddata', onReady, {once: true});
    video.addEventListener('canplay', onReady, {once: true});
    video.addEventListener('seeked', onReady, {once: true});
    video.addEventListener('error', onError, {once: true});
  });
}

async function loadVideoSource(nextUrl, {preservePaint = false, cleanup, layerName} = {}){
  if(!nextUrl) return;
  const previousSource = currentVideoSource;
  const nextSource = { url: nextUrl, cleanup };
  const metadataPromise = new Promise((resolve, reject)=>{
    function cleanup(){
      video.removeEventListener('loadedmetadata', onLoaded);
      video.removeEventListener('error', onError);
    }
    function onLoaded(){
      cleanup();
      const vw = Math.round(video.videoWidth || 0);
      const vh = Math.round(video.videoHeight || 0);
      if(!vw || !vh){
        reject(new Error('Could not determine the video dimensions.'));
        return;
      }
      const hasDisplay = displayW && displayH;
      const shouldResize = !preservePaint || !hasDisplay;
      if(shouldResize){
        cleanupAllLayerSources();
        motionLayers = [];
        activeLayerId = null;
        updatePaintSize(vw, vh);
        lockProcessingResolutionToSource(vw, vh);
        assignLayerSource(ensureActiveLayer(layerName || 'Base Video'), nextSource);
        resetProcessingState({clearPaint: !preservePaint});
        baseVideoLoaded = true;
      } else {
        assignLayerSource(addVideoLayer(layerName || nextLayerName()), nextSource);
        resetProcessingState({clearPaint: false});
        if(!baseVideoLoaded){
          baseVideoLoaded = true;
        }
      }
      resolve();
    }
    function onError(){
      cleanup();
      reject(new Error('Failed to load the selected video.'));
    }
    video.addEventListener('loadedmetadata', onLoaded, {once:true});
    video.addEventListener('error', onError, {once:true});
    video.srcObject = null;
    video.src = nextUrl;
  });
  try{
    await metadataPromise;
    currentVideoSource = nextSource;
    if(previousSource?.stream && typeof previousSource.cleanup === 'function'){
      previousSource.cleanup();
    }
    video.pause();
    video.currentTime = 0;
    await waitForRenderableVideoFrame();
    renderLayers();
    renderCompositeFrame();
    syncCanvasSizeControls();
    resetPlayPrompt();
  } catch(err){
    if(typeof cleanup === 'function'){
      cleanup();
    }
    if(previousSource?.url){
      video.srcObject = null;
      video.src = previousSource.url;
      video.load();
    } else if(previousSource?.stream){
      video.removeAttribute('src');
      video.srcObject = previousSource.stream;
    } else {
      video.removeAttribute('src');
      video.srcObject = null;
      video.load();
    }
    throw err;
  }
}
async function prepareVideoFromFile(file, options = {}){
  if(!file) return;
  const objectUrl = URL.createObjectURL(file);
  await loadVideoSource(objectUrl, {
    ...options,
    layerName: options.layerName || file.name.replace(/\.[^.]+$/, ''),
    cleanup: () => URL.revokeObjectURL(objectUrl)
  });
}
async function prepareVideoFromURL(sourceUrl, options = {}){
  if(!sourceUrl) return;
  await loadVideoSource(sourceUrl, options);
}

async function prepareWebcamSource(){
  if(!navigator.mediaDevices?.getUserMedia){
    alert('Webcam is not supported in this browser.');
    return;
  }
  const preservePaint = baseVideoLoaded;
  const previousSource = currentVideoSource;
  let stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        width: {ideal: 1280},
        height: {ideal: 720}
      },
      audio: false
    });
    video.pause();
    video.removeAttribute('src');
    video.srcObject = stream;

    await new Promise((resolve, reject) => {
      const cleanupListeners = () => {
        video.removeEventListener('loadedmetadata', onLoaded);
        video.removeEventListener('error', onError);
      };
      const onLoaded = () => {
        cleanupListeners();
        resolve();
      };
      const onError = () => {
        cleanupListeners();
        reject(new Error('Could not load the webcam.'));
      };
      video.addEventListener('loadedmetadata', onLoaded, {once: true});
      video.addEventListener('error', onError, {once: true});
    });

    await video.play();
    await waitForRenderableVideoFrame();

    const vw = Math.round(video.videoWidth || 1280);
    const vh = Math.round(video.videoHeight || 720);
    const hasDisplay = displayW && displayH;
    const shouldResize = !preservePaint || !hasDisplay;
    const nextSource = {
      stream,
      mirrored: true,
      cleanup: () => stream.getTracks().forEach(track => track.stop())
    };
    if(shouldResize){
      cleanupAllLayerSources();
      motionLayers = [];
      activeLayerId = null;
      updatePaintSize(vw, vh);
      lockProcessingResolutionToSource(vw, vh);
      assignLayerSource(ensureActiveLayer('Webcam'), nextSource);
      resetProcessingState({clearPaint: !preservePaint});
      baseVideoLoaded = true;
    } else {
      assignLayerSource(addVideoLayer('Webcam Layer'), nextSource);
      resetProcessingState({clearPaint: false});
      baseVideoLoaded = true;
    }

    currentVideoSource = nextSource;
    if(previousSource?.stream && previousSource.stream !== stream && typeof previousSource.cleanup === 'function'){
      previousSource.cleanup();
    }
    video.pause();
    renderLayers();
    renderCompositeFrame();
    syncCanvasSizeControls();
    resetPlayPrompt();
  } catch(error){
    stream?.getTracks?.().forEach(track => track.stop());
    if(previousSource?.url){
      video.srcObject = null;
      video.src = previousSource.url;
      video.load();
    } else if(previousSource?.stream){
      video.removeAttribute('src');
      video.srcObject = previousSource.stream;
    } else {
      video.removeAttribute('src');
      video.srcObject = null;
      video.load();
    }
    alert(error.message || 'Unable to start webcam.');
  }
}

async function loadSampleVideoAsset(path, options = {}){
  if(!path) throw new Error('Missing sample path.');
  try{
    const response = await fetch(path);
    if(!response.ok) throw new Error('Failed to fetch sample asset.');
    const blob = await response.blob();
    const filename = path.split('/').pop() || 'sample.mp4';
    const file = new File([blob], filename, { type: blob.type || 'video/mp4' });
    await prepareVideoFromFile(file, options);
  } catch(err){
    console.warn('Sample fetch failed, falling back to direct URL.', err);
    await prepareVideoFromURL(path, options);
  }
}

// initialize sizes
function setProcessingResolution(width, height){
  const nextW = parseInt(width, 10);
  const nextH = parseInt(height, 10);
  if(!nextW || !nextH) return;
  procW = nextW;
  procH = nextH;
  procCanvas.width = procW;
  procCanvas.height = procH;
  prevCanvas.width = procW;
  prevCanvas.height = procH;
}
function lockProcessingResolutionToSource(width, height){
  if(!width || !height) return;
  setProcessingResolution(width, height);
}

function clampCanvasDimension(value, fallback, min, max){
  const parsed = parseInt(value, 10);
  if(!Number.isFinite(parsed)) return fallback;
  return Math.max(min, Math.min(max, parsed));
}

function getCanvasPresetSize(sourceW, sourceH){
  const preset = canvasSizePresetEl?.value || 'screen';
  if(preset === 'screen') return null;
  if(preset === 'source'){
    if(sourceW && sourceH) return {width: sourceW, height: sourceH};
    return null;
  }
  if(preset === 'custom'){
    return {
      width: clampCanvasDimension(canvasWidthInput?.value, canvasW || 1280, 320, 4096),
      height: clampCanvasDimension(canvasHeightInput?.value, canvasH || 720, 240, 4096)
    };
  }
  const match = preset.match(/^(\d+)x(\d+)$/);
  if(match){
    return {
      width: clampCanvasDimension(match[1], 1280, 320, 4096),
      height: clampCanvasDimension(match[2], 720, 240, 4096)
    };
  }
  return null;
}

function getCanvasViewportFit(aspect){
  const viewportHeight = Math.max(240, Math.floor(window.innerHeight || document.documentElement?.clientHeight || displayH || 720));
  const viewportWidth = Math.max(320, Math.floor(window.innerWidth || document.documentElement?.clientWidth || displayW || 1280));
  const lateralGap = stackedQuery.matches ? 0 : 32;
  const controlsWidth = !stackedQuery.matches && controlsPanel ? controlsPanel.getBoundingClientRect().width : 0;
  const availableWidth = Math.max(320, viewportWidth - controlsWidth - lateralGap);

  let cssHeight = viewportHeight;
  let cssWidth = Math.round(cssHeight * aspect);

  if(cssWidth > availableWidth){
    cssWidth = availableWidth;
    cssHeight = Math.round(cssWidth / aspect);
  }

  return {
    width: Math.max(320, cssWidth),
    height: Math.max(240, cssHeight)
  };
}

function syncCanvasSizeControls(){
  const preset = canvasSizePresetEl?.value || 'screen';
  const custom = preset === 'custom';
  const locked = !!baseVideoLoaded;
  if(canvasSizePresetEl) canvasSizePresetEl.disabled = locked;
  if(canvasWidthInput) canvasWidthInput.disabled = locked || !custom;
  if(canvasHeightInput) canvasHeightInput.disabled = locked || !custom;
}

function reflectCanvasPresetInputs(){
  const preset = canvasSizePresetEl?.value || 'screen';
  const match = preset.match(/^(\d+)x(\d+)$/);
  if(match){
    if(canvasWidthInput) canvasWidthInput.value = match[1];
    if(canvasHeightInput) canvasHeightInput.value = match[2];
  }
  syncCanvasSizeControls();
}

function getMotionThreshold(){
  const intensity = Math.max(1, Math.min(100, parseInt(thresholdEl.value, 10) || 50));
  // Higher UI intensity should catch subtler movement. 50% preserves the old ideal threshold of 100.
  return Math.round(200 - intensity * 2);
}

function resetProcessingState({clearPaint = false} = {}){
  prevFrame = null;
  prevCtx.clearRect(0, 0, prevCanvas.width, prevCanvas.height);
  prevBlobs = [];
  if(clearPaint){
    paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
  }
}
function updatePaintSize(newW, newH){
  const fixedSize = getCanvasPresetSize(newW, newH);
  let targetCanvasW = 0;
  let targetCanvasH = 0;
  let cssSize = null;

  if(fixedSize){
    targetCanvasW = fixedSize.width;
    targetCanvasH = fixedSize.height;
    if(canvasSizePresetEl?.value === 'source'){
      if(canvasWidthInput) canvasWidthInput.value = String(targetCanvasW);
      if(canvasHeightInput) canvasHeightInput.value = String(targetCanvasH);
    }
    displayAspect = targetCanvasW / targetCanvasH;
    cssSize = getCanvasViewportFit(displayAspect);
  } else {
    if(typeof newW === 'number' && typeof newH === 'number' && newW > 0 && newH > 0){
      displayAspect = newW / newH;
    }
    if(!isFinite(displayAspect) || displayAspect <= 0){
      displayAspect = 16 / 9;
    }
    cssSize = getCanvasViewportFit(displayAspect);
    targetCanvasW = cssSize.width;
    targetCanvasH = cssSize.height;
  }

  if(!isFinite(displayAspect) || displayAspect <= 0){
    displayAspect = 16 / 9;
  }

  displayW = targetCanvasW;
  displayH = targetCanvasH;

  const resized = canvas.width !== targetCanvasW || canvas.height !== targetCanvasH;
  canvas.width = targetCanvasW;
  canvas.height = targetCanvasH;
  canvas.style.width = `${cssSize.width}px`;
  canvas.style.height = `${cssSize.height}px`;
  canvasW = canvas.width;
  canvasH = canvas.height;
  if(resized){
    paintCanvas.width = canvasW; paintCanvas.height = canvasH;
    sourceCanvas.width = canvasW; sourceCanvas.height = canvasH;
    paintCtx.clearRect(0,0,paintCanvas.width,paintCanvas.height);
    resizeLayerCanvases();
  }
}
setProcessingResolution(procW, procH);
syncCanvasSizeControls();
updatePaintSize();

function clampRangeValue(rangeEl, value){
  const fallback = parseFloat(rangeEl.value) || 0;
  let next = parseFloat(value);
  if(!Number.isFinite(next)) next = fallback;
  const min = parseFloat(rangeEl.min);
  const max = parseFloat(rangeEl.max);
  if(Number.isFinite(min)) next = Math.max(min, next);
  if(Number.isFinite(max)) next = Math.min(max, next);
  return String(next);
}

function bindRangeValue(rangeEl, valueEl){
  if(!rangeEl || !valueEl) return;
  valueEl.value = rangeEl.value;
  rangeEl.addEventListener('input', () => {
    valueEl.value = rangeEl.value;
  });
  valueEl.addEventListener('input', () => {
    rangeEl.value = clampRangeValue(rangeEl, valueEl.value);
    rememberActiveLayerSettings();
  });
  valueEl.addEventListener('change', () => {
    rangeEl.value = clampRangeValue(rangeEl, valueEl.value);
    valueEl.value = rangeEl.value;
    rememberActiveLayerSettings();
  });
}

// Blob detection helper. Groups neighboring motion pixels into real regions so
// tracking stays tied to the place where movement happened in the frame.
function findBlobsFromBinary(imgData, w, h, maxBlobs){
  const total = w * h;
  const visited = new Uint8Array(total);
  const stack = new Int32Array(total);
  const blobs = [];
  const minArea = Math.max(8, Math.round(total * 0.00004));

  for(let start = 0; start < total; start++){
    if(visited[start] || imgData[start * 4] === 0) continue;

    let top = 0;
    let area = 0;
    let sumX = 0;
    let sumY = 0;
    let minX = w;
    let minY = h;
    let maxX = 0;
    let maxY = 0;

    visited[start] = 1;
    stack[top++] = start;

    while(top > 0){
      const idx = stack[--top];
      const x = idx % w;
      const y = (idx / w) | 0;

      area++;
      sumX += x;
      sumY += y;
      if(x < minX) minX = x;
      if(y < minY) minY = y;
      if(x > maxX) maxX = x;
      if(y > maxY) maxY = y;

      for(let oy = -1; oy <= 1; oy++){
        const ny = y + oy;
        if(ny < 0 || ny >= h) continue;
        for(let ox = -1; ox <= 1; ox++){
          if(ox === 0 && oy === 0) continue;
          const nx = x + ox;
          if(nx < 0 || nx >= w) continue;
          const next = ny * w + nx;
          if(visited[next] || imgData[next * 4] === 0) continue;
          visited[next] = 1;
          stack[top++] = next;
        }
      }
    }

    if(area < minArea) continue;
    const boxW = maxX - minX + 1;
    const boxH = maxY - minY + 1;
    const fill = area / Math.max(1, boxW * boxH);
    const sizeScore = area * (0.7 + fill * 0.3);

    blobs.push({
      x: sumX / area,
      y: sumY / area,
      area,
      width: boxW,
      height: boxH,
      radius: Math.max(boxW, boxH) * 0.5,
      strength: sizeScore
    });
  }

  blobs.sort((a,b) => b.strength - a.strength);
  return blobs.slice(0, maxBlobs);
}

function keepTrackPoint(point){
  return {
    x: point.x,
    y: point.y,
    id: point.id,
    radius: point.radius,
    radiusX: point.radiusX,
    radiusY: point.radiusY,
    strength: point.strength
  };
}

function getBlobMatchDistance(prev, curr){
  const prevRadius = prev?.radius || 0.025;
  const currRadius = curr?.radius || 0.025;
  return Math.max(0.035, Math.min(0.24, (prevRadius + currRadius) * 2.8));
}

function getBlobBox(point, brushPx){
  const fixedHalf = Math.max(2, brushPx);
  if(!trackedSizeReactiveEl?.checked){
    return {halfW: fixedHalf, halfH: fixedHalf};
  }
  const minHalf = Math.max(2, fixedHalf, brushPx);
  const halfW = Math.max(minHalf, (point?.radiusX || 0) * canvasW);
  const halfH = Math.max(minHalf, (point?.radiusY || 0) * canvasH);
  return {halfW, halfH};
}

function pointFromBlob(blob){
  return {
    x: blob.x / procW,
    y: blob.y / procH,
    strength: blob.strength,
    area: blob.area,
    radius: blob.radius / Math.max(procW, procH),
    radiusX: blob.width / procW * 0.5,
    radiusY: blob.height / procH * 0.5,
    id: null
  };
}

function limitMotionBlobs(blobs, maxBlobs){
  const selected = [];
  for(const blob of blobs){
    const point = pointFromBlob(blob);
    const overlaps = selected.some(existing => {
      const dx = existing.x - point.x;
      const dy = existing.y - point.y;
      return Math.hypot(dx, dy) < Math.max(existing.radius || 0, point.radius || 0) * 0.65;
    });
    if(overlaps) continue;
    selected.push(point);
    if(selected.length >= maxBlobs) break;
  }
  return selected;
}

function applyTrackSmoothing(prev, curr){
  if(!prev || !curr) return curr;
  const prevRadius = Number.isFinite(prev.radius) ? prev.radius : curr.radius || 0.025;
  const prevRadiusX = Number.isFinite(prev.radiusX) ? prev.radiusX : curr.radiusX || prevRadius;
  const prevRadiusY = Number.isFinite(prev.radiusY) ? prev.radiusY : curr.radiusY || prevRadius;
  const weight = Math.min(0.75, Math.max(0.2, (curr.strength || 0) / Math.max(1, (prev.strength || 0) + (curr.strength || 0))));
  curr.x = prev.x + (curr.x - prev.x) * weight;
  curr.y = prev.y + (curr.y - prev.y) * weight;
  curr.radius = prevRadius + ((curr.radius || prevRadius) - prevRadius) * weight;
  curr.radiusX = prevRadiusX + ((curr.radiusX || prevRadiusX) - prevRadiusX) * weight;
  curr.radiusY = prevRadiusY + ((curr.radiusY || prevRadiusY) - prevRadiusY) * weight;
  return curr;
}

function applyAllTrackSmoothing(matches){
  for(const match of matches){
    if(match.prev && match.curr){
      applyTrackSmoothing(match.prev, match.curr);
    }
  }
}
