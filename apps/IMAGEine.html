<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IMAGEine · Accidental Graphics</title>
  <meta name="description" content="Build and export live ASCII mosaics from images and webcam video.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/data.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@100..900,0..100&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/face cursor.png">
  <script defer src="../scripts/navConfig.js"></script>
  <script defer src="../scripts/navMenu.js"></script>
  <script src="../scripts/dataLayer.js"></script>
  <script defer src="../scripts/settingsToggle.js" data-panel="#controls"></script>
  <script src="../scripts/savedSettings.js"></script>
  <style>
    /* The canvas fills the stage minus a margin for the lab data (css/data.css), which sits outside it;
       its bitmap is sized from the canvas box in the script. */
    #asciiCanvas {
      position: absolute; top: var(--ag-hud-band, 22px); left: var(--ag-hud-side, 16px);
      width: calc(100% - 2 * var(--ag-hud-side, 16px)); height: calc(100% - 2 * var(--ag-hud-band, 22px));
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    .imgOrderItem__controls button { min-width: 32px; min-height: 32px; }
    @media (max-width: 768px), (pointer: coarse) {
      .imgOrderItem__controls button { min-width: 40px; min-height: 40px; font-size: 16px; }
      body.panel-ui-page #controls select { font-size: 16px; }
    }
    /* Bottom-sheet layout: the stage takes exactly the area above the sheet, the page never scrolls. */
    body.ag-sheet.panel-ui-page { height: 100dvh; overflow: hidden; }
    body.ag-sheet.panel-ui-page #main {
      height: calc(100dvh - var(--ag-nav-h, 60px) - var(--ag-sheet-h, 0px));
      min-height: 0; padding: 0; overflow: hidden; border-top: 0;
      flex: none; /* ends at the sheet instead of growing to the body height */
    }
    body.ag-sheet.panel-ui-page .canvas-stage { flex: 1 1 auto; min-height: 0; padding: 0; }
    /* Desktop: end the stage at the footer line so the HUD corners stay visible. */
    @media (min-width: 901px) { body.panel-ui-page:not(.ag-sheet) .canvas-stage { align-self: flex-start; height: calc(100dvh - 72px - 34px); flex: 1 1 0; } }
    body.ag-sheet .video-preview-wrapper {
      position: fixed; top: 38%; left: 8px; right: auto; bottom: auto; left: auto;
      align-items: flex-end; z-index: 90;
    }
    body.ag-sheet #video { width: 96px; height: auto; margin: 0; border-width: 1px; }
    body.ag-sheet .video-preview__shrink { min-height: 40px; }
    body.ag-sheet .app-year { display: none; }
    @media (max-width: 480px) { body.ag-sheet.panel-ui-page { --ag-nav-h: 60px; } }
    @media (min-width: 481px) { body.ag-sheet.panel-ui-page { --ag-nav-h: 72px; } }
  </style>
</head>

<body class="app-page panel-ui-page">

  <!-- Main layout: sidebar links + canvas rechts -->
  <div id="main">
    <div id="controls">
      <div class="panel-ui-header">
        <div>
          <p class="motion-eyebrow">IMAGEine</p>
          <h1>Settings</h1>
        </div>
        <label class="file-button file-button--full">Upload Images
          <input type="file" id="imgUpload" multiple accept="image/*">
        </label>
        <div class="motion-primary-actions" aria-label="Main actions">
          <button id="toggleCam" type="button">Start Webcam</button>
          <button id="exportBtn" type="button">Export Still</button>
        </div>
      </div>

      <details class="motion-group">
        <summary>Images</summary>
        <div class="motion-group-body">
          <div class="button-row">
            <button id="loadSamplesBtn" type="button">Load Sample Images</button>
            <button id="resetImagesBtn" type="button">Reset Images</button>
          </div>
          <div id="imgOrderContainer"></div>
          <div id="imgOrderPlaceholder" class="img-order-placeholder">Import images to build your ASCII stack.</div>
        </div>
      </details>

      <details class="motion-group">
        <summary>ASCII</summary>
        <div class="motion-group-body">
          <button id="randomAsciiBtn" type="button">Random ASCII</button>
          <div class="motion-control">
            <label for="gridSize">Cell size</label>
            <input type="range" id="gridSize" min="6" max="64" value="16" class="slider">
            <output id="gridSizeOut">16 px</output>
          </div>
          <div class="motion-control">
            <label for="contrast">Contrast</label>
            <input type="range" id="contrast" min="-100" max="100" value="0" class="slider">
            <output id="contrastOut">0</output>
          </div>
          <button id="invertBtn" type="button" aria-pressed="false">Invert: Off</button>
          <button id="toggleBaseBtn" type="button">Webcam Layer: On</button>
          <label for="cameraFacing">Camera</label>
          <select id="cameraFacing">
            <option value="user" selected>Front (mirrored)</option>
            <option value="environment">Back</option>
          </select>
          <label for="blendMode">Blend Mode</label>
          <select id="blendMode">
            <option value="source-over" selected>Normal</option>
            <option value="screen">Screen</option>
            <option value="lighten">Lighten</option>
            <option value="darken">Darken</option>
            <option value="multiply">Multiply</option>
            <option value="overlay">Overlay</option>
            <option value="difference">Difference</option>
            <option value="color-dodge">Color Dodge</option>
            <option value="hard-light">Hard Light</option>
          </select>
        </div>
      </details>
    </div>

    <!-- Canvas rechts -->
    <div class="canvas-stage">
      <div class="canvas-prompt" id="webcamPrompt">Start Webcam</div>
      <canvas id="asciiCanvas"></canvas>
    </div>
  </div>

<div class="video-preview-wrapper is-hidden">
  <video id="video" class="webcam-hidden" autoplay playsinline muted></video>
  <button type="button" id="videoToggleBtn" class="video-preview__shrink" aria-label="Toggle webcam preview">Show Preview</button>
</div>
<div class="app-year">2026 Accidental Graphics</div>
<script src="../scripts/sampleMedia.js"></script>
<script>
const MAX_IMAGES = 50;
const video = document.getElementById('video');
const canvas = document.getElementById('asciiCanvas');
const stage = canvas.parentElement;
const webcamPrompt = document.getElementById('webcamPrompt');
const ctx = canvas.getContext('2d');
const sampleCanvas = document.createElement('canvas');
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
const gridInput = document.getElementById('gridSize');
const contrastInput = document.getElementById('contrast');
const imgUpload = document.getElementById('imgUpload');
const imgOrderContainer = document.getElementById('imgOrderContainer');
const exportBtn = document.getElementById('exportBtn');
const resetImagesBtn = document.getElementById('resetImagesBtn');
const loadSamplesBtn = document.getElementById('loadSamplesBtn');
const randomAsciiBtn = document.getElementById('randomAsciiBtn');
const videoToggleBtn = document.getElementById('videoToggleBtn');
const videoPreviewWrapper = document.querySelector('.video-preview-wrapper');
const imgOrderPlaceholder = document.getElementById('imgOrderPlaceholder');
const toggleBaseBtn = document.getElementById('toggleBaseBtn');
const invertBtn = document.getElementById('invertBtn');
const toggleCamBtn = document.getElementById('toggleCam');
const blendModeSelect = document.getElementById('blendMode');
const cameraFacingSelect = document.getElementById('cameraFacing');
const controlsPanel = document.getElementById('controls');

let images = [];
let orderedImages = [];
let dragSrcEl = null;
let gridSize = parseInt(gridInput.value, 10);
let contrastFactor = 1;
let showVideoBase = true;
let invert = false;
let blendMode = blendModeSelect?.value || 'source-over';
let cameraFacing = cameraFacingSelect?.value || 'user';
let webcamStream = null;
let tiles = [];
let tilesKey = '';
let orderVersion = 0;
const uploadedObjectUrls = [];

// ---------- Data layer ----------
const hud = AGData.hud(canvas, { canvas, code: 'IMG', slots: { specimen: 'tr' } });
AGData.readouts(controlsPanel);

function bindOutput(input, outputId, format) {
  const out = document.getElementById(outputId);
  if (!out) return;
  const render = () => { out.textContent = format(input.value); };
  input.addEventListener('input', render);
  input.addEventListener('change', render);
  render();
}
bindOutput(gridInput, 'gridSizeOut', v => `${v} px`);
bindOutput(contrastInput, 'contrastOut', v => (v > 0 ? '+' : '') + v);

// ---------- Canvas size: the bitmap follows the canvas box (stage minus the data margin) ----------
function syncAsciiCanvasSize() {
  const width = Math.max(1, canvas.clientWidth);
  const height = Math.max(1, canvas.clientHeight);
  if (canvas.width === width && canvas.height === height) return;
  canvas.width = width;
  canvas.height = height;
  hud.refresh();
}

let resizeTimer = 0;
function scheduleCanvasSync() {
  // The sheet animates the stage height: resize the bitmap once it settles, not on every frame.
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(syncAsciiCanvasSize, 90);
}
syncAsciiCanvasSize();
if (window.ResizeObserver) new ResizeObserver(scheduleCanvasSync).observe(stage);
window.addEventListener('resize', scheduleCanvasSync);
window.addEventListener('load', syncAsciiCanvasSize);

// ---------- Prompt / order list ----------
function syncWebcamPrompt() {
  webcamPrompt?.classList.toggle('hidden', Boolean(webcamStream) || images.length > 0);
}

function updateOrderContainerState() {
  if (!imgOrderContainer) return;
  const hasItems = imgOrderContainer.children.length > 0;
  imgOrderContainer.classList.toggle('has-items', hasItems);
  imgOrderPlaceholder?.classList.toggle('hidden', hasItems);
  syncWebcamPrompt();
}

function resetImageStack() {
  images = [];
  orderedImages = [];
  uploadedObjectUrls.splice(0).forEach(url => {
    try { URL.revokeObjectURL(url); } catch (_) {}
  });
  renderOrderItems();
}

function createOrderItem(img, index) {
  const item = document.createElement('div');
  item.className = 'imgOrderItem';
  item.draggable = true;
  item.dataset.src = img.src;
  item.dataset.index = index;
  const thumb = document.createElement('div');
  thumb.className = 'imgOrderItem__thumb';
  thumb.style.backgroundImage = `url(${img.src})`;
  const label = document.createElement('span');
  label.textContent = `Level ${index + 1}`;
  const controls = document.createElement('div');
  controls.className = 'imgOrderItem__controls';
  const upBtn = document.createElement('button');
  upBtn.type = 'button';
  upBtn.textContent = '↑';
  upBtn.title = 'Move layer up';
  const downBtn = document.createElement('button');
  downBtn.type = 'button';
  downBtn.textContent = '↓';
  downBtn.title = 'Move layer down';
  controls.append(upBtn, downBtn);
  upBtn.addEventListener('click', e => {
    e.stopPropagation();
    moveOrderItem(item, -1);
  });
  downBtn.addEventListener('click', e => {
    e.stopPropagation();
    moveOrderItem(item, 1);
  });
  item.appendChild(thumb);
  item.appendChild(label);
  item.appendChild(controls);
  return item;
}

function renderOrderItems() {
  orderVersion++;
  imgOrderContainer.innerHTML = '';
  orderedImages.forEach((img, index) => {
    const item = createOrderItem(img, index);
    imgOrderContainer.appendChild(item);
    bindDragEvents(item);
  });
  imgOrderContainer.scrollTop = imgOrderContainer.scrollHeight;
  updateOrderContainerState();
}

function loadImageElement(src, { revokeUrl = false } = {}) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      if (revokeUrl) URL.revokeObjectURL(src);
      resolve(img);
    };
    img.onerror = () => {
      if (revokeUrl) URL.revokeObjectURL(src);
      reject(new Error('Could not load image.'));
    };
    img.src = src;
  });
}

async function addImageSource(src, options = {}) {
  if (images.length >= MAX_IMAGES) return false;
  const img = await loadImageElement(src, options);
  images.push(img);
  return true;
}

async function ingestSources(sources, { reset = true } = {}) {
  if (!sources.length) return;
  if (reset) resetImageStack();
  for (const source of sources) {
    if (images.length >= MAX_IMAGES) break;
    await addImageSource(source.src, { revokeUrl: source.revokeUrl });
  }
  orderedImages = [...images];
  renderOrderItems();
  hud.newSpecimen();
}

updateOrderContainerState();

imgUpload.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files).slice(0, MAX_IMAGES);
  resetImageStack();
  const sources = files.map(file => {
    const url = URL.createObjectURL(file);
    uploadedObjectUrls.push(url);
    return { src: url, revokeUrl: false };
  });
  try {
    await ingestSources(sources, { reset: false });
  } catch (err) {
    alert('Could not load one of the images. Try fewer files or different formats.');
  }
});

resetImagesBtn.addEventListener('click', () => {
  resetImageStack();
  imgUpload.value = '';
  hud.newSpecimen();
});

loadSamplesBtn?.addEventListener('click', async () => {
  const samples = window.SampleMedia?.getList?.('images') || [];
  if (!samples.length) {
    alert('No sample images available.');
    return;
  }
  const selections = samples.slice(0, MAX_IMAGES).map(sample => ({
    src: sample.preview || sample.src,
    revokeUrl: false
  }));
  try {
    await ingestSources(selections, { reset: true });
  } catch (err) {
    alert('Could not load sample images.');
  }
});

randomAsciiBtn?.addEventListener('click', async () => {
  const asciiChars = "!@#$%^&*()_+-=[]{}|;':\",.<>/?~`";
  const count = Math.min(MAX_IMAGES, asciiChars.length);
  const selections = [];
  for (let i = 0; i < count; i++) {
    const char = asciiChars[Math.floor(Math.random() * asciiChars.length)];
    selections.push({ src: generateAsciiSymbolDataURL(char), revokeUrl: false });
  }
  try {
    await ingestSources(selections, { reset: true });
  } catch (err) {
    alert('Could not generate ASCII symbols.');
  }
});

function generateAsciiSymbolDataURL(char) {
  const size = 64;
  const canvasEl = document.createElement('canvas');
  canvasEl.width = size;
  canvasEl.height = size;
  const context = canvasEl.getContext('2d');
  context.fillStyle = '#020202';
  context.fillRect(0, 0, size, size);
  context.font = '600 44px "Courier New", monospace';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.lineWidth = 3;
  context.strokeStyle = 'rgba(0,0,0,0.85)';
  context.strokeText(char, size / 2, size / 2);
  context.fillStyle = '#fefefe';
  context.shadowColor = 'rgba(0, 255, 255, 0.5)';
  context.shadowBlur = 6;
  context.fillText(char, size / 2, size / 2);
  return canvasEl.toDataURL('image/png');
}

// ---------- Settings ----------
gridInput.addEventListener('input', () => { gridSize = parseInt(gridInput.value, 10) || 16; });
contrastInput.addEventListener('input', () => { contrastFactor = Math.pow(2, (parseInt(contrastInput.value, 10) || 0) / 50); });

function setToggleLabel(btn, label, on) {
  btn.textContent = `${label}: ${on ? 'On' : 'Off'}`;
  btn.setAttribute('aria-pressed', String(on));
}
toggleBaseBtn?.addEventListener('click', () => {
  showVideoBase = !showVideoBase;
  setToggleLabel(toggleBaseBtn, 'Webcam Layer', showVideoBase);
});
setToggleLabel(toggleBaseBtn, 'Webcam Layer', showVideoBase);
invertBtn.addEventListener('click', () => {
  invert = !invert;
  setToggleLabel(invertBtn, 'Invert', invert);
});
blendModeSelect?.addEventListener('change', () => {
  blendMode = blendModeSelect.value || 'source-over';
});

// ---------- Webcam ----------
toggleCamBtn?.setAttribute('aria-pressed', 'false');
function updatePreviewToggleLabel() {
  if (!videoToggleBtn || !videoPreviewWrapper) return;
  const hidden = videoPreviewWrapper.classList.contains('is-hidden') || videoPreviewWrapper.classList.contains('collapsed');
  videoToggleBtn.setAttribute('aria-pressed', String(!hidden));
  videoToggleBtn.textContent = hidden ? 'Show Preview' : 'Hide Preview';
}
async function startWebcamPreview() {
  if (webcamStream) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    alert('Webcam is not available here (it needs a secure https page).');
    return;
  }
  try {
    webcamStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: cameraFacing }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = webcamStream;
    video.muted = true;
    await video.play();
    video.style.transform = cameraFacing === 'user' ? '' : 'none';
    video.classList.remove('webcam-hidden');
    videoPreviewWrapper?.classList.remove('is-hidden');
    videoPreviewWrapper?.classList.remove('collapsed');
    if (toggleCamBtn) toggleCamBtn.textContent = 'Stop Webcam';
    toggleCamBtn?.setAttribute('aria-pressed', 'true');
    syncWebcamPrompt();
    updatePreviewToggleLabel();
    hud.newSpecimen();
  } catch (e) {
    if (webcamStream) webcamStream.getTracks().forEach(t => t.stop());
    webcamStream = null;
    alert('Webcam error: ' + e.message);
  }
}
function stopWebcamPreview() {
  if (!webcamStream) return;
  webcamStream.getTracks().forEach(t => t.stop());
  webcamStream = null;
  video.pause();
  video.srcObject = null;
  video.classList.add('webcam-hidden');
  videoPreviewWrapper?.classList.add('is-hidden');
  if (toggleCamBtn) toggleCamBtn.textContent = 'Start Webcam';
  toggleCamBtn?.setAttribute('aria-pressed', 'false');
  syncWebcamPrompt();
  updatePreviewToggleLabel();
}
toggleCamBtn?.addEventListener('click', () => {
  if (webcamStream) stopWebcamPreview();
  else startWebcamPreview();
});
cameraFacingSelect?.addEventListener('change', () => {
  cameraFacing = cameraFacingSelect.value === 'environment' ? 'environment' : 'user';
  if (webcamStream) {
    stopWebcamPreview();
    startWebcamPreview();
  }
});
videoToggleBtn?.addEventListener('click', () => {
  if (!videoPreviewWrapper) return;
  videoPreviewWrapper.classList.toggle('collapsed');
  updatePreviewToggleLabel();
});
updatePreviewToggleLabel();

// Remember the settings between visits (scripts/savedSettings.js). Images are not stored.
AGSettings.persist('imageine', {
  controls: ['gridSize', 'contrast', 'blendMode', 'cameraFacing'],
  get: () => ({ showVideoBase, invert }),
  set: (saved) => {
    if (typeof saved.showVideoBase === 'boolean' && saved.showVideoBase !== showVideoBase) toggleBaseBtn?.click();
    if (typeof saved.invert === 'boolean' && saved.invert !== invert) invertBtn.click();
  },
});

// ---------- Export (the HUD is DOM only, so it is never in the PNG) ----------
exportBtn.addEventListener('click', () => {
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], 'ascii_still.png', { type: 'image/png' });
    const coarse = window.matchMedia('(pointer: coarse)').matches;
    if (coarse && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'IMAGEine still' });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'ascii_still.png';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, 'image/png');
});

// ---------- Level order (desktop drag, arrow buttons everywhere) ----------
function bindDragEvents(item) {
  item.addEventListener('dragstart', (e) => {
    dragSrcEl = item;
    e.dataTransfer.effectAllowed = 'move';
  });
  item.addEventListener('dragend', () => { dragSrcEl = null; });
  item.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  item.addEventListener('drop', (e) => {
    e.stopPropagation();
    if (!dragSrcEl || dragSrcEl === item) return;
    const from = Number(dragSrcEl.dataset.index);
    const to = Number(item.dataset.index);
    if (Number.isNaN(from) || Number.isNaN(to)) return;
    const [moved] = orderedImages.splice(from, 1);
    orderedImages.splice(to, 0, moved);
    renderOrderItems();
    dragSrcEl = null;
  });
}

function moveOrderItem(item, direction) {
  const currentIndex = Number(item.dataset.index);
  if (Number.isNaN(currentIndex)) return;
  const targetIndex = Math.max(0, Math.min(orderedImages.length - 1, currentIndex + direction));
  if (targetIndex === currentIndex) return;
  const [moved] = orderedImages.splice(currentIndex, 1);
  orderedImages.splice(targetIndex, 0, moved);
  renderOrderItems();
}

// ---------- Render ----------
// Tiles are pre-scaled once per grid/order change, so a frame is only cheap blits.
function ensureTiles() {
  const key = `${gridSize}|${orderVersion}`;
  if (key === tilesKey && tiles.length === orderedImages.length) return;
  tilesKey = key;
  tiles = orderedImages.map(img => {
    const tile = document.createElement('canvas');
    tile.width = gridSize;
    tile.height = gridSize;
    tile.getContext('2d').drawImage(img, 0, 0, gridSize, gridSize);
    return tile;
  });
}

// Draws the (mirrored) video cropped to fill w x h, like object-fit: cover.
function drawVideoCover(targetCtx, w, h, mirror) {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const scale = Math.max(w / vw, h / vh);
  const sw = w / scale;
  const sh = h / scale;
  targetCtx.save();
  if (mirror) {
    targetCtx.translate(w, 0);
    targetCtx.scale(-1, 1);
  }
  targetCtx.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, w, h);
  targetCtx.restore();
}

let drewLastFrame = false;
let renderMs = 0;
let hudTick = 0;

function render() {
  requestAnimationFrame(render);
  const t0 = performance.now();
  const width = canvas.width;
  const height = canvas.height;
  const hasVideoFrame = Boolean(webcamStream) && video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 2;
  const hasTiles = images.length > 0 && orderedImages.length === images.length;

  if (!hasTiles && !(hasVideoFrame && showVideoBase)) {
    if (drewLastFrame) {
      ctx.clearRect(0, 0, width, height);
      drewLastFrame = false;
    }
    return;
  }
  drewLastFrame = true;
  const mirror = cameraFacing === 'user';
  const cols = Math.ceil(width / gridSize);
  const rows = Math.ceil(height / gridSize);

  let data = null;
  if (hasTiles && hasVideoFrame) {
    // One sample per cell: the video is averaged down to cols x rows instead of reading every pixel.
    if (sampleCanvas.width !== cols || sampleCanvas.height !== rows) {
      sampleCanvas.width = cols;
      sampleCanvas.height = rows;
      sampleCtx.imageSmoothingQuality = 'high';
    }
    drawVideoCover(sampleCtx, cols, rows, mirror);
    data = sampleCtx.getImageData(0, 0, cols, rows).data;
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, width, height);
  if (showVideoBase && hasVideoFrame) drawVideoCover(ctx, width, height, mirror);

  if (hasTiles) {
    ensureTiles();
    const n = tiles.length;
    const step = 255 / n;
    const time = performance.now() * 0.001;
    ctx.globalAlpha = showVideoBase && hasVideoFrame ? 0.9 : 1;
    ctx.globalCompositeOperation = blendMode || 'source-over';
    for (let row = 0; row < rows; row++) {
      const y = row * gridSize;
      for (let col = 0; col < cols; col++) {
        const x = col * gridSize;
        let brightness;
        if (data) {
          const idx = (row * cols + col) * 4;
          brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
        } else {
          brightness = ((Math.sin(x * 0.04 + time) + Math.cos(y * 0.04 - time)) / 2 + 0.5) * 255;
        }
        brightness = (brightness - 127.5) * contrastFactor + 127.5;
        if (brightness < 0) brightness = 0; else if (brightness > 254.99) brightness = 254.99;
        if (invert) brightness = 254.99 - brightness;
        ctx.drawImage(tiles[Math.floor(brightness / step)], x, y);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  hud.frame();
  renderMs += (performance.now() - t0 - renderMs) * 0.1;
  if (++hudTick % 8 === 0) {
    hud.set('Source', hasVideoFrame ? `${video.videoWidth} × ${video.videoHeight}` : 'GEN', hasVideoFrame ? 'px' : '', 'tl');
    hud.set('Grid', `${cols} × ${rows}`, `= ${AGData.fmt(cols * rows, 0, 5)} cells`);
    hud.set('Sampled', hasVideoFrame && hasTiles ? AGData.fmt(cols * rows, 0, 5) : '—', 'px/f');
    hud.set('Palette', AGData.fmt(images.length, 0, 2), 'tiles');
    hud.set('Render', AGData.fmt(renderMs, 1, 4), 'ms');
  }
}
requestAnimationFrame(render);
</script>
</body>
</html>
