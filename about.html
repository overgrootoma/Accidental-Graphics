<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About · Accidental Graphics</title>
  <meta name="description" content="Accidental Graphics: small browser tools for making graphics outside Illustrator and Photoshop. By Jorne Scholiers.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@100..900,0..100&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="images/face cursor.png">
  <script defer src="scripts/navConfig.js"></script>
  <script defer src="scripts/navMenu.js"></script>
</head>

<body>



<style>
    .creator-link {
      color: var(--blue-accent);
      text-decoration: none;
    }

    .creator-link .stretch-text {
      display: inline-block;
      transform: scaleY(1);
      transform-origin: center;
      transition: transform 160ms steps(2, end);
    }

    .creator-link:hover .stretch-text,
    .creator-link:focus-visible .stretch-text {
      transform: scaleY(5);
    }

    .about-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 30px 0 0;
      padding: 0;
      list-style: none;
    }

    #drawPrompt {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(2rem, 8vw, 5rem);
      letter-spacing: 0.6rem;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
      font-weight: 700;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      text-align: center;
    }

    #drawPrompt.hidden {
      opacity: 0;
      transform: translate(-50%, -20px);
    }
  </style>




<div id="main" >
  <!-- Left text column -->
  <div id="controls" >
    <h1>about</h1>
    <div id="aboutText" style="display: contents"></div>
    <div class="text-block">Made by <a href="https://jornescholiers.be" target="_blank" rel="noopener noreferrer" class="creator-link"><span class="stretch-text">Jorne Scholiers</span></a></div>
    <ul class="about-links" id="aboutLinks" aria-label="Links"></ul>
  </div>

  <!-- Right canvas -->
  <div id="right" style="flex:1; position:relative; overflow:hidden;">
    <div id="drawPrompt">draw</div>
    <canvas id="drawingCanvas" style="width:100%; height:100%; display:block; cursor: url('images/face cursor.png') 16 16, auto;"></canvas>
  </div>
</div>

<script>
// Text and links come from content/about.json (Pages CMS).
window.addEventListener('DOMContentLoaded', () => {
  if (!window.AGContent) return;
  AGContent.load('about').then(data => {
    const textEl = document.getElementById('aboutText');
    String(data.text || '').split(/\n\s*\n/).map(part => part.trim()).filter(Boolean).forEach(part => {
      const block = document.createElement('div');
      block.className = 'text-block';
      block.textContent = part;
      textEl.appendChild(block);
    });
    const linksEl = document.getElementById('aboutLinks');
    (Array.isArray(data.links) ? data.links : []).filter(item => item && item.label && item.url).forEach(item => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'creator-link';
      const label = document.createElement('span');
      label.className = 'stretch-text';
      label.textContent = item.label;
      a.appendChild(label);
      li.appendChild(a);
      linksEl.appendChild(li);
    });
  }).catch(() => {});
});

const canvas = document.getElementById('drawingCanvas');
const ctx = canvas.getContext('2d');
const drawPrompt = document.getElementById('drawPrompt');
let canvasWidth, canvasHeight;
let promptVisible = true;

function resizeCanvas() {
  canvasWidth = canvas.parentElement.clientWidth;
  canvasHeight = canvas.parentElement.clientHeight;
  canvas.width = canvasWidth;
  canvas.height = canvasHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Load brush images (1–15)
const brushImages = [];
for (let i = 1; i <= 15; i++) {
  const img = new Image();
  img.src = `images/brushes/brush${i}.png`; // use relative path
  brushImages.push(img);
}

// Drawing
let drawing = false;
function hidePrompt(){
  if(!promptVisible) return;
  promptVisible = false;
  drawPrompt.classList.add('hidden');
}
canvas.style.touchAction = 'none';
canvas.addEventListener('pointerdown', (e) => {
  drawing = true;
  hidePrompt();
  canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointerup', () => drawing = false);
canvas.addEventListener('pointercancel', () => drawing = false);

canvas.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  hidePrompt();
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  // Cycle through brushes 1–15 sequentially
  const brushIndex = Math.floor(Math.random() * brushImages.length);
  const brush = brushImages[brushIndex];
  const size = 50 + Math.random() * 30; // random size

  ctx.drawImage(brush, x - size/2, y - size/2, size, size);
});
</script>

<div class="app-year">2026 Accidental Graphics</div>
</body>
</html>
