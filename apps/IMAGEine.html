<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMAGEine · Accidental Graphics</title>
  <meta name="description" content="Build and export live ASCII mosaics from images and webcam video.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@100..900,0..100&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/face cursor.png">
  <script defer src="../scripts/navConfig.js"></script>
  <script defer src="../scripts/navMenu.js"></script>
</head>

<body class="app-page panel-ui-page">

  <!-- Main layout: sidebar links + canvas rechts -->
  <div id="main">
    <div id="controls">
      <div class="panel-ui-header">
        <div>
          <p class="motion-eyebrow">IMAGEine</p>
          <h1>Settings</h1>
        </div>
        <label class="file-button file-button--full">Upload Images
          <input type="file" id="imgUpload" multiple accept="image/*">
        </label>
        <div class="motion-primary-actions" aria-label="Main actions">
          <button id="toggleCam" type="button">Start Webcam</button>
          <button id="exportBtn" type="button">Export Still</button>
        </div>
      </div>

      <label class="panel-ui-hidden">Maximum number of images: 50 <input type="hidden" id="numImages" min="2" max="50" value="50"></label>

      <details class="motion-group">
        <summary>Images</summary>
        <div class="motion-group-body">
          <div class="button-row">
            <button id="loadSamplesBtn" type="button">Load Sample Images</button>
            <button id="resetImagesBtn" type="button">Reset Images</button>
          </div>
          <div id="imgOrderContainer"></div>
          <div id="imgOrderPlaceholder" class="img-order-placeholder">Import images to build your ASCII stack.</div>
        </div>
      </details>

      <details class="motion-group">
        <summary>ASCII</summary>
        <div class="motion-group-body">
          <button id="randomAsciiBtn" type="button">Random ASCII</button>
          <div class="motion-control">
            <label for="gridSize">Grid</label>
            <input type="range" id="gridSize" min="4" max="64" value="16" class="slider">
            <output>16</output>
          </div>
          <button id="toggleBaseBtn" type="button">Webcam Layer: On</button>
          <label for="blendMode">Blend Mode</label>
          <select id="blendMode">
            <option value="source-over" selected>Normal</option>
            <option value="screen">Screen</option>
            <option value="lighten">Lighten</option>
            <option value="darken">Darken</option>
            <option value="multiply">Multiply</option>
            <option value="overlay">Overlay</option>
            <option value="difference">Difference</option>
            <option value="color-dodge">Color Dodge</option>
            <option value="hard-light">Hard Light</option>
          </select>
        </div>
      </details>
    </div>

    <!-- Canvas rechts -->
    <div class="canvas-stage">
      <div class="canvas-prompt" id="webcamPrompt">Start Webcam</div>
      <canvas id="asciiCanvas"></canvas>
    </div>
  </div>

<div class="video-preview-wrapper is-hidden">
  <video id="video" class="webcam-hidden" autoplay playsinline muted></video>
  <button type="button" id="videoToggleBtn" class="video-preview__shrink" aria-label="Toggle webcam preview">Show Preview</button>
</div>
<div class="app-year">2026 Accidental Graphics</div>
<script src="../scripts/sampleMedia.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('asciiCanvas');
const webcamPrompt = document.getElementById('webcamPrompt');
const ctx = canvas.getContext('2d');
const frameCanvas = document.createElement('canvas');
const frameCtx = frameCanvas.getContext('2d');
const gridInput = document.getElementById('gridSize');
const imgUpload = document.getElementById('imgUpload');
const imgOrderContainer = document.getElementById('imgOrderContainer');
const exportBtn = document.getElementById('exportBtn');
const numImagesInput = document.getElementById('numImages');
const resetImagesBtn = document.getElementById('resetImagesBtn');
const loadSamplesBtn = document.getElementById('loadSamplesBtn');
const randomAsciiBtn = document.getElementById('randomAsciiBtn');
const videoToggleBtn = document.getElementById('videoToggleBtn');
const videoPreviewWrapper = document.querySelector('.video-preview-wrapper');
const imgOrderPlaceholder = document.getElementById('imgOrderPlaceholder');
const toggleBaseBtn = document.getElementById('toggleBaseBtn');
const toggleCamBtn = document.getElementById('toggleCam');
const blendModeSelect = document.getElementById('blendMode');
const controlsPanel = document.getElementById('controls');
const layoutGap = 24;
const stackedQuery = window.matchMedia('(max-width: 900px)');
const drawMirroredVideo = (targetCtx, width, height) => {
  targetCtx.save();
  targetCtx.scale(-1, 1);
  targetCtx.drawImage(video, -width, 0, width, height);
  targetCtx.restore();
};

let webcamPromptVisible = true;
function hideWebcamPrompt(){
  if(!webcamPrompt || !webcamPromptVisible) return;
  webcamPromptVisible = false;
  webcamPrompt.classList.add('hidden');
}
function showWebcamPrompt(){
  if(!webcamPrompt) return;
  webcamPromptVisible = true;
  webcamPrompt.classList.remove('hidden');
}

function computeAsciiCanvasSize() {
  const parentWidth = canvas.parentElement ? canvas.parentElement.getBoundingClientRect().width : window.innerWidth;
  const controlsWidth = controlsPanel ? controlsPanel.getBoundingClientRect().width : 0;
  const isStacked = stackedQuery.matches;
  const width = isStacked ? parentWidth : Math.max(360, parentWidth - controlsWidth - layoutGap);
  const headerHeight = document.querySelector('header')?.offsetHeight || 0;
  const controlsHeight = controlsPanel ? controlsPanel.offsetHeight : 0;
  const viewportHeight = window.innerHeight - headerHeight - 24;
  const height = Math.max(320, isStacked ? viewportHeight - controlsHeight : viewportHeight);
  return { width: Math.round(width), height: Math.round(height) };
}

function syncAsciiCanvasSize() {
  const { width, height } = computeAsciiCanvasSize();
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    frameCanvas.width = width;
    frameCanvas.height = height;
  }
}

syncAsciiCanvasSize();
if (stackedQuery.addEventListener) {
  stackedQuery.addEventListener('change', syncAsciiCanvasSize);
} else if (stackedQuery.addListener) {
  stackedQuery.addListener(syncAsciiCanvasSize);
}
window.addEventListener('resize', syncAsciiCanvasSize);
window.addEventListener('load', syncAsciiCanvasSize);

let images = [];
let orderedImages = [];
let dragSrcEl = null;
let gridSize = parseInt(gridInput.value,10);
let numImages = parseInt(numImagesInput.value,10);
let showVideoBase = true;
let blendMode = blendModeSelect?.value || 'source-over';
const uploadedObjectUrls = [];

function updateOrderContainerState() {
  if (!imgOrderContainer) return;
  if (imgOrderContainer.children.length) {
    imgOrderContainer.classList.add('has-items');
    imgOrderPlaceholder?.classList.add('hidden');
  } else {
    imgOrderContainer.classList.remove('has-items');
    imgOrderPlaceholder?.classList.remove('hidden');
  }
}

function resetImageStack() {
  images = [];
  orderedImages = [];
  uploadedObjectUrls.splice(0).forEach(url=>{
    try{ URL.revokeObjectURL(url); }catch(_){}
  });
  renderOrderItems();
}

function createOrderItem(img, index) {
  const item = document.createElement('div');
  item.className = 'imgOrderItem';
  item.draggable = true;
  item.dataset.src = img.src;
  item.dataset.index = index;
  const thumb = document.createElement('div');
  thumb.className = 'imgOrderItem__thumb';
  thumb.style.backgroundImage = `url(${img.src})`;
  const label = document.createElement('span');
  label.textContent = `Level ${index+1}`;
  const controls = document.createElement('div');
  controls.className = 'imgOrderItem__controls';
  const upBtn = document.createElement('button');
  upBtn.type = 'button';
  upBtn.textContent = '↑';
  upBtn.title = 'Move layer up';
  const downBtn = document.createElement('button');
  downBtn.type = 'button';
  downBtn.textContent = '↓';
  downBtn.title = 'Move layer down';
  controls.append(upBtn, downBtn);
  upBtn.addEventListener('click', e => {
    e.stopPropagation();
    moveOrderItem(item, -1);
  });
  downBtn.addEventListener('click', e => {
    e.stopPropagation();
    moveOrderItem(item, 1);
  });
  item.appendChild(thumb);
  item.appendChild(label);
  item.appendChild(controls);
  return item;
}

function renderOrderItems(){
  imgOrderContainer.innerHTML = '';
  orderedImages.forEach((img, index)=>{
    const item = createOrderItem(img, index);
    imgOrderContainer.appendChild(item);
    bindDragEvents(item);
  });
  imgOrderContainer.scrollTop = imgOrderContainer.scrollHeight;
  updateOrderContainerState();
}

function loadImageElement(src, { revokeUrl = false } = {}) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      if (revokeUrl) URL.revokeObjectURL(src);
      resolve(img);
    };
    img.onerror = () => {
      if (revokeUrl) URL.revokeObjectURL(src);
      reject(new Error('Could not load image.'));
    };
    img.src = src;
  });
}

async function addImageSource(src, options = {}) {
  if (images.length >= numImages) {
    return false;
  }
  const img = await loadImageElement(src, options);
  images.push(img);
  return true;
}

async function ingestSources(sources, { reset = true } = {}) {
  if (!sources.length) return;
  if (reset) resetImageStack();
  for (const source of sources) {
    if (images.length >= numImages) break;
    await addImageSource(source.src, { revokeUrl: source.revokeUrl });
  }
  orderedImages = [...images];
  renderOrderItems();
  syncAsciiCanvasSize();
}

function refreshOrderedImagesFromDOM() {
  orderedImages = Array.from(imgOrderContainer.children).map(child =>
    images.find(img => img.src === child.dataset.src)
  ).filter(Boolean);
}

numImagesInput.addEventListener('input', ()=>{
  numImages = parseInt(numImagesInput.value,10);
});

updateOrderContainerState();

imgUpload.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files).slice(0,numImages);
  resetImageStack();
  const sources = files.map(file => {
    const url = URL.createObjectURL(file);
    uploadedObjectUrls.push(url);
    return { src: url, revokeUrl: false };
  });
  try {
    await ingestSources(sources, { reset: false });
  } catch (err) {
    alert('Could not load one of the images. Try fewer files or different formats.');
  }
});


resetImagesBtn.addEventListener('click', ()=>{
  resetImageStack();
  imgUpload.value = '';
  syncAsciiCanvasSize();
});

loadSamplesBtn?.addEventListener('click', async ()=>{
  const samples = window.SampleMedia?.getList?.('images') || [];
  if(!samples.length){
    alert('No sample images available.');
    return;
  }
  const selections = samples.slice(0, numImages).map(sample=>({
    src: sample.preview || sample.src,
    revokeUrl: false
  }));
  try{
    await ingestSources(selections, { reset: true });
  } catch(err){
    alert('Could not load sample images.');
  }
});

randomAsciiBtn?.addEventListener('click', async ()=>{
  const asciiChars = "!@#$%^&*()_+-=[]{}|;':\",.<>/?~`";
  const count = Math.min(numImages, asciiChars.length);
  const selections = [];
  for(let i=0;i<count;i++){
    const char = asciiChars[Math.floor(Math.random()*asciiChars.length)];
    selections.push({ src: generateAsciiSymbolDataURL(char), revokeUrl: false });
  }
  try{
    await ingestSources(selections, { reset: true });
  } catch(err){
    alert('Could not generate ASCII symbols.');
  }
});

function generateAsciiSymbolDataURL(char){
  const size = 64;
  const canvasEl = document.createElement('canvas');
  canvasEl.width = size;
  canvasEl.height = size;
  const context = canvasEl.getContext('2d');
  context.fillStyle = '#020202';
  context.fillRect(0,0,size,size);
  context.font = '600 44px "Courier New", monospace';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.lineWidth = 3;
  context.strokeStyle = 'rgba(0,0,0,0.85)';
  context.strokeText(char, size/2, size/2);
  context.fillStyle = '#fefefe';
  context.shadowColor = 'rgba(0, 255, 255, 0.5)';
  context.shadowBlur = 6;
  context.fillText(char, size/2, size/2);
  return canvasEl.toDataURL('image/png');
}

gridInput.addEventListener('input', ()=>{ gridSize = parseInt(gridInput.value,10); });

let webcamStream = null;
toggleCamBtn?.setAttribute('aria-pressed', 'false');
function updatePreviewToggleLabel(){
  if(!videoToggleBtn || !videoPreviewWrapper) return;
  const hidden = videoPreviewWrapper.classList.contains('is-hidden') || videoPreviewWrapper.classList.contains('collapsed');
  videoToggleBtn.setAttribute('aria-pressed', String(!hidden));
  if(hidden){
    videoToggleBtn.textContent = 'Show Preview';
  } else {
    videoToggleBtn.textContent = 'Hide Preview';
  }
}
async function startWebcamPreview(){
  if(webcamStream) return;
  try{
    webcamStream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = webcamStream;
    await video.play();
    video.classList.remove('webcam-hidden');
    videoPreviewWrapper?.classList.remove('is-hidden');
    videoPreviewWrapper?.classList.remove('collapsed');
    if(toggleCamBtn) toggleCamBtn.textContent = 'Stop Webcam';
    toggleCamBtn?.setAttribute('aria-pressed', 'true');
    hideWebcamPrompt();
    updatePreviewToggleLabel();
  } catch(e){
    alert('Webcam error: ' + e.message);
  }
}
function stopWebcamPreview(){
  if(!webcamStream) return;
  webcamStream.getTracks().forEach(t => t.stop());
  webcamStream = null;
  video.pause();
  video.srcObject = null;
  video.classList.add('webcam-hidden');
  videoPreviewWrapper?.classList.add('is-hidden');
  if(toggleCamBtn) toggleCamBtn.textContent = 'Start Webcam';
  toggleCamBtn?.setAttribute('aria-pressed', 'false');
  showWebcamPrompt();
  updatePreviewToggleLabel();
}
toggleCamBtn?.addEventListener('click', ()=>{
  if(webcamStream){
    stopWebcamPreview();
  } else {
    startWebcamPreview();
  }
});
videoToggleBtn?.addEventListener('click', ()=>{
  if(!videoPreviewWrapper) return;
  videoPreviewWrapper.classList.toggle('collapsed');
  updatePreviewToggleLabel();
});

toggleBaseBtn?.addEventListener('click', ()=>{
  showVideoBase = !showVideoBase;
  if(toggleBaseBtn) toggleBaseBtn.textContent = `Webcam Layer: ${showVideoBase ? 'On' : 'Off'}`;
  toggleBaseBtn?.setAttribute('aria-pressed', String(showVideoBase));
});
if(toggleBaseBtn){
  toggleBaseBtn.textContent = `Webcam Layer: ${showVideoBase ? 'On' : 'Off'}`;
  toggleBaseBtn.setAttribute('aria-pressed', String(showVideoBase));
}
blendModeSelect?.addEventListener('change', ()=>{
  blendMode = blendModeSelect.value || 'source-over';
});
updatePreviewToggleLabel();

exportBtn.addEventListener('click', ()=>{
  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = 'ascii_still.png';
  link.click();
});

function bindDragEvents(item){
  if (item.dataset.dragBound === 'true') return;
  item.dataset.dragBound = 'true';
  item.addEventListener('dragstart', (e) => {
    dragSrcEl = item;
    e.dataTransfer.effectAllowed = 'move';
  });
  item.addEventListener('dragend', () => {
    dragSrcEl = null;
  });
  item.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  item.addEventListener('drop', (e) => {
    e.stopPropagation();
    if(!dragSrcEl || dragSrcEl === item) return;
    const nodes = Array.from(imgOrderContainer.children);
    const dragIndex = nodes.indexOf(dragSrcEl);
    const dropIndex = nodes.indexOf(item);
    if(dragIndex < 0 || dropIndex < 0) return;
    if(dragIndex < dropIndex){
      imgOrderContainer.insertBefore(dragSrcEl, item.nextSibling);
    } else {
      imgOrderContainer.insertBefore(dragSrcEl, item);
    }
    refreshOrderedImagesFromDOM();
    renderOrderItems();
    dragSrcEl = null;
  });
}

function enableDragReorder(){
  const items = imgOrderContainer.querySelectorAll('.imgOrderItem');
  items.forEach(bindDragEvents);
}

function moveOrderItem(item, direction){
  const currentIndex = Number(item.dataset.index);
  if(Number.isNaN(currentIndex)) return;
  let targetIndex = currentIndex + direction;
  targetIndex = Math.max(0, Math.min(orderedImages.length - 1, targetIndex));
  if(targetIndex === currentIndex) return;
  const [moved] = orderedImages.splice(currentIndex,1);
  orderedImages.splice(targetIndex,0,moved);
  renderOrderItems();
}

function drawASCIIImages(){
  if(orderedImages.length !== images.length || images.length === 0) {
    requestAnimationFrame(drawASCIIImages);
    return;
  }

  syncAsciiCanvasSize();
  const width = canvas.width;
  const height = canvas.height;

  const hasVideoFrame = video.videoWidth > 0 && video.videoHeight > 0;
  let data = null;
  if(hasVideoFrame){
    if(frameCanvas.width !== width || frameCanvas.height !== height){
      frameCanvas.width = width;
      frameCanvas.height = height;
    }
    drawMirroredVideo(frameCtx,width,height);
    data = frameCtx.getImageData(0,0,width,height).data;
  }

  ctx.clearRect(0,0,width,height);
  if(showVideoBase && hasVideoFrame){
    drawMirroredVideo(ctx,width,height);
  }

  ctx.save();
  ctx.globalAlpha = showVideoBase && hasVideoFrame ? 0.9 : 1;
  ctx.globalCompositeOperation = blendMode || 'source-over';

  const time = performance.now() * 0.001;

  for(let y=0; y<height; y+=gridSize){
    for(let x=0; x<width; x+=gridSize){
      let brightness;
      if(data){
        const idx = (y*width + x)*4;
        const r = data[idx];
        const g = data[idx+1];
        const b = data[idx+2];
        brightness = (r+g+b)/3;
      } else {
        brightness = ((Math.sin((x*0.04)+time) + Math.cos((y*0.04)-time))/2 + 0.5) * 255;
      }
      let level = Math.floor(brightness / (255 / images.length));
      level = Math.min(level, images.length-1);
      const img = orderedImages[level];
      if(img){
        ctx.drawImage(img, x, y, gridSize, gridSize);
      }
    }
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(drawASCIIImages);
}
video.addEventListener('play', ()=>drawASCIIImages());
video.addEventListener('play', hideWebcamPrompt);
</script>
</body>
</html>
